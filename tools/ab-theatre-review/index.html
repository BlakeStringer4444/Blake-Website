<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AB Theatre Review</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="AB Theatre Review">
  <meta property="og:description" content="Alayne & Blake's private play-scoring tool.">
  <meta property="og:url" content="https://www.blakestringer.com/tools/ab-theatre-review">
  <meta property="og:site_name" content="Blake Stringer">
  <meta property="og:locale" content="en_AU">
  <meta property="og:image" content="https://www.blakestringer.com/Images/meta-og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Blake Stringer | Actor · Musician">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AB Theatre Review">
  <meta name="twitter:description" content="Alayne & Blake's private play-scoring tool.">
  <meta name="twitter:image" content="https://www.blakestringer.com/Images/meta-og.jpg">
  <link rel="icon" type="image/png" href="/Images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/Images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4ef; --fg: #1a1a1a; --muted: #86867f;
      --border: rgba(0,0,0,0.12); --card-bg: #ffffff;
      --purple: #9933ff; --lime: #D4FF1A;
      /* Alayne = chartreuse, Blake = purple — deepened here for contrast on the light bg */
      --alayne: #6f9e00; --blake: #9933ff;
      --font: 'DM Mono', monospace;
    }
    [data-theme="dark"] {
      --bg: #0f0f0f; --fg: #f0f0eb; --muted: #85857f;
      --border: rgba(255,255,255,0.13); --card-bg: #171717;
      --alayne: #c2f000; --blake: #b388ff;
    }
    [data-theme="terminal"] {
      --bg: #000000; --fg: #ffffff; --muted: rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.22); --card-bg: #000000;
      --alayne: #c2f000; --blake: #b388ff;
      /* Terminal = stark black & white: the generic accent (--lime) becomes white,
         which flows through every dark/terminal chrome rule below. The only colour
         left is the two reviewers' identity (chartreuse / purple). */
      --lime: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* touch-action: manipulation keeps pinch-zoom + scrolling but kills the
       double-tap-to-zoom gesture on mobile. */
    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--fg); touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
    [data-theme="dark"] :focus-visible, [data-theme="terminal"] :focus-visible { outline-color: var(--lime); }
    #app { min-height: 100%; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    .ab-header { padding: 26px 40px 20px; background: var(--bg); }
    .ab-header-top { display: flex; align-items: flex-start; justify-content: flex-end; gap: 12px; }
    .ab-actions { display: flex; gap: 10px; }
    .ab-icon-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      width: 44px; height: 44px; border-radius: 2px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: all 0.2s; flex-shrink: 0; font-family: var(--font);
      touch-action: manipulation;
    }
    #ab-theme-btn { font-size: 16px; }
    #ab-font-btn  { font-size: 13px; letter-spacing: -0.5px; }
    .ab-icon-btn:hover { border-color: var(--purple); color: var(--purple); }
    .ab-icon-btn.active { border-color: var(--purple); color: var(--purple); background: color-mix(in srgb, var(--purple) 12%, transparent); }
    [data-theme="dark"] .ab-icon-btn:hover, [data-theme="terminal"] .ab-icon-btn:hover,
    [data-theme="dark"] .ab-icon-btn.active, [data-theme="terminal"] .ab-icon-btn.active { border-color: var(--lime); color: var(--lime); }
    [data-theme="dark"] .ab-icon-btn.active, [data-theme="terminal"] .ab-icon-btn.active { background: color-mix(in srgb, var(--lime) 12%, transparent); }
    .ab-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px, 8vw, 88px); letter-spacing: 5px; line-height: 1; color: var(--fg); }
    .ab-title .a { color: var(--alayne); }
    .ab-title .b { color: var(--blake); }
    .sc-range { touch-action: none; }  /* reliable half-step dragging on touch */
    .ab-subtitle { font-size: 8px; letter-spacing: 1.5px; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
    @media (max-width: 639px) { .ab-header { padding: 18px 18px 14px; } .ab-header-top { margin-bottom: 18px; } }

    /* ── LANDING (pick a reviewer) ── */
    #landing { flex: 1; display: flex; flex-direction: column; }
    .ab-split { flex: 1; display: flex; min-height: 340px; }
    .ab-half {
      flex: 1; border: none; cursor: pointer; background: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: var(--font); color: var(--fg); transition: background 0.2s; position: relative;
      padding: 40px 20px;
    }
    .ab-half.alayne { border-right: 1px solid var(--border); }
    .ab-half.alayne:hover { background: color-mix(in srgb, var(--alayne) 10%, transparent); }
    .ab-half.blake:hover  { background: color-mix(in srgb, var(--blake) 10%, transparent); }
    .ab-half-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(46px, 9vw, 96px); letter-spacing: 4px; line-height: 0.9; }
    .ab-half.alayne .ab-half-name { color: var(--alayne); }
    .ab-half.blake  .ab-half-name { color: var(--blake); }
    .ab-half-sub { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .ab-half-count { font-size: 11px; letter-spacing: 1px; color: var(--fg); }
    .ab-compare-bar { display: flex; justify-content: center; padding: 22px; border-top: 1px solid var(--border); }
    .ab-compare-btn {
      background: none; border: 1px solid var(--purple); color: var(--purple);
      font-family: var(--font); font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      padding: 13px 40px; cursor: pointer; transition: all 0.15s;
    }
    .ab-compare-btn:hover { background: var(--purple); color: #fff; }
    [data-theme="dark"] .ab-compare-btn, [data-theme="terminal"] .ab-compare-btn { border-color: var(--lime); color: var(--lime); }
    [data-theme="dark"] .ab-compare-btn:hover, [data-theme="terminal"] .ab-compare-btn:hover { background: var(--lime); color: #000; }
    @media (max-width: 639px) { .ab-split { flex-direction: column; } .ab-half.alayne { border-right: none; border-bottom: 1px solid var(--border); } }

    /* ── SCREENS ── */
    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }
    .ab-subbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 40px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--card-bg); position: sticky; top: 0; z-index: 5;
    }
    .ab-crumb { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; }
    .ab-crumb.alayne { color: var(--alayne); } .ab-crumb.blake { color: var(--blake); }
    .ab-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-family: var(--font); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 7px 12px; cursor: pointer; border-radius: 2px; transition: all 0.15s;
    }
    .ab-btn:hover { border-color: var(--purple); color: var(--purple); }
    .ab-btn.on { border-color: var(--purple); color: var(--purple); background: color-mix(in srgb, var(--purple) 10%, transparent); }
    [data-theme="terminal"] .ab-btn:hover,
    [data-theme="terminal"] .ab-btn.on { border-color: #fff; color: #fff; background: rgba(255,255,255,0.08); }
    [data-theme="terminal"] .ab-search:focus { border-color: #fff; }
    .ab-search {
      flex: 1; min-width: 130px; background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      font-family: var(--font); font-size: 11px; padding: 8px 12px; border-radius: 2px;
    }
    .ab-search:focus { outline: none; border-color: var(--purple); }
    .ab-body { flex: 1; overflow-y: auto; padding: 20px 40px 60px; }
    @media (max-width: 639px) { .ab-subbar { padding: 10px 16px; } .ab-body { padding: 16px 14px 50px; } }

    .ab-year-head { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--muted); margin: 22px 0 10px; }
    .ab-year-head:first-child { margin-top: 4px; }
    .ab-divider {
      display: flex; align-items: center; gap: 12px; margin: 26px 0 12px;
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    }
    .ab-divider::before, .ab-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── PLAY CARD ── */
    .play-card { border: 1px solid var(--border); background: var(--card-bg); margin-bottom: 12px; }
    .play-card.locked { opacity: 0.6; }
    .play-card.archive { opacity: 0.7; margin-bottom: 6px; }
    .play-card.archive .pc-head { padding: 10px 16px; align-items: center; }
    .arch-year { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--muted); }
    /* Title column shrinks/wraps; the total stays pinned top-right regardless of title length. */
    .pc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
    .pc-head > div:first-child { min-width: 0; }
    .pc-title { font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
    .pc-meta { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .pc-total {
      font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 1px; line-height: 1;
      color: var(--me); white-space: nowrap; flex-shrink: 0;
    }
    .pc-total small { font-size: 13px; color: var(--muted); }
    .pc-total.unset { color: var(--muted); opacity: 0.5; }
    .pc-body { padding: 4px 16px 16px; }
    .pc-locked-msg { padding: 8px 16px 16px; font-size: 10px; letter-spacing: 1px; color: var(--muted); }

    .sc-group { padding: 4px 0 8px; }
    .sc-group + .sc-group { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px; }
    .sc-group-cap { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .sc-group-bonus .sc-group-cap { color: var(--me); }
    .sc-row { display: grid; grid-template-columns: 78px 1fr 34px; align-items: center; gap: 12px; padding: 6px 0; }
    .sc-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .sc-range { width: 100%; accent-color: var(--me); cursor: pointer; touch-action: none; }
    .sc-range:disabled { cursor: default; opacity: 0.65; }
    .play-card.scored-locked { border-style: solid; }
    .sc-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; text-align: right; color: var(--fg); }
    .sc-val small { font-size: 10px; color: var(--muted); }
    .pc-note {
      width: 100%; margin-top: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      font-family: var(--font); font-size: 11px; line-height: 1.6; padding: 9px 11px; resize: vertical; min-height: 38px;
    }
    .pc-note:focus { outline: none; border-color: var(--me); }
    .pc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .pc-partner { font-size: 10px; letter-spacing: 0.5px; }
    .pc-partner .who { text-transform: uppercase; letter-spacing: 1px; font-size: 9px; }
    .pc-partner.alayne .who { color: var(--alayne); } .pc-partner.blake .who { color: var(--blake); }
    .pc-partner .hidden-tag { color: var(--muted); font-style: italic; }
    .pc-status { font-size: 9px; letter-spacing: 1px; color: var(--muted); min-width: 60px; text-align: right; }
    .pc-status.saved { color: #16a34a; }
    [data-theme="dark"] .pc-status.saved, [data-theme="terminal"] .pc-status.saved { color: #4ade80; }
    .pc-clear { background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: underline; }
    .pc-clear:hover { color: #ef4444; }
    .pc-foot-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pc-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-family: var(--font); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 6px 14px; cursor: pointer; border-radius: 2px; transition: all 0.15s;
    }
    .pc-btn:hover, .pc-btn.primary { border-color: var(--me); color: var(--me); }
    .pc-btn.primary { background: color-mix(in srgb, var(--me) 12%, transparent); }

    /* ── COMPARE ── */
    .cmp-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .cmp-stat { border: 1px solid var(--border); background: var(--card-bg); padding: 16px; text-align: center; }
    .cmp-stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; color: var(--purple); }
    [data-theme="dark"] .cmp-stat-num, [data-theme="terminal"] .cmp-stat-num { color: var(--lime); }
    .cmp-stat-label { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
    .cmp-h2h { display: flex; justify-content: center; gap: 6px; align-items: baseline; font-family: 'Bebas Neue', sans-serif; font-size: 38px; }
    .cmp-h2h .a { color: var(--alayne); } .cmp-h2h .b { color: var(--blake); } .cmp-h2h .sep { font-size: 20px; color: var(--muted); }

    .cmp-section-h { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 2px; margin: 30px 0 14px; }
    .cmp-collapser { cursor: pointer; user-select: none; }
    .cmp-collapser:hover { color: var(--muted); }
    .cmp-chev { display: inline-block; font-size: 16px; width: 16px; }
    .cmp-legend { display: flex; gap: 18px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
    .cmp-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .cmp-radar-wrap { display: flex; justify-content: center; }
    .cmp-radar { max-width: 420px; width: 100%; }
    .cmp-chart-wrap { display: flex; justify-content: center; }
    .cmp-chart { max-width: 380px; width: 100%; color: var(--fg); }
    /* Generosity + company bars */
    .gen { display: flex; flex-direction: column; gap: 10px; max-width: 520px; }
    .gen-row { display: grid; grid-template-columns: 58px 1fr 42px; align-items: center; gap: 10px; }
    .gen-name { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .gen-track { height: 12px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .gen-bar { height: 100%; border-radius: 2px; }
    .gen-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; text-align: right; color: var(--fg); }
    /* Category deltas (diverging) */
    .cd { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
    .cd-row { display: grid; grid-template-columns: 68px 1fr 46px; align-items: center; gap: 10px; }
    .cd-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .cd-track { position: relative; height: 14px; background: var(--border); border-radius: 2px; }
    .cd-center { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--fg); opacity: 0.35; }
    .cd-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
    .cd-val { font-family: 'Bebas Neue', sans-serif; font-size: 16px; text-align: right; color: var(--fg); }
    /* Company report card */
    .co-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .co-block { border: 1px solid var(--border); background: var(--card-bg); padding: 14px; }
    .co-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 10px; }
    .co-count { font-family: var(--font); font-size: 9px; color: var(--muted); letter-spacing: 1px; }
    .co-block .gen-row { margin-top: 6px; }
    .co-avg {
      font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1;
      color: var(--fg); margin: 2px 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .co-avg small { font-family: var(--font); font-size: 10px; letter-spacing: 1px; color: var(--muted); }
    .co-avg-top { color: var(--purple); }
    [data-theme="dark"] .co-avg-top, [data-theme="terminal"] .co-avg-top { color: var(--lime); }
    .co-block-top { border-color: var(--purple); }
    [data-theme="dark"] .co-block-top, [data-theme="terminal"] .co-block-top { border-color: var(--lime); }
    .co-top-tag {
      font-family: var(--font); font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--purple); border: 1px solid var(--purple); padding: 2px 6px; border-radius: 2px; align-self: center;
    }
    [data-theme="dark"] .co-top-tag, [data-theme="terminal"] .co-top-tag { color: var(--lime); border-color: var(--lime); }

    .cmp-dis { border: 1px solid var(--border); background: var(--card-bg); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cmp-dis-title { font-size: 12px; }
    .cmp-dis-meta { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .cmp-dis-scores { display: flex; gap: 10px; align-items: baseline; font-family: 'Bebas Neue', sans-serif; font-size: 24px; white-space: nowrap; }
    .cmp-dis-scores .a { color: var(--alayne); } .cmp-dis-scores .b { color: var(--blake); }
    .cmp-dis-scores .gap { font-family: var(--font); font-size: 9px; color: var(--muted); letter-spacing: 1px; }

    .cmp-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .cmp-table th { text-align: left; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .cmp-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 11px; }
    .cmp-table .num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; text-align: center; }
    .cmp-table .num.a { color: var(--alayne); } .cmp-table .num.b { color: var(--blake); }
    .cmp-table th.cmp-sort { cursor: pointer; user-select: none; white-space: nowrap; }
    .cmp-table th.cmp-sort:hover { color: var(--fg); }
    .cmp-table th.cmp-sort.active { color: var(--fg); }
    .cmp-table .num .rk { display: block; font-family: var(--font); font-size: 9px; letter-spacing: 0; color: var(--muted); line-height: 1.3; margin-top: 1px; }
    .cmp-hint { font-size: 9px; letter-spacing: 1px; color: var(--muted); margin: -6px 0 8px; }

    .ab-empty { padding: 50px 20px; text-align: center; font-size: 11px; letter-spacing: 1px; color: var(--muted); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--card-bg); border: 1px solid var(--border); color: var(--fg);
      font-size: 10px; letter-spacing: 1px; padding: 10px 20px; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; }
    #jump-top {
      position: fixed; bottom: 20px; right: 20px; z-index: 90;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--purple); color: #fff; border: none; cursor: pointer;
      font-size: 20px; line-height: 1; display: none; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.28); transition: transform 0.15s;
    }
    #jump-top.show { display: flex; }
    #jump-top:hover { transform: translateY(-2px); }
    [data-theme="dark"] #jump-top, [data-theme="terminal"] #jump-top { background: var(--lime); color: #000; }
  </style>
</head>
<body>
<div id="app">
  <header class="ab-header">
    <div class="ab-header-top">
      <div class="ab-actions">
        <button class="ab-icon-btn" id="ab-font-btn" title="Adjust text size" aria-label="Adjust text size">Aa</button>
        <button class="ab-icon-btn" id="ab-theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
    <h1 class="ab-title"><span class="a">A</span><span class="b">B</span> Theatre Review</h1>
    <p class="ab-subtitle">Alayne &amp; Blake · scoring every play we see</p>
  </header>

  <!-- LANDING -->
  <div id="landing">
    <div class="ab-split">
      <button class="ab-half alayne" data-who="alayne">
        <span class="ab-half-name">ALAYNE</span>
        <span class="ab-half-sub">Enter my score</span>
        <span class="ab-half-count" id="count-alayne"></span>
      </button>
      <button class="ab-half blake" data-who="blake">
        <span class="ab-half-name">BLAKE</span>
        <span class="ab-half-sub">Enter my score</span>
        <span class="ab-half-count" id="count-blake"></span>
      </button>
    </div>
    <div class="ab-compare-bar">
      <button class="ab-compare-btn" id="go-compare">⚖  Compare our scores</button>
    </div>
  </div>

  <!-- SCORER -->
  <div class="screen" id="scorer">
    <div class="ab-subbar">
      <button class="ab-btn" id="scorer-back">← Home</button>
      <span class="ab-crumb" id="scorer-name"></span>
      <input class="ab-search" id="scorer-search" type="text" placeholder="Search play or company…">
      <button class="ab-btn" id="sort-btn" title="Sort by your score">Sort ↓</button>
    </div>
    <div class="ab-body" id="scorer-body"></div>
  </div>

  <!-- COMPARE -->
  <div class="screen" id="compare">
    <div class="ab-subbar">
      <button class="ab-btn" id="compare-back">← Home</button>
      <span class="ab-crumb">Compare</span>
      <span id="compare-years"></span>
    </div>
    <div class="ab-body" id="compare-body"></div>
  </div>
</div>
<button id="jump-top" type="button" aria-label="Jump to top" title="Jump to top">↑</button>
<div id="toast"></div>

<script>
'use strict';

/* ═══════════════ CONFIG ═══════════════ */
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSEiGQmBcZgAiFv2Fuj40Yp9SC8zhyTn6BJ3aqFDcKaDOfPC8NAO9dFqjhlYVX46cdrgH1gc5NiiV7G/pub?gid=1888245759&single=true&output=csv';
var AB_WORKER_URL = 'https://ab-theatre-review.blakestringer.workers.dev';

var CATS = [
  { key: 'story',    label: 'Story',    max: 10, group: 'core10' },
  { key: 'acting',   label: 'Acting',   max: 10, group: 'core10' },
  { key: 'sound',    label: 'Sound',    max: 5,  group: 'core5' },
  { key: 'lighting', label: 'Lighting', max: 5,  group: 'core5' },
  { key: 'set',      label: 'Set',      max: 5,  group: 'core5' },
  { key: 'costume',  label: 'Costume',  max: 5,  group: 'core5' },
  { key: 'xfactor',  label: 'X-Factor', max: 5,  group: 'bonus' },
];
var GROUPS = [
  { id: 'core10', cap: 'Out of 10' },
  { id: 'core5',  cap: 'Out of 5' },
  { id: 'bonus',  cap: '✦ Bonus — optional' },
];
var MAX_TOTAL = 45;   /* Story 10 + Acting 10 + Sound/Lighting/Set/Costume 5 each + X-Factor bonus 5 */
var SCORE_YEARS = ['2026'];   /* only these years are scorable; earlier years are a read-only archive */
function isScorable(p) { return SCORE_YEARS.indexOf(String(p.year)) >= 0; }
var NAMES = { alayne: 'Alayne', blake: 'Blake' };
var OTHER = { alayne: 'blake', blake: 'alayne' };

/* ═══════════════ STATE ═══════════════ */
var state = {
  plays: [],
  reviews: { alayne: {}, blake: {} },
  me: null,
  yearFilter: 'all',
  sortByScore: false,
  search: '',
  compareYear: 'all',
  cmpSort: { key: 'combined', dir: -1 },   /* combined table sort: default highest total first */
  ready: false,                            /* true once the CSV + scores have loaded */
  screen: 'landing',
  collapse: { scatter: false, gen: false, catdelta: false, radar: false, timeline: false, company: false, agree: false, disagree: false, combined: false },
};

/* ═══════════════ TEXT SIZE (Aa) — mirrors the other tools ═══════════════ */
(function () {
  var btn = document.getElementById('ab-font-btn');
  var isDesktop = window.innerWidth >= 640;
  var zoomed = localStorage.getItem('font-zoom') === '1';
  function apply() {
    /* Desktop base 125%; Aa boosts to 150%. Mobile base 100%; Aa boosts to 125%. */
    document.documentElement.style.zoom = zoomed ? (isDesktop ? '1.5' : '1.25') : (isDesktop ? '1.25' : '');
    btn.classList.toggle('active', zoomed);
  }
  apply();
  btn.addEventListener('click', function () {
    zoomed = !zoomed; localStorage.setItem('font-zoom', zoomed ? '1' : '0'); apply();
  });
})();

/* ═══════════════ THEME ═══════════════ */
(function () {
  var btn = document.getElementById('ab-theme-btn');
  var CYCLE = ['light', 'dark', 'terminal'];
  var moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  var sunSVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.93" y2="5.93"/><line x1="18.07" y1="18.07" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.93" y2="18.07"/><line x1="18.07" y1="5.93" x2="19.78" y2="4.22"/></svg>';
  var lockSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
  function icon(t) { return t === 'terminal' ? lockSVG : t === 'dark' ? sunSVG : moonSVG; }
  var t = localStorage.getItem('theme') || 'light';
  function apply(v) {
    t = v;
    if (v === 'light') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    btn.innerHTML = icon(v);
    localStorage.setItem('theme', v);
  }
  apply(t);
  btn.addEventListener('click', function () { apply(CYCLE[(CYCLE.indexOf(t) + 1) % CYCLE.length]); });
})();

/* ═══════════════ HELPERS ═══════════════ */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
}

/* Quote-aware CSV parser (handles commas + newlines inside quoted fields). */
function parseCSV(text) {
  var rows = [], row = [], field = '', i = 0, inQ = false, c;
  text = text.replace(/\r\n?/g, '\n');
  for (; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseDMY(s) {
  var m = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(String(s || ''));
  if (!m) return null;
  return new Date(+m[3], +m[2] - 1, +m[1]);
}
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) { return d ? (d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear()) : ''; }

function scoreTotal(s) {
  if (!s) return 0;
  var t = 0; for (var i = 0; i < CATS.length; i++) t += (+s[CATS[i].key] || 0); return t;
}
function hasScore(reviewer, id) { return !!state.reviews[reviewer][id]; }

/* ═══════════════ DATA LOAD ═══════════════ */
function abFetch(payload) {
  return fetch(AB_WORKER_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  }).then(function (r) { return r.json(); });
}

function loadAll() {
  var csvP = fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  var revP = abFetch({ mode: 'get' }).catch(function () { return { reviews: { alayne: {}, blake: {} } }; });

  return Promise.all([csvP, revP]).then(function (res) {
    parsePlays(res[0]);
    if (res[1] && res[1].reviews) state.reviews = { alayne: res[1].reviews.alayne || {}, blake: res[1].reviews.blake || {} };
    state.ready = true;
    updateCounts();
    /* If the user already clicked into a screen before the data landed, re-render
       it now (fixes the "No plays match" flash that needed a Blake→Alayne toggle). */
    if (state.screen === 'scorer' && state.me) renderScorer();
    else if (state.screen === 'compare') renderCompare();
  });
}

function parsePlays(csv) {
  var rows = parseCSV(csv).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
  if (!rows.length) { state.plays = []; return; }
  var head = rows[0].map(function (h) { return String(h).trim().toUpperCase(); });
  function col(name) { return head.indexOf(name); }
  var iId = col('ID'), iYear = col('YEAR'), iDate = col('DATE'), iTitle = col('PLAY TITLE'), iCompany = col('COMPANY');
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var out = [];
  for (var r = 1; r < rows.length; r++) {
    var row = rows[r];
    var id = iId >= 0 ? String(row[iId] || '').trim() : String(r);
    var title = iTitle >= 0 ? String(row[iTitle] || '').trim() : '';
    if (!id || !title) continue;
    var date = iDate >= 0 ? parseDMY(row[iDate]) : null;
    var year = iYear >= 0 ? String(row[iYear] || '').trim() : (date ? String(date.getFullYear()) : '');
    out.push({
      id: id, title: title,
      company: iCompany >= 0 ? String(row[iCompany] || '').trim() : '',
      date: date, year: year,
      /* Unlocks the DAY AFTER the show — no rating on the same day. */
      seen: date ? (date < today) : true,
    });
  }
  state.plays = out;
}

function updateCounts() {
  ['alayne', 'blake'].forEach(function (who) {
    var el = document.getElementById('count-' + who);
    if (!state.ready) { el.textContent = 'Loading…'; return; }
    /* Outstanding = scorable (2026+), already seen (unlocked), not yet scored by them. */
    var out = state.plays.filter(function (p) {
      return isScorable(p) && p.seen && !state.reviews[who][p.id];
    }).length;
    el.textContent = out ? (out + ' play' + (out === 1 ? '' : 's') + ' to score') : 'All caught up ✓';
  });
}

/* ═══════════════ NAVIGATION ═══════════════ */
function showScreen(id) {
  state.screen = id;
  document.getElementById('landing').style.display = (id === 'landing') ? 'flex' : 'none';
  ['scorer', 'compare'].forEach(function (s) { document.getElementById(s).classList.toggle('active', s === id); });
  window.scrollTo(0, 0);
}
function goHome() { updateCounts(); showScreen('landing'); }

function enterScorer(who) {
  state.me = who;
  document.getElementById('scorer').className = 'screen active as-' + who;
  document.documentElement.style.setProperty('--me', who === 'alayne' ? 'var(--alayne)' : 'var(--blake)');
  var crumb = document.getElementById('scorer-name');
  crumb.textContent = NAMES[who] + "'s scores";
  crumb.className = 'ab-crumb ' + who;
  renderScorer();
  showScreen('scorer');
}

/* ═══════════════ SCORER ═══════════════ */
function filteredPlays() {
  var q = state.search.trim().toLowerCase();
  if (!q) return state.plays.slice();
  return state.plays.filter(function (p) {
    return (p.title + ' ' + p.company).toLowerCase().indexOf(q) >= 0;
  });
}

function byDateDesc(a, b) { var ta = a.date ? a.date.getTime() : 0, tb = b.date ? b.date.getTime() : 0; return tb - ta; }
function byDateAsc(a, b)  { var ta = a.date ? a.date.getTime() : Infinity, tb = b.date ? b.date.getTime() : Infinity; return ta - tb; }

function renderScorer() {
  var body = document.getElementById('scorer-body');
  if (!state.ready) { body.innerHTML = '<div class="ab-empty">Loading plays…</div>'; return; }
  var base = filteredPlays();
  var scorable = base.filter(isScorable);
  var archive  = base.filter(function (p) { return !isScorable(p); });

  if (!scorable.length && !archive.length) { body.innerHTML = '<div class="ab-empty">No plays match.</div>'; return; }

  var cell = function (p) { return p.seen ? cardHTML(p) : lockedHTML(p); };
  var html = '';

  /* ── Scorable (2026) ── */
  if (state.sortByScore) {
    scorable.slice().sort(function (a, b) {
      return scoreTotal(state.reviews[state.me][b.id]) - scoreTotal(state.reviews[state.me][a.id]);
    }).forEach(function (p) { html += cell(p); });
  } else {
    /* Order: outstanding (seen but not yet scored) at the very top, then the
       upcoming locked plays soonest-first (so once you're all caught up, the
       next play coming up leads), then your already-scored plays at the bottom.
       A play only moves down on the next full render, not the instant you score. */
    var outstanding = scorable.filter(function (p) { return p.seen && !hasScore(state.me, p.id); });
    var upcoming    = scorable.filter(function (p) { return !p.seen; });
    var scored      = scorable.filter(function (p) { return p.seen && hasScore(state.me, p.id); });
    outstanding.sort(byDateDesc);   /* most recently seen first */
    upcoming.sort(byDateAsc);       /* next one coming up first */
    scored.sort(byDateDesc);

    outstanding.forEach(function (p) { html += cell(p); });
    upcoming.forEach(function (p) { html += cell(p); });
    if (scored.length) {
      html += '<div class="ab-divider">Already scored</div>';
      scored.forEach(function (p) { html += cell(p); });
    }
  }
  if (!scorable.length) html += '<div class="ab-empty" style="padding:20px">No 2026 plays match.</div>';

  /* ── Archive (earlier years, read-only, just for the record) ── */
  if (archive.length) {
    html += '<div class="ab-divider">Previously seen · not scored</div>';
    archive.slice().sort(byDateDesc).forEach(function (p) { html += archiveHTML(p); });
  }

  body.innerHTML = html;
  bindCards();
}

function archiveHTML(p) {
  return '<div class="play-card archive">' +
    '<div class="pc-head"><div><div class="pc-title">' + esc(p.title) + '</div>' +
    '<div class="pc-meta">' + esc(p.company) + (p.date ? ' · ' + fmtDate(p.date) : '') + '</div></div>' +
    '<div class="arch-year">' + esc(p.year) + '</div></div></div>';
}

function unlockDate(d) { var u = new Date(d.getTime()); u.setDate(u.getDate() + 1); return u; }

function lockedHTML(p) {
  return '<div class="play-card locked" data-id="' + esc(p.id) + '">' +
    '<div class="pc-head"><div><div class="pc-title">' + esc(p.title) + '</div>' +
    '<div class="pc-meta">' + esc(p.company) + (p.date ? ' · ' + fmtDate(p.date) : '') + '</div></div></div>' +
    '<div class="pc-locked-msg">🔒 Scoring unlocks ' + (p.date ? fmtDate(unlockDate(p.date)) : 'once seen') + '</div></div>';
}

/* mode: 'auto'  — not yet scored, editable, saves as you drag
 *       'locked'— already scored (default for a scored play), read-only + Edit button
 *       'edit'  — unlocked for changes, requires explicit Save                       */
function cardHTML(p, mode) {
  var s = state.reviews[state.me][p.id];
  var scored = !!s;
  mode = mode || (scored ? 'locked' : 'auto');
  var disabled = (mode === 'locked');
  var total = scoreTotal(s);

  function rowHTML(c) {
    var v = s ? (+s[c.key] || 0) : 0;
    return '<div class="sc-row"><span class="sc-label">' + c.label + '</span>' +
      '<input class="sc-range" type="range" min="0" max="' + c.max + '" step="0.5" value="' + v + '"' +
        (disabled ? ' disabled' : '') + ' data-cat="' + c.key + '" aria-label="' + c.label + ' out of ' + c.max + '">' +
      '<span class="sc-val" data-val="' + c.key + '">' + (scored ? v : '–') + '<small>/' + c.max + '</small></span></div>';
  }
  var rows = GROUPS.map(function (g) {
    var inGroup = CATS.filter(function (c) { return c.group === g.id; });
    if (!inGroup.length) return '';
    return '<div class="sc-group sc-group-' + g.id + '"><div class="sc-group-cap">' + g.cap + '</div>' +
      inGroup.map(rowHTML).join('') + '</div>';
  }).join('');

  var controls;
  if (mode === 'locked') {
    controls = '<button class="pc-btn" data-action="edit">✎ Edit</button>';
  } else if (mode === 'edit') {
    controls = '<button class="pc-btn primary" data-action="save">Save</button>' +
               '<button class="pc-btn" data-action="cancel">Cancel</button>' +
               '<button class="pc-clear" data-action="clear">Clear</button>' +
               '<span class="pc-status" data-status></span>';
  } else {
    controls = '<span class="pc-status" data-status></span>';
  }

  return '<div class="play-card' + (mode === 'locked' ? ' scored-locked' : '') + '" data-id="' + esc(p.id) + '" data-mode="' + mode + '">' +
    '<div class="pc-head"><div><div class="pc-title">' + esc(p.title) + '</div>' +
      '<div class="pc-meta">' + esc(p.company) + (p.date ? ' · ' + fmtDate(p.date) : '') + '</div></div>' +
      '<div class="pc-total' + (scored ? '' : ' unset') + '" data-total>' + (scored ? total : '–') + '<small>/' + MAX_TOTAL + '</small></div>' +
    '</div>' +
    '<div class="pc-body">' + rows +
      '<textarea class="pc-note" data-note' + (disabled ? ' readonly' : '') + ' placeholder="A note or one-line verdict (optional)…">' + esc(s ? s.note : '') + '</textarea>' +
      '<div class="pc-foot">' + partnerHTML(p.id) +
        '<div class="pc-foot-controls">' + controls + '</div>' +
      '</div>' +
    '</div></div>';
}

function partnerHTML(id) {
  var other = OTHER[state.me];
  var theirs = state.reviews[other][id];
  var cls = 'pc-partner ' + other;
  if (!theirs) return '<span class="' + cls + '"><span class="who">' + NAMES[other] + '</span> <span class="hidden-tag">hasn\'t scored yet</span></span>';
  if (!hasScore(state.me, id)) return '<span class="' + cls + '"><span class="who">' + NAMES[other] + '</span> <span class="hidden-tag">hidden until you score ✦</span></span>';
  return '<span class="' + cls + '"><span class="who">' + NAMES[other] + '</span> ' + scoreTotal(theirs) + '/' + MAX_TOTAL + '</span>';
}

var saveTimers = {};
function bindCards() {
  document.querySelectorAll('#scorer-body .play-card:not(.locked):not(.archive)').forEach(bindCard);
}
function bindCard(card) {
  var id = card.getAttribute('data-id');
  card.querySelectorAll('.sc-range').forEach(function (rng) {
    rng.addEventListener('input', function () { onSliderInput(card, id); });
  });
  var note = card.querySelector('[data-note]');
  if (note) note.addEventListener('input', function () { onSliderInput(card, id); });
  card.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]'); if (!btn) return;
    var act = btn.getAttribute('data-action');
    if (act === 'edit')        setCardMode(card, id, 'edit');
    else if (act === 'save')   saveCard(card, id);
    else if (act === 'cancel') setCardMode(card, id, 'locked');
    else if (act === 'clear')  clearScore(id);
  });
}

function readCard(card) {
  var s = { note: '' };
  card.querySelectorAll('.sc-range').forEach(function (rng) { s[rng.getAttribute('data-cat')] = +rng.value; });
  var note = card.querySelector('[data-note]');
  s.note = note ? note.value : '';
  return s;
}

/* Update the on-screen totals from the current sliders (no state write). */
function refreshCardTotals(card) {
  var sum = 0;
  card.querySelectorAll('.sc-range').forEach(function (rng) {
    var k = rng.getAttribute('data-cat'), v = +rng.value; sum += v;
    var cat = CATS.filter(function (c) { return c.key === k; })[0];
    var el = card.querySelector('.sc-val[data-val="' + k + '"]');
    if (el) el.innerHTML = v + '<small>/' + cat.max + '</small>';
  });
  var tot = card.querySelector('[data-total]');
  if (tot) { tot.classList.remove('unset'); tot.innerHTML = sum + '<small>/' + MAX_TOTAL + '</small>'; }
}

function onSliderInput(card, id) {
  refreshCardTotals(card);
  if (card.getAttribute('data-mode') === 'auto') autoCommit(card, id);
  /* in 'edit' mode we only preview; changes commit on Save */
}

/* Auto-save path for a play being scored for the first time. */
function autoCommit(card, id) {
  var s = readCard(card);
  state.reviews[state.me][id] = s;
  var pf = card.querySelector('.pc-partner'); if (pf) pf.outerHTML = partnerHTML(id);   /* reveal partner */
  var st = card.querySelector('[data-status]'); if (st) { st.textContent = 'saving…'; st.classList.remove('saved'); }
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(function () { pushSave(id, s, card); }, 650);
}

function pushSave(id, score, card) {
  abFetch({ mode: 'save', reviewer: state.me, id: id, score: score }).then(function (res) {
    var st = card && card.querySelector('[data-status]');
    if (res && res.ok) { if (st) { st.textContent = 'saved ✓'; st.classList.add('saved'); } }
    else { if (st) st.textContent = 'save failed'; showToast('Couldn’t save — check your connection.'); }
    updateCounts();
  }).catch(function () {
    var st = card && card.querySelector('[data-status]');
    if (st) st.textContent = 'save failed'; showToast('Couldn’t save — check your connection.');
  });
}

/* Re-render one card in a new mode in place, and re-bind it. */
function setCardMode(card, id, mode) {
  var p = playById(id); if (!p) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(p, mode);
  var fresh = tmp.firstChild;
  card.parentNode.replaceChild(fresh, card);
  bindCard(fresh);
}

/* Explicit Save from edit mode: commit the edited values, persist, then re-lock. */
function saveCard(card, id) {
  var s = readCard(card);
  var st = card.querySelector('[data-status]'); if (st) { st.textContent = 'saving…'; st.classList.remove('saved'); }
  abFetch({ mode: 'save', reviewer: state.me, id: id, score: s }).then(function (res) {
    if (res && res.ok) {
      state.reviews[state.me][id] = s;
      updateCounts();
      setCardMode(card, id, 'locked');
      showToast('Saved ✓');
    } else { if (st) st.textContent = 'save failed'; showToast('Couldn’t save — check your connection.'); }
  }).catch(function () { if (st) st.textContent = 'save failed'; showToast('Couldn’t save — check your connection.'); });
}

function clearScore(id) {
  delete state.reviews[state.me][id];
  abFetch({ mode: 'save', reviewer: state.me, id: id, score: null }).then(updateCounts).catch(function () {});
  renderScorer();
}

/* ═══════════════ COMPARE ═══════════════ */
function playById(id) { for (var i = 0; i < state.plays.length; i++) if (state.plays[i].id === id) return state.plays[i]; return null; }

function cmpRow(A, B, id) {
  var a = scoreTotal(A[id]), b = scoreTotal(B[id]), p = playById(id);
  return {
    id: id, title: p ? p.title : id, company: p ? p.company : '', year: p ? p.year : '',
    date: p ? p.date : null,
    a: a, b: b, gap: Math.abs(a - b), combined: a + b, avg: (a + b) / 2,
  };
}
function catAvgsForIds(rev, ids) {
  var out = {};
  CATS.forEach(function (c) {
    var sum = 0, cnt = 0;
    ids.forEach(function (id) { if (rev[id]) { sum += (+rev[id][c.key] || 0); cnt++; } });
    out[c.key] = cnt ? sum / cnt : 0;
  });
  return out;
}
function disCard(r) {
  return '<div class="cmp-dis"><div><div class="cmp-dis-title">' + esc(r.title) + '</div>' +
    '<div class="cmp-dis-meta">' + esc(r.company) + (r.year ? ' · ' + esc(r.year) : '') + '</div></div>' +
    '<div class="cmp-dis-scores"><span class="a">' + r.a + '</span><span class="b">' + r.b + '</span>' +
    '<span class="gap">' + r.gap + ' apart</span></div></div>';
}
/* Each person's rank of a play within the shown set (1 = their favourite).
   Ties share a rank and are flagged with ~ (e.g. two joint-9ths → "~9"). */
function computeRanks(rows, key) {
  var map = {};
  rows.forEach(function (r) {
    var higher = 0, equal = 0;
    rows.forEach(function (o) { if (o[key] > r[key]) higher++; else if (o[key] === r[key]) equal++; });
    map[r.id] = { rank: higher + 1, tie: equal > 1 };
  });
  return map;
}
function rankTag(rk) { return '<div class="rk">(' + (rk.tie ? '~' : '') + rk.rank + ')</div>'; }

function combinedTable(list) {
  var rankA = computeRanks(list, 'a'), rankB = computeRanks(list, 'b'), rankT = computeRanks(list, 'combined');
  var sk = state.cmpSort.key, dir = state.cmpSort.dir;
  var sorted = list.slice().sort(function (x, y) {
    var d = (x[sk] - y[sk]) * dir;
    return d || (y.combined - x.combined);   /* stable-ish tiebreak on total */
  });
  function th(key, label) {
    var arrow = (sk === key) ? (dir < 0 ? ' ▾' : ' ▴') : '';
    return '<th class="cmp-sort' + (sk === key ? ' active' : '') + '" style="text-align:center" data-sort="' + key + '">' + label + arrow + '</th>';
  }
  return '<table class="cmp-table"><thead><tr><th>Play</th>' +
      th('a', 'Alayne') + th('b', 'Blake') + th('combined', 'Total') +
    '</tr></thead><tbody>' +
    sorted.map(function (r) {
      return '<tr><td>' + esc(r.title) + '<div class="cmp-dis-meta">' + esc(r.company) + (r.year ? ' · ' + esc(r.year) : '') + '</div></td>' +
        '<td class="num a">' + r.a + rankTag(rankA[r.id]) + '</td>' +
        '<td class="num b">' + r.b + rankTag(rankB[r.id]) + '</td>' +
        '<td class="num">' + r.combined + '<small style="font-size:9px;color:var(--muted)">/' + (MAX_TOTAL * 2) + '</small>' + rankTag(rankT[r.id]) + '</td></tr>';
    }).join('') + '</tbody></table>';
}

function renderCompareYears(years) {
  var wrap = document.getElementById('compare-years');
  if (years.length < 2) { wrap.innerHTML = ''; return; }   /* nothing to filter when it's one season */
  wrap.innerHTML = '<button class="ab-btn' + (state.compareYear === 'all' ? ' on' : '') + '" data-cyear="all">All</button>' +
    years.map(function (y) { return '<button class="ab-btn' + (state.compareYear === y ? ' on' : '') + '" data-cyear="' + esc(y) + '">' + esc(y) + '</button>'; }).join('');
}

function renderCompare() {
  var A = state.reviews.alayne, B = state.reviews.blake;
  var body = document.getElementById('compare-body');

  var sharedIds = [];
  Object.keys(A).forEach(function (id) {
    if (!B[id]) return;
    var p = playById(id);
    if (p && isScorable(p)) sharedIds.push(id);   /* 2026+ only — ignore any legacy 2024/25 scores */
  });
  var allRows = sharedIds.map(function (id) { return cmpRow(A, B, id); });

  var years = [];
  allRows.forEach(function (r) { if (r.year && years.indexOf(r.year) < 0) years.push(r.year); });
  years.sort(function (x, y) { return y.localeCompare(x); });
  if (state.compareYear !== 'all' && years.indexOf(state.compareYear) < 0) state.compareYear = 'all';
  renderCompareYears(years);

  if (!allRows.length) {
    body.innerHTML = '<div class="ab-empty">No plays scored by <em>both</em> of you yet.<br>' +
      'Once you\'ve each scored the same play, the comparison unlocks here.</div>';
    return;
  }

  var rows = state.compareYear === 'all' ? allRows : allRows.filter(function (r) { return r.year === state.compareYear; });
  if (!rows.length) {
    body.innerHTML = '<div class="ab-empty">Nothing you\'ve <em>both</em> scored in ' + esc(state.compareYear) + ' yet.</div>';
    return;
  }

  var ids = rows.map(function (r) { return r.id; });
  var n = rows.length;
  var avgGap = rows.reduce(function (s, r) { return s + r.gap; }, 0) / n;
  var agreement = Math.round(100 * (1 - avgGap / MAX_TOTAL));
  var aWins = rows.filter(function (r) { return r.a > r.b; }).length;
  var bWins = rows.filter(function (r) { return r.b > r.a; }).length;
  var avA = catAvgsForIds(A, ids), avB = catAvgsForIds(B, ids);

  var agreements   = rows.slice().sort(function (x, y) { return x.gap - y.gap || y.avg - x.avg; }).slice(0, 5);
  var disagreements = rows.slice().sort(function (x, y) { return y.gap - x.gap; }).slice(0, 5);

  /* Merged agreement: blends raw closeness with rank correlation (how alike you
     ORDER plays, ignoring baseline). Falls back to raw until there are enough
     plays for a meaningful rank correlation. */
  var spear = spearman(rows);
  var rankPct = (spear == null || n < 3) ? null : Math.round(spear * 100);
  var mergedAgree = (rankPct == null) ? agreement : Math.round((agreement + rankPct) / 2);

  var html = '';
  html += '<div class="cmp-hero">' +
    stat(mergedAgree + '%', 'Taste agreement') +
    stat(n, 'Plays you\'ve both scored') +
    stat(avgGap.toFixed(1), 'Avg points apart') +
    '<div class="cmp-stat"><div class="cmp-h2h"><span class="a">' + aWins + '</span><span class="sep">–</span><span class="b">' + bWins + '</span></div><div class="cmp-stat-label">Head-to-head (Alayne–Blake)</div></div>' +
  '</div>';

  html += '<div class="cmp-legend"><span><span class="dot" style="background:var(--alayne)"></span>Alayne</span><span><span class="dot" style="background:var(--blake)"></span>Blake</span></div>';

  /* Every section below is collapsible (click its heading). */
  if (n >= 2) {
    html += collapsible('How your scores line up', 'scatter',
      '<div class="cmp-hint">Each dot is a play — Alayne across, Blake up. On the dashed line = you agreed; below it = Alayne scored higher; above = Blake did. A tight diagonal means you rank plays alike even if one of you scores lower overall.</div>' +
      '<div class="cmp-chart-wrap">' + scatterSVG(rows) + '</div>');
  }

  html += collapsible('Generosity', 'gen',
    '<div class="cmp-hint">Average score out of ' + MAX_TOTAL + '.</div>' +
    '<div class="gen">' + avgBarRow('Alayne', avgOf(rows, 'a'), 'var(--alayne)') + avgBarRow('Blake', avgOf(rows, 'b'), 'var(--blake)') + '</div>');

  html += collapsible('Where you differ, by category', 'catdelta',
    '<div class="cmp-hint">Average gap per category · → Alayne scores higher · ← Blake scores higher.</div>' +
    categoryDeltaHTML(A, B, ids));

  html += collapsible('Taste profile', 'radar', '<div class="cmp-radar-wrap">' + radarSVG(avA, avB) + '</div>');

  if (rows.filter(function (r) { return r.date; }).length >= 2) {
    html += collapsible('Over the season', 'timeline',
      '<div class="cmp-hint">Your totals in the order you saw the plays.</div>' +
      '<div class="cmp-chart-wrap">' + timelineSVG(rows) + '</div>');
  }

  var companyInner = companyCardHTML(rows);
  if (companyInner) html += collapsible('Company report card · Melbourne vs Malthouse', 'company', companyInner);

  html += collapsible('Biggest agreements', 'agree', agreements.map(disCard).join(''));
  html += collapsible('Biggest disagreements', 'disagree', disagreements.map(disCard).join(''));

  html += collapsible('Combined scores', 'combined',
    '<div class="cmp-hint">Tap a column heading to sort.</div>' + combinedTable(rows));

  body.innerHTML = html;
}

function stat(num, label) {
  return '<div class="cmp-stat"><div class="cmp-stat-num">' + num + '</div><div class="cmp-stat-label">' + label + '</div></div>';
}

function collapsible(title, key, inner) {
  var col = state.collapse[key];
  return '<div class="cmp-section-h cmp-collapser' + (col ? ' collapsed' : '') + '" data-collapse="' + key + '">' +
      '<span class="cmp-chev">' + (col ? '▸' : '▾') + '</span> ' + title +
    '</div>' +
    '<div class="cmp-collapse-body"' + (col ? ' style="display:none"' : '') + '>' + inner + '</div>';
}

/* ── shared little helpers ── */
function avgOf(rows, key) { return rows.length ? rows.reduce(function (s, r) { return s + r[key]; }, 0) / rows.length : 0; }
function fmtShort(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
function avgBarRow(name, val, color) {
  var pct = Math.max(0, Math.min(100, val / MAX_TOTAL * 100));
  return '<div class="gen-row"><span class="gen-name" style="color:' + color + '">' + name + '</span>' +
    '<div class="gen-track"><div class="gen-bar" style="width:' + pct.toFixed(1) + '%;background:' + color + '"></div></div>' +
    '<span class="gen-val">' + val.toFixed(1) + '</span></div>';
}

/* ── Spearman rank agreement (how similarly you ORDER plays, ignoring baseline) ── */
function avgRanks(rows, key) {
  var sorted = rows.slice().sort(function (x, y) { return y[key] - x[key]; });   /* rank 1 = highest */
  var map = {}, i = 0;
  while (i < sorted.length) {
    var j = i;
    while (j + 1 < sorted.length && sorted[j + 1][key] === sorted[i][key]) j++;
    var avg = ((i + 1) + (j + 1)) / 2;
    for (var k = i; k <= j; k++) map[sorted[k].id] = avg;
    i = j + 1;
  }
  return map;
}
function pearson(xs, ys) {
  var n = xs.length, sx = 0, sy = 0, sxy = 0, sx2 = 0, sy2 = 0;
  for (var i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxy += xs[i] * ys[i]; sx2 += xs[i] * xs[i]; sy2 += ys[i] * ys[i]; }
  var den = Math.sqrt((n * sx2 - sx * sx) * (n * sy2 - sy * sy));
  return den === 0 ? null : (n * sxy - sx * sy) / den;
}
function spearman(rows) {
  if (rows.length < 2) return null;
  var ra = avgRanks(rows, 'a'), rb = avgRanks(rows, 'b');
  return pearson(rows.map(function (r) { return ra[r.id]; }), rows.map(function (r) { return rb[r.id]; }));
}

/* ── Scatter: Alayne (x) vs Blake (y), dots coloured by who scored higher ── */
function scatterSVG(rows) {
  var W = 320, H = 320, pad = 32, plot = W - pad * 2, M = MAX_TOTAL;
  function X(s) { return pad + (s / M) * plot; }
  function Y(s) { return pad + plot - (s / M) * plot; }
  var svg = '<svg class="cmp-chart" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect x="' + pad + '" y="' + pad + '" width="' + plot + '" height="' + plot + '" fill="none" stroke="currentColor" stroke-opacity="0.15"/>';
  svg += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(M) + '" y2="' + Y(M) + '" stroke="currentColor" stroke-opacity="0.28" stroke-dasharray="4 4"/>';
  rows.forEach(function (r) {
    var col = r.a > r.b ? 'var(--alayne)' : (r.b > r.a ? 'var(--blake)' : 'currentColor');
    svg += '<circle cx="' + X(r.a).toFixed(1) + '" cy="' + Y(r.b).toFixed(1) + '" r="4.5" style="fill:' + col + ';fill-opacity:0.85"/>';
  });
  svg += '<text x="' + (pad + plot / 2) + '" y="' + (H - 6) + '" font-size="9" font-family="DM Mono,monospace" fill="currentColor" fill-opacity="0.6" text-anchor="middle">Alayne →</text>';
  svg += '<text x="11" y="' + (pad + plot / 2) + '" font-size="9" font-family="DM Mono,monospace" fill="currentColor" fill-opacity="0.6" text-anchor="middle" transform="rotate(-90 11 ' + (pad + plot / 2) + ')">Blake →</text>';
  svg += '<text x="' + pad + '" y="' + (pad - 6) + '" font-size="8" fill="currentColor" fill-opacity="0.4">' + M + '</text>';
  svg += '</svg>';
  return svg;
}

/* ── Category deltas: Alayne-avg minus Blake-avg per category ── */
function categoryDeltaHTML(A, B, ids) {
  var avA = catAvgsForIds(A, ids), avB = catAvgsForIds(B, ids);
  var deltas = CATS.map(function (c) { return { label: c.label, d: (avA[c.key] || 0) - (avB[c.key] || 0) }; });
  var maxAbs = Math.max.apply(null, deltas.map(function (x) { return Math.abs(x.d); }).concat([0.5]));
  return '<div class="cd">' + deltas.map(function (x) {
    var pct = Math.abs(x.d) / maxAbs * 50;
    var pos = x.d >= 0;
    var style = pos ? ('left:50%;width:' + pct.toFixed(1) + '%;background:var(--alayne)')
                    : ('left:' + (50 - pct).toFixed(1) + '%;width:' + pct.toFixed(1) + '%;background:var(--blake)');
    var sign = x.d > 0 ? '+' : (x.d < 0 ? '−' : '±');
    return '<div class="cd-row"><span class="cd-label">' + x.label + '</span>' +
      '<div class="cd-track"><div class="cd-center"></div><div class="cd-bar" style="' + style + '"></div></div>' +
      '<span class="cd-val">' + sign + Math.abs(x.d).toFixed(1) + '</span></div>';
  }).join('') + '</div>';
}

/* ── Timeline: both totals over the season, in date order ── */
function timelineSVG(rows) {
  var pts = rows.filter(function (r) { return r.date; }).slice().sort(function (x, y) { return x.date - y.date; });
  if (pts.length < 2) return '';
  var W = 340, H = 176, padL = 26, padR = 12, padT = 12, padB = 24;
  var plotW = W - padL - padR, plotH = H - padT - padB, M = MAX_TOTAL;
  function X(i) { return padL + i / (pts.length - 1) * plotW; }
  function Y(v) { return padT + plotH - (v / M) * plotH; }
  var svg = '<svg class="cmp-chart" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  [0, M / 2, M].forEach(function (v) {
    var y = Y(v);
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="currentColor" stroke-opacity="0.1"/>';
    svg += '<text x="' + (padL - 4) + '" y="' + (y + 3) + '" font-size="7" fill="currentColor" fill-opacity="0.4" text-anchor="end">' + v + '</text>';
  });
  function series(key, color) {
    var d = pts.map(function (r, i) { return (i === 0 ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(r[key]).toFixed(1); }).join(' ');
    var s = '<path d="' + d + '" fill="none" style="stroke:' + color + '" stroke-width="2"/>';
    pts.forEach(function (r, i) { s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(r[key]).toFixed(1) + '" r="3" style="fill:' + color + '"/>'; });
    return s;
  }
  svg += series('a', 'var(--alayne)') + series('b', 'var(--blake)');
  svg += '<text x="' + padL + '" y="' + (H - 7) + '" font-size="7" fill="currentColor" fill-opacity="0.5">' + fmtShort(pts[0].date) + '</text>';
  svg += '<text x="' + (W - padR) + '" y="' + (H - 7) + '" font-size="7" fill="currentColor" fill-opacity="0.5" text-anchor="end">' + fmtShort(pts[pts.length - 1].date) + '</text>';
  svg += '</svg>';
  return svg;
}

/* ── Company report card — Melbourne vs Malthouse only ── */
function companyRows(rows, name) {
  return rows.filter(function (r) { return r.company.toLowerCase() === name.toLowerCase(); });
}
function companyCardHTML(rows) {
  var TARGETS = ['Melbourne', 'Malthouse'];
  var present = TARGETS.map(function (name) { return { name: name, cr: companyRows(rows, name) }; })
                       .filter(function (d) { return d.cr.length; });
  if (!present.length) return '';

  /* Combined average (both of you) per company — the head-to-head metric. */
  present.forEach(function (d) { d.combined = (avgOf(d.cr, 'a') + avgOf(d.cr, 'b')) / 2; });
  var topName = null;
  if (present.length >= 2) {
    var best = Math.max.apply(null, present.map(function (d) { return d.combined; }));
    var winners = present.filter(function (d) { return d.combined === best; });
    if (winners.length === 1) topName = winners[0].name;   /* no crown on a tie */
  }

  var blocks = present.map(function (d) {
    var top = (d.name === topName);
    return '<div class="co-block' + (top ? ' co-block-top' : '') + '">' +
      '<div class="co-name">' + esc(d.name) + ' <span class="co-count">' + d.cr.length + ' play' + (d.cr.length === 1 ? '' : 's') + '</span></div>' +
      '<div class="co-avg' + (top ? ' co-avg-top' : '') + '">' + d.combined.toFixed(1) +
        '<small>/' + MAX_TOTAL + ' avg</small>' + (top ? '<span class="co-top-tag">Top rated</span>' : '') + '</div>' +
      avgBarRow('Alayne', avgOf(d.cr, 'a'), 'var(--alayne)') +
      avgBarRow('Blake', avgOf(d.cr, 'b'), 'var(--blake)') + '</div>';
  }).join('');

  return '<div class="cmp-hint">Each company\'s combined average (both of you), out of ' + MAX_TOTAL + '.</div>' +
    '<div class="co-wrap">' + blocks + '</div>';
}

/* Hexagonal radar overlaying two reviewers' category averages. */
function radarSVG(a, b) {
  var size = 320, cx = size / 2, cy = size / 2, R = 110, N = CATS.length;
  function pt(i, frac) {
    var ang = (Math.PI * 2 * i / N) - Math.PI / 2;
    return [cx + Math.cos(ang) * R * frac, cy + Math.sin(ang) * R * frac];
  }
  var svg = '<svg class="cmp-radar" viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg">';
  /* grid rings */
  [0.25, 0.5, 0.75, 1].forEach(function (f) {
    var pts = CATS.map(function (_, i) { return pt(i, f).join(','); }).join(' ');
    svg += '<polygon points="' + pts + '" fill="none" stroke="currentColor" stroke-opacity="0.12"/>';
  });
  /* spokes + labels */
  CATS.forEach(function (c, i) {
    var e = pt(i, 1), l = pt(i, 1.18);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '" stroke="currentColor" stroke-opacity="0.12"/>';
    svg += '<text x="' + l[0] + '" y="' + l[1] + '" font-size="9" font-family="DM Mono, monospace" fill="currentColor" fill-opacity="0.6" text-anchor="middle" dominant-baseline="middle">' + c.label + '</text>';
  });
  function poly(vals, color) {
    var pts = CATS.map(function (c, i) { return pt(i, Math.max(0, Math.min(1, (vals[c.key] || 0) / c.max))).join(','); }).join(' ');
    /* var() must go through style, not a presentation attribute, to resolve. */
    return '<polygon points="' + pts + '" style="fill:' + color + ';fill-opacity:0.18;stroke:' + color + ';stroke-width:2"/>';
  }
  svg += poly(a, 'var(--alayne)');
  svg += poly(b, 'var(--blake)');
  svg += '</svg>';
  return svg;
}

  console.error(e);
  showToast('Couldn’t load the play list. Refresh to try again.');
});
</script>
</body>
