<style>
  :root {
    --bg:#D7DBB6; --surface:#FAFAEF; --surface-2:#E5E7CC; --chip:#DDE1BF;
    --ink:#2F3320; --ink-soft:#5F6347; --line:#C6C99E;
    --brand:#556A34; --brand-soft:#8A9268;
    --accent:#E59A3C; --accent-ink:#A96D19; --accent-soft:#F4E3C1;
    --sage:#C8CFA0; --blush:#EFE1C2;
    --danger:#C7583B;
    --shadow:0 1px 2px rgba(45,48,25,.10), 0 10px 26px -12px rgba(45,48,25,.28);
    --f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1A1D12; --surface:#23271A; --surface-2:#2C3122; --chip:#2E3324;
      --ink:#EAEAD9; --ink-soft:#ABAE93; --line:#363B29;
      --brand:#BAC48D; --brand-soft:#8E9769;
      --accent:#EDAE5B; --accent-ink:#EFB974; --accent-soft:#372E1A;
      --sage:#444B31; --blush:#3B321F; --danger:#E1795C;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"] {
    --bg:#D7DBB6; --surface:#FAFAEF; --surface-2:#E5E7CC; --chip:#DDE1BF;
    --ink:#2F3320; --ink-soft:#5F6347; --line:#C6C99E; --brand:#556A34; --brand-soft:#8A9268;
    --accent:#E59A3C; --accent-ink:#A96D19; --accent-soft:#F4E3C1; --sage:#C8CFA0; --blush:#EFE1C2;
    --danger:#C7583B; --shadow:0 1px 2px rgba(45,48,25,.10), 0 10px 26px -12px rgba(45,48,25,.28);
  }
  :root[data-theme="dark"] {
    --bg:#1A1D12; --surface:#23271A; --surface-2:#2C3122; --chip:#2E3324;
    --ink:#EAEAD9; --ink-soft:#ABAE93; --line:#363B29; --brand:#BAC48D; --brand-soft:#8E9769;
    --accent:#EDAE5B; --accent-ink:#EFB974; --accent-soft:#372E1A; --sage:#444B31; --blush:#3B321F;
    --danger:#E1795C; --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.65);
  }

  /* ── secret Synthwave theme (unlock by tapping the theme button 20×) ── */
  :root[data-theme="synthwave"] {
    --bg:#160A2E; --surface:#221643; --surface-2:#2C1E56; --chip:#2C1E56;
    --ink:#F6E9FF; --ink-soft:#B79FD4; --line:#3D2F66;
    --brand:#43E8FF; --brand-soft:#8A79C8;
    --accent:#FF2D95; --accent-ink:#FF7AC0; --accent-soft:#3A1246;
    --sage:#7A4FD6; --blush:#2A1550; --danger:#FF5C7A;
    --shadow:0 0 0 1px rgba(255,45,149,.18), 0 12px 34px -12px rgba(120,40,200,.7);
  }
  :root[data-theme="synthwave"] body {
    background:#160A2E;
    background-image:
      radial-gradient(120% 72% at 50% 118%, rgba(255,45,149,.42), transparent 60%),
      radial-gradient(90% 50% at 50% 116%, rgba(67,232,255,.22), transparent 60%),
      linear-gradient(180deg, #2A1250 0%, #160A2E 62%);
    background-attachment:fixed;
  }
  :root[data-theme="synthwave"] .brand b { text-shadow:0 0 12px rgba(255,45,149,.7); }
  :root[data-theme="synthwave"] .hello .name { text-shadow:0 0 12px rgba(255,45,149,.5); }

  .synth-toast { position:fixed; left:50%; bottom:30px; transform:translate(-50%,20px); z-index:100;
    background:linear-gradient(90deg,#FF2D95,#7A4FD6); color:#fff; font-weight:700; letter-spacing:.02em;
    padding:12px 20px; border-radius:999px; box-shadow:0 10px 32px -6px rgba(255,45,149,.6);
    opacity:0; transition:opacity .35s, transform .35s; }
  .synth-toast.show { opacity:1; transform:translate(-50%,0); }

  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:var(--f-ui); background:var(--bg); color:var(--ink); line-height:1.5;
    min-height:100vh; transition:background .35s, color .35s;
    background-image:radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--blush) 50%, transparent), transparent 60%);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button { font:inherit; touch-action:manipulation; }
  .wrap { max-width:540px; margin:0 auto; padding:22px 18px 70px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .brand { display:flex; align-items:baseline; gap:1px; font-weight:700; letter-spacing:-.02em; font-size:1.2rem; color:var(--brand); }
  .brand b { color:var(--accent-ink); font-weight:800; }
  .actions { display:flex; gap:8px; }
  .iconbtn { border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    height:40px; min-width:40px; padding:0 12px; border-radius:999px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; font-size:.85rem; font-weight:600; }
  .iconbtn:hover { color:var(--ink); border-color:var(--brand-soft); }
  .iconbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .date { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--brand-soft); font-weight:600; }
  .hello { font-size:1.55rem; font-weight:650; letter-spacing:-.01em; margin:2px 0 16px; color:var(--ink); text-wrap:balance; }
  .hello .name { color:var(--accent-ink); }

  .quote { position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:24px 22px 22px; box-shadow:var(--shadow); overflow:hidden; }
  .quote::before { content:"\201C"; position:absolute; top:-14px; left:14px;
    font-family:var(--f-display); font-size:5.5rem; line-height:1; color:var(--accent); opacity:.30; }
  .quote p { font-family:var(--f-display); font-size:1.3rem; line-height:1.4; color:var(--ink);
    text-wrap:balance; position:relative; font-style:italic; }
  .quote .sprig { display:block; margin-top:14px; height:2px; width:44px;
    background:linear-gradient(90deg, var(--accent), transparent); border-radius:2px; }

  .progress { display:flex; align-items:center; gap:16px; margin:22px 2px 6px; }
  .ring { --pct:0; position:relative; width:60px; height:60px; flex:none; }
  .ring i { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface-2) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent 63%, #000 64%);
            mask:radial-gradient(farthest-side, transparent 63%, #000 64%);
    transition:background .6s cubic-bezier(.4,0,.2,1); }
  .ring span { position:absolute; inset:0; display:grid; place-items:center;
    font-weight:700; font-size:.95rem; color:var(--brand); font-variant-numeric:tabular-nums; }
  .ptext { flex:1; min-width:0; }
  .ptext .h { font-weight:650; color:var(--ink); }
  .ptext .s { font-size:.85rem; color:var(--ink-soft); }
  .sec-streak { margin:-2px 4px 12px; }
  .sec-streak:empty { display:none; margin:0; }
  .streak { display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft);
    color:var(--accent-ink); font-weight:650; font-size:.82rem; padding:6px 11px; border-radius:999px; white-space:nowrap; }

  .section { margin-top:24px; }
  .sec-head { display:flex; align-items:baseline; justify-content:space-between; margin:0 4px 10px; }
  .sec-title { display:flex; align-items:baseline; gap:9px; }
  .sec-title h2 { font-size:1.05rem; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .sec-title .reset { font-size:.7rem; color:var(--brand-soft); letter-spacing:.02em; }
  .sec-count { font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

  .list { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .empty { padding:16px; text-align:center; color:var(--ink-soft); font-size:.9rem; }

  .goal { display:flex; align-items:center; gap:13px; padding:14px 16px; cursor:pointer;
    border-top:1px solid var(--line); background:var(--surface);
    will-change:transform; -webkit-tap-highlight-color:transparent; transition:background .2s; }
  .goal:first-child { border-top:0; }
  .goal:hover { background:color-mix(in srgb, var(--sage) 20%, var(--surface)); }
  .box { flex:none; width:28px; height:28px; display:grid; place-items:center; transition:transform .2s; }
  .box svg { width:26px; height:26px; overflow:visible; }
  .box .lf { fill:none; stroke:var(--brand-soft); stroke-width:1.8; stroke-linejoin:round; transition:fill .25s, stroke .25s; }
  .box .lv { fill:none; stroke:var(--brand-soft); stroke-width:1.5; stroke-linecap:round; opacity:.55; transition:stroke .25s, opacity .25s; }
  .goal:hover .box .lf { stroke:var(--brand); }
  .label { flex:1; font-size:.98rem; color:var(--ink); transition:color .25s; }
  .goal.done .box .lf { fill:var(--accent); stroke:var(--accent); }
  .goal.done .box .lv { stroke:#fff; opacity:.9; }
  .goal.done .label { color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--brand-soft); }
  .goal.pop .box { transform:scale(1.24) rotate(-10deg); }

  /* edit mode */
  .goal.editing { cursor:default; }
  .goal.editing:hover { background:var(--surface); }
  .goal .edit-input { flex:1; font:inherit; font-size:.98rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
  .goal .edit-input:focus { outline:none; border-color:var(--accent); }
  .grip { flex:none; color:var(--brand-soft); display:grid; place-items:center; width:22px; }
  .grip svg { width:16px; height:16px; fill:currentColor; }
  .del { flex:none; border:none; background:transparent; color:var(--danger); cursor:pointer;
    width:34px; height:34px; border-radius:8px; display:grid; place-items:center; }
  .del:hover { background:color-mix(in srgb, var(--danger) 14%, transparent); }
  .del svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }

  .addrow { display:flex; gap:10px; padding:12px 14px; border-top:1px solid var(--line); background:var(--surface-2); }
  .addrow input { flex:1; font:inherit; font-size:.95rem; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .addrow input:focus { outline:none; border-color:var(--accent); }
  .addrow button { border:none; background:var(--brand); color:#fff; font-weight:650; padding:0 16px;
    border-radius:9px; cursor:pointer; }
  .addrow button:hover { background:color-mix(in srgb, var(--brand) 88%, #000); }

  .cheer { text-align:center; font-family:var(--f-display); font-style:italic; font-size:1.05rem;
    color:var(--accent-ink); opacity:0; transform:translateY(6px); transition:opacity .4s, transform .4s; height:0; overflow:hidden; }
  .cheer.show { opacity:1; transform:none; height:auto; margin-top:14px; }

  .made { text-align:center; margin-top:36px; font-size:.78rem; color:var(--brand-soft); }
  .made b { color:var(--accent-ink); font-weight:700; }

  .petal { position:fixed; top:-24px; width:12px; height:12px; border-radius:60% 0 60% 0; pointer-events:none; z-index:50; opacity:.9; }
  .petal.apricot { border-radius:50%; background:var(--accent); box-shadow:inset -2px -2px 4px rgba(0,0,0,.14); }

  /* ── calendar / history view ── */
  .cal-overlay { position:fixed; inset:0; z-index:80; display:none; background:var(--bg);
    overflow-y:auto; padding:calc(env(safe-area-inset-top) + 6px) 0 44px; }
  .cal-overlay.open { display:block; }
  .cal-panel { max-width:540px; margin:0 auto; padding:16px 18px; }
  .cal-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .cal-title { font-weight:700; color:var(--brand); font-size:1.1rem; letter-spacing:-.01em; }
  .cal-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin:12px 0; }
  .cal-navbtn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:1.25rem; line-height:1; cursor:pointer;
    touch-action:manipulation; display:grid; place-items:center; }
  .cal-navbtn:disabled { opacity:.3; cursor:default; }
  .cal-month { min-width:172px; text-align:center; font-weight:650; font-size:1.05rem; color:var(--ink); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-dow span { text-align:center; font-size:.64rem; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-soft); font-weight:700; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-cell { position:relative; aspect-ratio:1; border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); padding:6px; }
  .cal-cell.cal-empty { background:transparent; border:0; }
  .cal-day { font-size:.8rem; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .cal-cell.cal-dark .cal-day { color:#F3F1E6; }
  .cal-cell.cal-today { outline:2px solid var(--accent); outline-offset:1px; }
  .cal-cell.cal-perfect { box-shadow:0 0 0 2px #6E9A3A, 0 3px 12px -3px rgba(110,154,58,.7); }
  .cal-dots { position:absolute; bottom:3px; right:4px; font-size:10px; line-height:1; letter-spacing:-1px; }
  .cal-summary { margin:18px 2px 4px; text-align:center; font-size:.9rem; color:var(--ink); font-weight:650; }
  .cal-note { text-align:center; font-size:.72rem; color:var(--brand-soft); margin-top:2px; }
  .cal-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:14px; font-size:.74rem; color:var(--ink-soft); }
  .cal-legend span { display:inline-flex; align-items:center; gap:5px; }
  .cal-legend .sw { width:26px; height:13px; border-radius:4px;
    background:linear-gradient(90deg, color-mix(in srgb,#5E7D33 22%,var(--surface-2)), #5E7D33); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Alayne<b>FIT</b></div>
    <div class="actions">
      <button class="iconbtn" id="cal-open" title="History" aria-label="Open history">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </button>
      <button class="iconbtn" id="edit" aria-pressed="false" title="Edit goals">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span id="editlbl">Edit</span>
      </button>
      <button class="iconbtn" id="theme" title="Switch light or dark" aria-label="Switch light or dark">◑</button>
    </div>
  </div>

  <div class="date" id="date"></div>
  <h1 class="hello"><span class="greet">Good morning, </span><span class="name">Alayne</span></h1>

  <div class="quote">
    <p id="quote"></p>
    <span class="sprig"></span>
  </div>

  <div class="progress">
    <div class="ring" id="ring"><i></i><span id="ringtxt">0/0</span></div>
    <div class="ptext">
      <div class="h" id="phead">Let's begin the day</div>
      <div class="s" id="psub">Tick things off as you go — no rush.</div>
    </div>
  </div>

  <div id="sections"></div>

  <p class="made">Made with love, for Alayne <b>♥</b></p>
</div>

<div class="cal-overlay" id="cal-overlay">
  <div class="cal-panel">
    <div class="cal-top">
      <div class="cal-title">History 🌿</div>
      <button class="iconbtn" id="cal-close" aria-label="Close calendar">✕ Close</button>
    </div>
    <div class="cal-nav">
      <button class="cal-navbtn" id="cal-prev" aria-label="Previous month">‹</button>
      <div class="cal-month" id="cal-month"></div>
      <button class="cal-navbtn" id="cal-next" aria-label="Next month">›</button>
    </div>
    <div class="cal-dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-summary" id="cal-summary"></div>
    <div class="cal-note" id="cal-note"></div>
    <div class="cal-legend">
      <span><i class="sw"></i> daily done</span>
      <span>🍃 weekly</span>
      <span>🍑 monthly</span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── CONFIG ───────────────────────────────────────────────────────────────
     After deploying workers/alaynefit-worker.js, paste its URL here. Until
     then the app still works fully on this device (local storage) — it just
     won't sync across devices yet. */
  var API_URL = "https://alaynefit.blakestringer.workers.dev";

  var LS_STATE = "alaynefit-state-v1";
  var LS_THEME = "alaynefit-theme";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── default content ── */
  var DEFAULTS = {
    daily: {
      title: "Today", reset: "resets at midnight", items: [
        "Get 7+ hours sleep", "Maintain a regular bedtime", "Chat to someone",
        "Go for a walk", "Read something worthwhile", "Meditate",
        "Note good things that happened", "Listen to music", "No‑alcohol night"
      ]
    },
    weekly: {
      title: "This week", reset: "resets Monday", items: [
        "Beach, lake or bush walk", "Listen to a podcast",
        "Brunch with Blake, family or friends", "Photograph something interesting"
      ]
    },
    monthly: {
      title: "This month", reset: "resets on the 1st", items: [
        "Browse in a bookshop", "Walk through a laneway", "Get coffee somewhere new",
        "Go to a market", "Catch up with the kids", "Visit an old building", "Go to the movies"
      ]
    }
  };
  var CADENCES = ["daily", "weekly", "monthly"];
  var META = { daily: DEFAULTS.daily, weekly: DEFAULTS.weekly, monthly: DEFAULTS.monthly };

  var QUOTES = [
    "You are allowed to be both a work in progress and a masterpiece.",
    "Small steps, taken kindly, still carry you forward.",
    "How you speak to yourself matters — be gentle today.",
    "Rest is productive. Joy is allowed.",
    "Progress, not perfection — and today, that's enough.",
    "Bloom at your own pace. Nothing is late that's still growing.",
    "Your body carries you through every day. Thank it.",
    "One kind choice at a time is how a whole life changes.",
    "You've done hard things before. Today is on your side.",
    "Be proud of how far you've come, quietly and for yourself.",
    "A calm mind is a kind of strength. Breathe into today.",
    "Tend to yourself the way you'd tend to someone you love.",
    "The little things are the big things. Notice one today.",
    "You don't have to earn rest. You're allowed to simply be."
  ];

  /* Completion messages — a fresh one is chosen each time a section is fully
     finished, so it feels different (and loving) every time. */
  var MESSAGES = {
    daily: [
      "That's every daily done, Alayne. Rest easy tonight. 🌿",
      "All of today, done — you showed up for yourself. So proud of you. 🌿",
      "Every daily ticked off. Look at you go, my love. 🌿",
      "A whole day of caring for you. Beautifully done, Alayne. 🌿",
      "You did it — all of today. Go be gently proud of yourself. 🌿",
      "Today, complete. You are doing so wonderfully. 🌿",
      "Each little thing, done with love. Sleep well tonight. 🌿",
      "That's the lot for today, Alayne. I'm so proud of you. 🌿"
    ],
    weekly: [
      "A whole week of showing up — incredible, Alayne. 🌿",
      "Every weekly goal, complete. You are unstoppable, my love. 🌿",
      "What a week you've made. So very proud of you. 🌿",
      "All done for the week — you've earned every bit of this. 🌿",
      "Seven days of caring for yourself. Beautiful work, Alayne. 🌿",
      "The whole week, ticked off. You amaze me. 🌿",
      "Weekly goals: all yours. Go and celebrate you. 🌿"
    ],
    monthly: [
      "A whole month of adventures and care — extraordinary, Alayne. 🍑🌿",
      "Every monthly goal, complete. What a month you've made, my love. 🍑",
      "You did the whole month. I am so, so proud of you. 🍑🌿",
      "A month of living fully. Look how far you've come, Alayne. 🍑",
      "All of it, done. You are wonderful — never forget it. 🍑🌿",
      "The entire month, ticked off. Absolutely glowing work. 🍑",
      "Month complete. Take a bow, my love — you've earned it. 🍑🌿"
    ]
  };
  function pickMsg(cadence) {
    var list = MESSAGES[cadence] || MESSAGES.daily;
    return list[Math.floor(Math.random() * list.length)];
  }

  /* ── date / period helpers (all local time = her timezone) ── */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function mondayOf(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = (t.getDay() + 6) % 7;           /* Mon = 0 … Sun = 6 */
    t.setDate(t.getDate() - day);
    return t;
  }
  function periodKey(cadence, d) {
    d = d || new Date();
    if (cadence === "daily")   return ymd(d);
    if (cadence === "weekly")  return "W" + ymd(mondayOf(d));
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);   /* monthly */
  }
  function isDone(goal, cadence) { return !!goal.p && goal.p === periodKey(cadence); }

  /* ── state ── */
  var uidCounter = 0;
  function uid() { uidCounter++; return "g" + Date.now().toString(36) + uidCounter.toString(36); }
  function seed() {
    var goals = {};
    CADENCES.forEach(function (c) {
      goals[c] = DEFAULTS[c].items.map(function (t) { return { id: uid(), text: t, p: null, ts: 0 }; });
    });
    return { v: 1, goals: goals, streaks: { day: { count: 0, last: "" }, week: { count: 0, last: "" }, month: { count: 0, last: "" } }, log: {} };
  }
  function valid(s) { return s && s.goals && s.goals.daily && s.goals.weekly && s.goals.monthly; }

  var state = null, loadedFromServer = false;

  /* ── persistence ── */
  function saveLocal() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch (e) {} }

  var putTimer = null;
  function scheduleSave() {
    saveLocal();
    if (!API_URL) return;
    clearTimeout(putTimer);
    putTimer = setTimeout(pushServer, 700);
  }
  function pushServer() {
    if (!API_URL) return;
    fetch(API_URL, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).catch(function () {});
  }
  function pullServer() {
    if (!API_URL) return;
    fetch(API_URL, { headers: { "Content-Type": "application/json" }, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (remote) {
        if (valid(remote)) {                 /* server is the source of truth */
          state = remote; loadedFromServer = true;
          ensureStreaks();
          ensureLog();
          renderAll(); updateProgress();
        } else if (state) {                  /* first run: seed the server */
          pushServer();
        }
      }).catch(function () {});
  }

  /* ── header: date, greeting, quote ── */
  var now = new Date();
  var DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("date").textContent = DOW[now.getDay()] + ", " + now.getDate() + " " + MON[now.getMonth()];
  var hr = now.getHours();
  document.querySelector(".greet").textContent = hr < 12 ? "Good morning, " : hr < 18 ? "Good afternoon, " : "Good evening, ";
  /* A random affectionate nickname each time she opens the app. */
  var PETNAMES = ["HUNBO!", "LUFFLY!", "PP!", "HONEY BOBO!", "LEEDEE!", "LANIE LOO!", "BB!"];
  document.querySelector(".name").textContent = PETNAMES[Math.floor(Math.random() * PETNAMES.length)];
  var dayNum = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  document.getElementById("quote").textContent = QUOTES[dayNum % QUOTES.length];

  /* ── rendering ── */
  var sectionsEl = document.getElementById("sections");
  var editing = false;
  var secRefs = {};   /* cadence -> {list, cheer, count, nodes:{id:row}} */

  function ordered(cadence) {
    return state.goals[cadence].slice().sort(function (a, b) {
      var da = isDone(a, cadence), db = isDone(b, cadence);
      if (da !== db) return da ? 1 : -1;   /* done sink to bottom */
      if (da) return a.ts - b.ts;          /* by completion order */
      return 0;                            /* else keep stored order */
    });
  }

  function esc(t) { return t; }  /* textContent is used, no escaping needed */

  function buildGoalRow(goal, cadence) {
    var row = document.createElement("div");
    row.className = "goal" + (isDone(goal, cadence) ? " done" : "") + (editing ? " editing" : "");

    if (editing) {
      row.innerHTML =
        '<span class="grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>' +
        '<input class="edit-input" type="text" aria-label="Goal name">' +
        '<button class="del" title="Delete goal" aria-label="Delete goal"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>';
      var input = row.querySelector(".edit-input");
      input.value = goal.text;
      input.addEventListener("change", function () {
        var v = input.value.trim();
        if (v) { goal.text = v; scheduleSave(); } else { input.value = goal.text; }
      });
      row.querySelector(".del").addEventListener("click", function () {
        state.goals[cadence] = state.goals[cadence].filter(function (g) { return g.id !== goal.id; });
        scheduleSave(); renderSection(cadence); updateProgress();
      });
    } else {
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-pressed", isDone(goal, cadence) ? "true" : "false");
      row.innerHTML =
        '<span class="box"><svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path class="lf" d="M5 19 C5 10 11 5 19 5 C19 13 13 19 5 19 Z"/>' +
          '<path class="lv" d="M8.5 16.5 C11 12 14 9 17.5 7.5"/></svg></span>' +
        '<span class="label"></span>';
      row.querySelector(".label").textContent = goal.text;
      var toggle = function () { toggleGoal(goal, cadence, row); };
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
      });
    }
    return row;
  }

  function renderSection(cadence) {
    var ref = secRefs[cadence];
    var list = ref.list;
    list.innerHTML = "";
    ref.nodes = {};
    var items = editing ? state.goals[cadence] : ordered(cadence);
    if (!items.length && !editing) {
      var e = document.createElement("div"); e.className = "empty";
      e.textContent = "No goals here yet — tap Edit to add some.";
      list.appendChild(e);
    }
    items.forEach(function (goal) {
      var row = buildGoalRow(goal, cadence);
      ref.nodes[goal.id] = row;
      list.appendChild(row);
    });
    if (editing) {
      var add = document.createElement("div"); add.className = "addrow";
      add.innerHTML = '<input type="text" placeholder="Add a goal…" aria-label="Add a goal"><button type="button">Add</button>';
      var inp = add.querySelector("input"), btn = add.querySelector("button");
      var doAdd = function () {
        var v = inp.value.trim(); if (!v) return;
        state.goals[cadence].push({ id: uid(), text: v, p: null, ts: 0 });
        inp.value = ""; scheduleSave(); renderSection(cadence); updateProgress(); inp.focus();
      };
      btn.addEventListener("click", doAdd);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doAdd(); } });
      list.appendChild(add);
    }
    updateCount(cadence);
  }

  function updateCount(cadence) {
    var ref = secRefs[cadence], items = state.goals[cadence];
    var done = items.filter(function (g) { return isDone(g, cadence); }).length;
    ref.count.textContent = done + " / " + items.length;
    var all = items.length > 0 && done === items.length && !editing;
    if (all) {
      /* Pick a message only on the transition INTO complete; keep it stable
         while it stays complete (re-renders/reorders won't reshuffle it). */
      if (!ref.msg) ref.msg = pickMsg(cadence);
      ref.cheer.textContent = ref.msg;
      ref.cheer.classList.add("show");
    } else {
      ref.msg = null;
      ref.cheer.classList.remove("show");
    }
  }

  function reorder(cadence) {
    if (editing) return;
    var ref = secRefs[cadence], list = ref.list, first = {};
    Object.keys(ref.nodes).forEach(function (id) {
      if (ref.nodes[id].parentNode === list) first[id] = ref.nodes[id].getBoundingClientRect().top;
    });
    ordered(cadence).forEach(function (goal) { if (ref.nodes[goal.id]) list.appendChild(ref.nodes[goal.id]); });
    if (reduce) return;
    ordered(cadence).forEach(function (goal) {
      var el = ref.nodes[goal.id]; if (!el || first[goal.id] == null) return;
      var d = first[goal.id] - el.getBoundingClientRect().top; if (!d) return;
      el.style.transition = "none"; el.style.transform = "translateY(" + d + "px)";
      requestAnimationFrame(function () {
        el.style.transition = "transform .45s cubic-bezier(.2,.7,.2,1)"; el.style.transform = "";
      });
    });
  }

  var tsCounter = 1;
  function toggleGoal(goal, cadence, row) {
    var done = isDone(goal, cadence);
    if (done) {
      logUncomplete(cadence, goal.pd || ymd(now));   /* undo the day it was logged on */
      goal.p = null; goal.ts = 0; goal.pd = null;
    } else {
      goal.p = periodKey(cadence); goal.ts = Date.now() + (tsCounter++);
      goal.pd = logComplete(cadence);                /* remember the day for an accurate undo */
      bumpStreak(cadence);
    }
    row.classList.toggle("done", !done);
    row.setAttribute("aria-pressed", !done ? "true" : "false");
    row.classList.add("pop"); setTimeout(function () { row.classList.remove("pop"); }, 220);
    setTimeout(function () { reorder(cadence); }, 150);
    updateCount(cadence); updateProgress(); scheduleSave();
    /* Celebrate only when a completion (not an un-tick) finishes a whole
       section — leaves for daily, more for weekly, a downpour with apricots
       for monthly. */
    if (!done && state.goals[cadence].every(function (g) { return isDone(g, cadence); })) celebrate(cadence);
  }

  /* ── streaks ── one per cadence. A streak counts consecutive periods (days /
     weeks / months) in which at least one goal of that cadence was completed.
     Day = sprout 🌱, week = leaf 🍃, month = apricot 🍑. ── */
  var STREAK_MAP  = { daily: "day", weekly: "week", monthly: "month" };
  var STREAK_DEFS = [
    { key: "day",   cad: "daily",   sym: "🌱", word: "day" },
    { key: "week",  cad: "weekly",  sym: "🍃", word: "week" },
    { key: "month", cad: "monthly", sym: "🍑", word: "month" }
  ];
  function curKey(cadence) { return periodKey(cadence, now); }
  function prevKey(cadence) {
    if (cadence === "daily")  return ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
    if (cadence === "weekly") { var m = mondayOf(now); return "W" + ymd(new Date(m.getFullYear(), m.getMonth(), m.getDate() - 7)); }
    var pm = new Date(now.getFullYear(), now.getMonth() - 1, 1);   /* monthly */
    return pm.getFullYear() + "-" + pad(pm.getMonth() + 1);
  }
  function ensureStreaks() {
    if (!state.streaks) state.streaks = { day: state.streak || { count: 0, last: "" } };
    ["day", "week", "month"].forEach(function (k) { if (!state.streaks[k]) state.streaks[k] = { count: 0, last: "" }; });
    if (state.streak) delete state.streak;
  }

  /* ── history log ── one small record per date: d/dt = daily done/total that
     day (drives the calendar's green fill), w/m = weekly/monthly completions
     that day (drive the leaf/apricot dots). Written from now on; there is no
     data for days before this feature shipped. ── */
  function ensureLog() { if (!state.log) state.log = {}; }
  function logComplete(cadence) {
    var key = ymd(now), e = state.log[key] || (state.log[key] = { d: 0, dt: 0, w: 0, m: 0 });
    if (cadence === "daily")       { e.d++; e.dt = state.goals.daily.length; }
    else if (cadence === "weekly")   e.w++;
    else                             e.m++;
    return key;
  }
  function logUncomplete(cadence, key) {
    var e = state.log[key]; if (!e) return;
    if (cadence === "daily")       { e.d = Math.max(0, e.d - 1); e.dt = state.goals.daily.length; }
    else if (cadence === "weekly")   e.w = Math.max(0, e.w - 1);
    else                             e.m = Math.max(0, e.m - 1);
    if (e.d <= 0 && e.w <= 0 && e.m <= 0) delete state.log[key];
  }
  function bumpStreak(cadence) {
    var key = STREAK_MAP[cadence]; if (!key) return;
    var s = state.streaks[key], cur = curKey(cadence), prev = prevKey(cadence);
    if (s.last === cur) return;                       /* already counted this period */
    s.count = (s.last === prev) ? s.count + 1 : 1;    /* consecutive? extend : restart */
    s.last = cur;
    renderStreaks();
  }
  function renderStreaks() {
    STREAK_DEFS.forEach(function (d) {
      var ref = secRefs[d.cad]; if (!ref || !ref.streak) return;
      ref.streak.innerHTML = "";
      var s = state.streaks[d.key]; if (!s || s.count < 1) return;
      /* show only while still live (current or immediately previous period) */
      if (s.last !== curKey(d.cad) && s.last !== prevKey(d.cad)) return;
      var chip = document.createElement("div"); chip.className = "streak";
      chip.textContent = d.sym + " " + s.count + " " + d.word + " streak";
      ref.streak.appendChild(chip);
    });
  }

  /* ── daily progress ring ── */
  function updateProgress() {
    var items = state.goals.daily;
    var done = items.filter(function (g) { return isDone(g, "daily"); }).length;
    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    document.getElementById("ring").style.setProperty("--pct", pct);
    document.getElementById("ringtxt").textContent = done + "/" + items.length;
    var h = document.getElementById("phead"), s = document.getElementById("psub");
    if (!items.length) { h.textContent = "Add a few daily goals"; s.textContent = "Tap Edit to make it yours."; }
    else if (done === 0) { h.textContent = "Let's begin the day"; s.textContent = "Tick things off as you go — no rush."; }
    else if (done === items.length) { h.textContent = "Every daily done ♥"; s.textContent = "You showed up for yourself today."; }
    else { h.textContent = done + " done, " + (items.length - done) + " to go"; s.textContent = "Lovely momentum — keep it gentle."; }
    renderStreaks();
  }

  function renderAll() {
    sectionsEl.innerHTML = ""; secRefs = {};
    CADENCES.forEach(function (cadence) {
      var sec = document.createElement("section"); sec.className = "section";
      sec.innerHTML =
        '<div class="sec-head"><div class="sec-title"><h2></h2><span class="reset"></span></div><span class="sec-count"></span></div>' +
        '<div class="sec-streak"></div><div class="list"></div><div class="cheer"></div>';
      sec.querySelector("h2").textContent = META[cadence].title;
      sec.querySelector(".reset").textContent = META[cadence].reset;
      sectionsEl.appendChild(sec);
      secRefs[cadence] = { list: sec.querySelector(".list"), cheer: sec.querySelector(".cheer"),
                           count: sec.querySelector(".sec-count"), streak: sec.querySelector(".sec-streak"), nodes: {} };
      renderSection(cadence);
    });
  }

  /* ── celebration ── falling leaves (and apricots for the big one) ── */
  function rain(opts) {
    if (reduce) return;
    var cs = getComputedStyle(document.documentElement);
    var leaves = [cs.getPropertyValue("--sage").trim(), cs.getPropertyValue("--brand").trim(),
                  cs.getPropertyValue("--accent").trim(), cs.getPropertyValue("--sage").trim()];
    var spread = opts.spread || 500;
    for (var i = 0; i < opts.count; i++) (function (i) {
      var p = document.createElement("div");
      if (opts.apricots && Math.random() < 0.33) {
        p.className = "petal apricot";
        var a = 13 + Math.random() * 7; p.style.width = a + "px"; p.style.height = a + "px";
      } else {
        p.className = "petal";
        p.style.background = leaves[i % leaves.length];
        var s = 9 + Math.random() * 6; p.style.width = s + "px"; p.style.height = s + "px";
      }
      p.style.left = (3 + Math.random() * 94) + "%";
      document.body.appendChild(p);
      var x = (Math.random() * 2 - 1) * 80, dur = 2200 + Math.random() * 1700,
          delay = Math.random() * spread, spin = 360 + Math.random() * 420;
      p.animate(
        [{ transform: "translate(0,0) rotate(0)", opacity: 1 },
         { transform: "translate(" + x + "px," + (innerHeight + 50) + "px) rotate(" + spin + "deg)", opacity: .9 }],
        { duration: dur, delay: delay, easing: "cubic-bezier(.3,.4,.5,1)", fill: "forwards" }
      ).onfinish = function () { p.remove(); };
    })(i);
  }
  function celebrate(cadence) {
    if (cadence === "weekly")       rain({ count: 44, spread: 850 });
    else if (cadence === "monthly") rain({ count: 74, apricots: true, spread: 1250 });
    else                            rain({ count: 16, spread: 450 });
  }

  /* ── edit toggle ── */
  document.getElementById("edit").addEventListener("click", function () {
    editing = !editing;
    this.setAttribute("aria-pressed", editing ? "true" : "false");
    this.classList.toggle("on", editing);
    document.getElementById("editlbl").textContent = editing ? "Done" : "Edit";
    CADENCES.forEach(renderSection);
    updateProgress();
  });

  /* ── theme (with a secret Synthwave mode) ── */
  var SYNTH_KEY = "alaynefit-synth-unlocked";
  function synthUnlocked() { try { return localStorage.getItem(SYNTH_KEY) === "1"; } catch (e) { return false; } }
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(LS_THEME, t); } catch (e) {}
  }
  (function initTheme() {
    var saved = null; try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    if (saved === "synthwave" && !synthUnlocked()) saved = "dark";   /* safety */
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
  function curTheme() {
    var c = document.documentElement.getAttribute("data-theme");
    return c || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  var tapTimes = [];
  document.getElementById("theme").addEventListener("click", function () {
    if (synthUnlocked()) {                       /* cycle light → dark → synthwave */
      var order = ["light", "dark", "synthwave"], i = order.indexOf(curTheme());
      setTheme(order[(i + 1) % order.length]);
      return;
    }
    setTheme(curTheme() === "dark" ? "light" : "dark");   /* normal toggle… */
    var t = Date.now();                                   /* …while counting rapid taps */
    tapTimes.push(t);
    tapTimes = tapTimes.filter(function (x) { return t - x <= 30000; });
    if (tapTimes.length >= 20) {
      tapTimes = [];
      try { localStorage.setItem(SYNTH_KEY, "1"); } catch (e) {}
      setTheme("synthwave");
      showSynthToast();
    }
  });
  function showSynthToast() {
    var el = document.createElement("div");
    el.className = "synth-toast";
    el.textContent = "🌆 Synthwave Mode unlocked!";
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("show"); });
    setTimeout(function () { el.classList.remove("show"); setTimeout(function () { el.remove(); }, 400); }, 3600);
  }

  /* ── calendar / history view ── */
  var calYear, calMonth, calOv = document.getElementById("cal-overlay");
  function openCalendar() {
    calYear = now.getFullYear(); calMonth = now.getMonth();
    renderCalendar();
    calOv.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeCalendar() {
    calOv.classList.remove("open");
    document.body.style.overflow = "";
  }
  function renderCalendar() {
    document.getElementById("cal-month").textContent = MON[calMonth] + " " + calYear;
    var grid = document.getElementById("cal-grid"); grid.innerHTML = "";
    var offset = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;   /* Mon-start */
    var days = new Date(calYear, calMonth + 1, 0).getDate();
    var todayKey = ymd(now), i, b;
    for (i = 0; i < offset; i++) { b = document.createElement("div"); b.className = "cal-cell cal-empty"; grid.appendChild(b); }
    var perfect = 0, wk = 0, mo = 0;
    for (var day = 1; day <= days; day++) {
      var key = calYear + "-" + pad(calMonth + 1) + "-" + pad(day);
      var e = state.log[key];
      var cell = document.createElement("div"); cell.className = "cal-cell";
      var frac = (e && e.dt > 0) ? Math.min(1, e.d / e.dt) : 0;
      if (frac > 0) {
        cell.style.background = "color-mix(in srgb, #5E7D33 " + Math.round(22 + frac * 78) + "%, var(--surface-2))";
        if (frac >= 0.5) cell.classList.add("cal-dark");
        if (frac >= 1) { cell.classList.add("cal-perfect"); perfect++; }
      }
      if (key === todayKey) cell.classList.add("cal-today");
      var dots = "";
      if (e && e.w > 0) { dots += "🍃"; wk += e.w; }
      if (e && e.m > 0) { dots += "🍑"; mo += e.m; }
      cell.innerHTML = '<span class="cal-day">' + day + '</span>' + (dots ? '<span class="cal-dots">' + dots + '</span>' : '');
      grid.appendChild(cell);
    }
    document.getElementById("cal-summary").textContent =
      "🌿 " + perfect + " full " + (perfect === 1 ? "day" : "days") + " · 🍃 " + wk + " weekly · 🍑 " + mo + " monthly";
    var thisMonth = (calYear === now.getFullYear() && calMonth === now.getMonth());
    document.getElementById("cal-note").textContent = thisMonth ? "History records from the day you started using this view." : "";
    document.getElementById("cal-next").disabled =
      (calYear > now.getFullYear() || (calYear === now.getFullYear() && calMonth >= now.getMonth()));
    /* Don't allow going back before the first month that has any history. */
    var first = earliestLogMonth();
    document.getElementById("cal-prev").disabled =
      (calYear < first.y || (calYear === first.y && calMonth <= first.m));
  }
  function earliestLogMonth() {
    var keys = Object.keys(state.log).sort();
    if (!keys.length) return { y: now.getFullYear(), m: now.getMonth() };
    return { y: parseInt(keys[0].slice(0, 4), 10), m: parseInt(keys[0].slice(5, 7), 10) - 1 };
  }
  document.getElementById("cal-open").addEventListener("click", openCalendar);
  document.getElementById("cal-close").addEventListener("click", closeCalendar);
  document.getElementById("cal-prev").addEventListener("click", function () {
    if (this.disabled) return;
    calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", function () {
    if (this.disabled) return;
    calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && calOv.classList.contains("open")) closeCalendar(); });

  /* ── boot ── */
  var local = null;
  try { local = JSON.parse(localStorage.getItem(LS_STATE) || "null"); } catch (e) {}
  state = valid(local) ? local : seed();
  ensureStreaks();
  ensureLog();
  renderAll();
  updateProgress();
  if (!valid(local)) saveLocal();
  pullServer();
})();
</script>
</body>
</html>
