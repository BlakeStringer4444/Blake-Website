<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theatredex 2026 | Blake Stringer</title>
<meta name="description" content="Browse and filter Victorian community theatre productions for 2026. Search by location, month, and type.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.blakestringer.com/tools/2026-theatredex">
<link rel="icon" type="image/png" href="/Images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --lime:   #D4FF1A;
  --purple: #9933FF;
  --black:  #0a0a0a;
  --offwhite: #f5f5f0;
  --bg:         var(--offwhite);
  --fg:         var(--black);
  --card-bg:    #ffffff;
  --card-border:rgba(0,0,0,0.1);
  --muted:      rgba(0,0,0,0.45);
  --input-bg:   #ffffff;
  --input-border:rgba(0,0,0,0.15);
}
[data-theme="dark"] {
  --bg:         var(--black);
  --fg:         #f5f5f0;
  --card-bg:    #141414;
  --card-border:rgba(255,255,255,0.09);
  --muted:      rgba(240,240,235,0.4);
  --input-bg:   #1a1a1a;
  --input-border:rgba(255,255,255,0.14);
}
[data-theme="terminal"] {
  --bg:         #0a0a0a;
  --fg:         #ffffff;
  --card-bg:    #111111;
  --card-border:rgba(255,255,255,0.07);
  --muted:      rgba(255,255,255,0.35);
  --input-bg:   #111111;
  --input-border:rgba(255,255,255,0.12);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  transition: background 0.2s, color 0.2s;
}

/* ── HEADER ── */
.td-header {
  background: var(--black);
  padding: 28px 48px 24px;
}
.td-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.td-back {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  transition: color 0.2s;
  padding-top: 6px;
}
.td-back:hover { color: var(--lime); }

.td-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.td-sheet-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  border: 1px solid rgba(212,255,26,0.25);
  padding: 0 13px;
  height: 34px;
  display: inline-flex; align-items: center;
  border-radius: 2px;
  transition: all 0.2s;
  white-space: nowrap;
}
.td-sheet-btn:hover { color: var(--lime); border-color: var(--lime); }

.td-header-btns {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.td-header-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  border: 1px solid rgba(212,255,26,0.25);
  padding: 7px 14px;
  border-radius: 2px;
  transition: all 0.2s;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 1;
}
.td-header-btn:hover { color: var(--lime); border-color: var(--lime); }

.td-theme-btn {
  background: none;
  border: 1px solid rgba(212,255,26,0.25);
  color: rgba(212,255,26,0.7);
  width: 34px; height: 34px;
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-size: 16px;
  line-height: 1;
}
.td-theme-btn:hover { border-color: var(--lime); color: var(--lime); }
.td-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 9vw, 104px);
  letter-spacing: 6px;
  line-height: 1;
  color: var(--lime);
}
.td-subtitle {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(212,255,26,0.5);
  margin-top: 6px;
}

/* ── CONTROLS ── */
.td-controls {
  padding: 18px 48px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}
.td-search {
  width: 100%;
  padding: 10px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  border: 1px solid var(--input-border);
  border-radius: 3px;
  background: var(--input-bg);
  color: var(--fg);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.td-search:focus { border-color: var(--purple); }
.td-search::placeholder { color: var(--muted); }

.td-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.td-upcoming-toggle {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 5px 12px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.td-upcoming-toggle.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.td-upcoming-toggle:hover:not(.active) { border-color: var(--purple); color: var(--purple); }
[data-theme="terminal"] .td-upcoming-toggle.active { background: var(--lime); border-color: var(--lime); color: var(--black); }
[data-theme="terminal"] .td-upcoming-toggle:hover:not(.active) { border-color: var(--lime); color: var(--lime); }

.td-select {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 10px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: var(--input-bg);
  color: var(--fg);
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.td-select:focus { border-color: var(--purple); }

.td-controls-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  flex-wrap: wrap;
  gap: 6px;
}
.td-count {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
}
.td-refresh-btn {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  padding: 3px 9px;
  cursor: pointer;
  transition: all 0.15s;
}
.td-refresh-btn:hover { border-color: var(--purple); color: var(--purple); }
.td-refresh-btn:disabled { opacity: 0.4; cursor: default; }
[data-theme="terminal"] .td-refresh-btn:hover { border-color: var(--lime); color: var(--lime); }

/* ── MAIN ── */
.td-main { padding: 28px 48px 72px; }

.td-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

/* ── CARD ── */
.td-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 4px;
  padding: 18px 18px 14px;
  display: flex; flex-direction: column; gap: 7px;
  transition: border-color 0.18s, transform 0.15s, box-shadow 0.15s;
}
.td-card:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(153,51,255,0.1);
}
.td-card-row1 {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.td-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
@keyframes td-now-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}
.td-badge-nowshowing {
  background: rgba(220,38,38,0.1); color: #dc2626;
  animation: td-now-pulse 1.4s ease-in-out infinite;
}
[data-theme="dark"]     .td-badge-nowshowing { background: rgba(255,80,80,0.1);  color: #ff6b6b; }
[data-theme="terminal"] .td-badge-nowshowing { background: rgba(212,255,26,0.08); color: var(--lime); }
.td-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px; flex-shrink: 0;
}
.td-badge-play     { background: rgba(153,51,255,0.1);  color: var(--purple); }
.td-badge-musical  { background: rgba(212,255,26,0.18); color: #5c7a00; }
.td-badge-pantomime{ background: rgba(255,140,0,0.13);  color: #b86000; }
[data-theme="dark"] .td-badge-musical   { color: #c4ef00; background: rgba(212,255,26,0.12); }
[data-theme="dark"] .td-badge-pantomime { color: #ffaa44; background: rgba(255,170,68,0.12); }
[data-theme="terminal"] .td-badge-play     { color: #fff; background: rgba(255,255,255,0.08); }
[data-theme="terminal"] .td-badge-musical  { color: var(--lime); background: rgba(212,255,26,0.08); }
[data-theme="terminal"] .td-badge-pantomime{ color: #ffaa44; background: rgba(255,170,68,0.08); }

.td-company {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.td-title-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px; letter-spacing: 2px;
  color: var(--purple);
  line-height: 1.1;
}
[data-theme="dark"]     .td-title-text { color: var(--lime); }
[data-theme="terminal"] .td-title-text { color: #ffffff; }

.td-dates {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 0.5px;
  color: var(--fg);
}
.td-location {
  font-size: 12px; color: var(--muted);
}
.td-people {
  font-size: 11px; color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--card-border);
  padding-top: 7px; margin-top: 2px;
}
.td-links {
  display: flex; gap: 5px;
}
.td-link {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 6px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  text-decoration: none;
  color: var(--muted);
  transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  flex: 1; min-width: 0;
}
.td-link:hover { border-color: var(--purple); color: var(--purple); }
[data-theme="terminal"] .td-link:hover { border-color: var(--lime); color: var(--lime); }
.td-link svg { flex-shrink: 0; }
button.td-link { background: none; cursor: pointer; }

.td-blakeai {
  width: 100%;
  padding: 7px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  background: none;
  border: 1px solid rgba(153,51,255,0.35);
  border-radius: 2px;
  color: var(--purple);
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.15s, color 0.15s;
}
.td-blakeai:hover { background: var(--purple); color: #fff; }
[data-theme="dark"]     .td-blakeai { border-color: rgba(212,255,26,0.3); color: var(--lime); }
[data-theme="dark"]     .td-blakeai:hover { background: rgba(212,255,26,0.12); color: var(--lime); }
[data-theme="terminal"] .td-blakeai { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.55); }
[data-theme="terminal"] .td-blakeai:hover { background: rgba(255,255,255,0.07); color: #fff; }

/* ── BLAKEAI MODAL ── */
.blakeai-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
  padding-bottom: env(safe-area-inset-bottom);
}
.blakeai-overlay.open { opacity: 1; pointer-events: auto; }
.blakeai-modal {
  background: #111111;
  width: 100%; max-width: 680px;
  max-height: 96vh; max-height: 96dvh;
  border-radius: 8px 8px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
  position: relative;
}
.blakeai-overlay.open .blakeai-modal { transform: translateY(0); }
.blakeai-modal-hd {
  background: #0a0a0a;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 15px 64px 15px 18px;
  flex-shrink: 0;
}
.blakeai-modal-info { flex: 1; min-width: 0; }
.blakeai-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--lime); opacity: 0.65; margin-bottom: 4px;
}
.blakeai-modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 2px; color: #fff; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.blakeai-modal-company {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.5); margin-top: 5px;
}
.blakeai-modal-meta {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1px;
  color: rgba(255,255,255,0.45); margin-top: 5px;
}
.blakeai-modal-dates {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  color: rgba(255,255,255,0.28); margin-top: 3px;
}
.blakeai-close {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 10;
  background: rgba(20,20,20,0.85); border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.8); width: 40px; height: 40px;
  border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.15s;
}
.blakeai-close:hover { background: rgba(60,60,60,0.95); border-color: rgba(255,255,255,0.55); color: #fff; }
.blakeai-messages {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.blakeai-welcome { display: flex; flex-direction: column; gap: 14px; }
.blakeai-welcome-text {
  font-family: 'DM Mono', monospace;
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}
.blakeai-chips { display: flex; flex-wrap: wrap; gap: 9px; }
.blakeai-chip {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px;
  padding: 9px 16px; border: 1px solid rgba(212,255,26,0.3);
  border-radius: 20px; background: none; color: rgba(212,255,26,0.65);
  cursor: pointer; transition: all 0.15s; text-align: left;
}
.blakeai-chip:hover { background: rgba(212,255,26,0.1); border-color: var(--lime); color: var(--lime); }
.blakeai-msg { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
.blakeai-msg.user { align-self: flex-end; align-items: flex-end; }
.blakeai-msg.ai   { align-self: flex-start; align-items: flex-start; }
.blakeai-msg-label {
  font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
}
.blakeai-msg.user .blakeai-msg-label { color: rgba(153,51,255,0.55); }
.blakeai-msg.ai   .blakeai-msg-label { color: rgba(212,255,26,0.45); }
.blakeai-msg-bubble {
  padding: 10px 14px; border-radius: 4px;
  font-size: 13px; line-height: 1.6;
}
.blakeai-msg.user .blakeai-msg-bubble { background: var(--purple); color: #fff; }
.blakeai-msg.ai   .blakeai-msg-bubble { background: #1c1c1c; color: #f0f0eb; }
.blakeai-thinking .blakeai-msg-bubble { color: rgba(255,255,255,0.35); font-style: italic; }
.blakeai-input-row {
  padding: 12px 18px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; gap: 8px; flex-shrink: 0;
}
.blakeai-input {
  flex: 1; padding: 10px 13px;
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 3px; font-family: 'Inter', sans-serif;
  font-size: 16px; color: #f0f0eb; outline: none; transition: border-color 0.2s;
}
.blakeai-input:focus { border-color: var(--purple); }
.blakeai-input::placeholder { color: rgba(255,255,255,0.22); }
.blakeai-send {
  background: var(--purple); border: none; border-radius: 3px;
  width: 42px; height: 42px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.15s;
}
.blakeai-send:hover { opacity: 0.85; }
.blakeai-send:disabled { opacity: 0.3; cursor: default; }

/* ── STATES ── */
.td-empty, .td-loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
}

/* ── JUMP TO TOP ── */
.td-jump-top {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 42px; height: 42px;
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.2s;
  z-index: 200;
  box-shadow: 0 4px 18px rgba(153,51,255,0.35);
}
.td-jump-top.visible { opacity: 1; pointer-events: auto; }
.td-jump-top:hover { transform: translateY(-3px); }
[data-theme="terminal"] .td-jump-top { background: var(--lime); color: var(--black); box-shadow: 0 4px 18px rgba(212,255,26,0.2); }

/* ── FOOTER ── */
.td-footer {
  padding: 20px 48px;
  border-top: 1px solid var(--card-border);
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}
.td-footer a {
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
}
.td-footer a:hover { color: var(--purple); }

/* ── MOBILE ── */
@media (max-width: 639px) {
  .td-header   { padding: 20px 20px 18px; }
  .td-controls { padding: 14px 20px 12px; position: relative; }
  .td-main     { padding: 20px 20px 56px; }
  .td-grid     { grid-template-columns: 1fr; }
  .td-footer   { padding: 20px; flex-direction: column; text-align: center; }
  .td-title    { font-size: clamp(48px, 14vw, 80px); }
  .td-jump-top { bottom: 18px; right: 18px; }
  .blakeai-modal { max-height: 94vh; max-height: 94dvh; }
}
</style>
</head>
<body>

<header class="td-header">
  <div class="td-header-top">
    <a class="td-back" href="/">← blakestringer.com</a>
    <div class="td-header-actions">
      <button class="td-theme-btn" id="td-theme-btn" title="Toggle theme"></button>
    </div>
  </div>
  <h1 class="td-title">Theatredex 2026</h1>
  <p class="td-subtitle">Blake's nerdy attempt to summarise all things community theatre in Victoria lol</p>
  <div class="td-header-btns">
    <a class="td-header-btn" href="https://docs.google.com/spreadsheets/d/1n5MPCEAsES9yMqRmvTC0TBwS51b_Sf4DYZcWJCzZO8Y/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Spreadsheet View ↗</a>
    <a class="td-header-btn" href="https://vdl.org.au/auditions/" target="_blank" rel="noopener noreferrer">Current Auditions ↗</a>
  </div>
</header>

<div class="td-controls">
  <input type="search" class="td-search" id="td-search" placeholder="Search title, company, playwright, director…">
  <div class="td-filter-row">
    <select class="td-select" id="td-company">
      <option value="">All Companies</option>
    </select>
    <select class="td-select" id="td-month">
      <option value="">All Months</option>
    </select>
    <button class="td-upcoming-toggle active" id="td-upcoming" title="Show only current &amp; future productions">Upcoming</button>
  </div>
  <div class="td-controls-bottom">
    <div class="td-count" id="td-count"></div>
    <button class="td-refresh-btn" id="td-refresh-btn" title="Re-fetch data from Google Sheets">↻ Refresh Data</button>
  </div>
</div>

<main class="td-main">
  <div class="td-grid" id="td-grid">
    <div class="td-loading">Loading shows…</div>
  </div>
</main>

<div class="blakeai-overlay" id="blakeai-overlay">
  <div class="blakeai-modal" id="blakeai-modal">
    <button class="blakeai-close" id="blakeai-close" aria-label="Close">✕</button>
    <div class="blakeai-modal-hd">
      <div class="blakeai-modal-info">
        <div class="blakeai-badge">✦ Ask BlakeAI</div>
        <div class="blakeai-modal-title" id="blakeai-title"></div>
        <div class="blakeai-modal-company" id="blakeai-company"></div>
        <div class="blakeai-modal-meta" id="blakeai-director"></div>
        <div class="blakeai-modal-meta" id="blakeai-playwright"></div>
        <div class="blakeai-modal-dates" id="blakeai-dates"></div>
      </div>
    </div>
    <div class="blakeai-messages" id="blakeai-messages"></div>
    <div class="blakeai-input-row">
      <input class="blakeai-input" id="blakeai-input" type="text" placeholder="Ask about this play…" autocomplete="off">
      <button class="blakeai-send" id="blakeai-send" aria-label="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<button class="td-jump-top" id="td-jump-top" title="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>
/* ── THEME ── */
const themeBtn = document.getElementById('td-theme-btn');
const sunSVG  = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.93" y2="5.93"/><line x1="18.07" y1="18.07" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.93" y2="18.07"/><line x1="18.07" y1="5.93" x2="19.78" y2="4.22"/></svg>`;
const lockSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`;

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.innerHTML = theme === 'terminal' ? lockSVG : theme === 'dark' ? sunSVG : '☾';
  if (theme === 'terminal') {
    sessionStorage.setItem('theme', 'terminal');
  } else {
    localStorage.setItem('theme', theme);
    sessionStorage.removeItem('theme');
  }
}

(function () {
  const saved = sessionStorage.getItem('theme') || localStorage.getItem('theme') || 'light';
  setTheme(saved);
})();

themeBtn.addEventListener('click', () => {
  const themes = ['light', 'dark', 'terminal'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  setTheme(themes[(themes.indexOf(cur) + 1) % themes.length]);
});

/* ── CONFIG ── */
const CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfBhALi9j_StQcvcxjy7Iyj6xNOejrkT5cLK4NHUiikmuoKoPXZxdOPeQJTpwrjD5tgUNQ0iKV9UIP/pub?gid=1603898813&single=true&output=csv';
const WORKER_URL = 'https://blakeai.blakestringer.workers.dev'; /* ← paste your Cloudflare Worker URL here once deployed */
const MONTHS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── URL NORMALISER ── */
function safeUrl(url) {
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

/* ── LINK ICONS ── */
const iconMap = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
const iconFB  = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`;
const iconIG  = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>`;
const iconWeb = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;

/* ── CSV PARSER ── */
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const headers = splitRow(lines[0]);
  return lines.slice(1).reduce((acc, line) => {
    if (!line.trim()) return acc;
    const vals = splitRow(line);
    const row  = {};
    headers.forEach((h, i) => { row[h.trim()] = (vals[i] || '').trim(); });
    if (row.company && row.title) acc.push(row);
    return acc;
  }, []);
}

function splitRow(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else { cur += c; }
  }
  out.push(cur);
  return out;
}

/* ── DATE HELPERS ── */
function parseDate(iso) { return iso ? new Date(iso + 'T00:00:00') : null; }

function fmtDate(iso) {
  const d = parseDate(iso);
  return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] : '';
}

function fmtRange(row) {
  if (row.date_approximate === 'Yes') {
    const d = parseDate(row.date_start);
    return d ? MONTHS[d.getMonth()] + ' 2026' : '';
  }
  const s = fmtDate(row.date_start), e = fmtDate(row.date_end);
  if (s && e && s !== e) return s + ' – ' + e;
  return s || e || '';
}

function monthsOf(row) {
  const s = parseDate(row.date_start), e = parseDate(row.date_end) || s;
  if (!s) return [];
  const out = [];
  for (let m = s.getMonth(); m <= e.getMonth(); m++) out.push(m);
  return out;
}

/* ── TODAY ── */
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

function isUpcoming(row) {
  const end = parseDate(row.date_end) || parseDate(row.date_start);
  return !end || end >= TODAY;
}

function isNowShowing(row) {
  const start = parseDate(row.date_start);
  const end   = parseDate(row.date_end) || start;
  if (!start) return false;
  return start <= TODAY && TODAY <= end;
}

/* ── STATE ── */
let allShows = [], activeCompany = '', activeMonth = '', activeUpcoming = true, searchQ = '';

/* ── RENDER CARD ── */
function card(show) {
  const type     = show.type || 'Play';
  const badgeCls = 'td-badge td-badge-' + type.toLowerCase();
  const links    = [];
  if (show.url_map)       links.push(`<a class="td-link" href="${safeUrl(show.url_map)}" target="_blank" rel="noopener noreferrer">${iconMap} Map</a>`);
  if (show.url_facebook)  links.push(`<a class="td-link" href="${safeUrl(show.url_facebook)}"  target="_blank" rel="noopener noreferrer">${iconFB} FB</a>`);
  if (show.url_instagram) links.push(`<a class="td-link" href="${safeUrl(show.url_instagram)}" target="_blank" rel="noopener noreferrer">${iconIG} IG</a>`);
  if (show.url_web)       links.push(`<a class="td-link" href="${safeUrl(show.url_web)}"       target="_blank" rel="noopener noreferrer">${iconWeb} Web</a>`);
  const people = [
    show.director  ? 'Director: '   + show.director  : '',
    show.playwright ? 'Playwright: ' + show.playwright : '',
  ].filter(Boolean).join('<br>');

  const nowShowing = isNowShowing(show);
  return `<div class="td-card">
    <div class="td-card-row1">
      <span class="td-badges">
        <span class="${badgeCls}">${type}</span>
        ${nowShowing ? '<span class="td-badge td-badge-nowshowing">● Now Showing</span>' : ''}
      </span>
      <span class="td-company">${show.company}</span>
    </div>
    <div class="td-title-text">${show.title}</div>
    <div class="td-dates">${fmtRange(show)}</div>
    <div class="td-location">📍 ${show.suburb || ''}</div>
    ${people ? `<div class="td-people">${people}</div>` : ''}
    ${links.length ? `<div class="td-links">${links.join('')}</div>` : ''}
    <button class="td-blakeai"
      data-title="${show.title.replace(/"/g,'&quot;')}"
      data-company="${show.company.replace(/"/g,'&quot;')}"
      data-playwright="${(show.playwright||'').replace(/"/g,'&quot;')}"
      data-director="${(show.director||'').replace(/"/g,'&quot;')}"
      data-suburb="${(show.suburb||'').replace(/"/g,'&quot;')}"
      data-dates="${fmtRange(show).replace(/"/g,'&quot;')}"
      data-url-web="${safeUrl(show.url_web)}"
      data-url-fb="${safeUrl(show.url_facebook)}">✦ Ask BlakeAI about this play</button>
  </div>`;
}

/* ── FILTER + RENDER ── */
function render() {
  const q     = searchQ.toLowerCase();
  const month = activeMonth !== '' ? parseInt(activeMonth) : null;

  const results = allShows.filter(s => {
    if (q) {
      const hay = [s.title, s.company, s.playwright, s.director, s.suburb].join(' ').toLowerCase();
      return hay.includes(q);
    }
    if (activeUpcoming && !isUpcoming(s)) return false;
    if (activeCompany && s.company !== activeCompany) return false;
    if (month !== null && !monthsOf(s).includes(month)) return false;
    return true;
  });

  const grid  = document.getElementById('td-grid');
  const count = document.getElementById('td-count');
  grid.innerHTML  = results.length ? results.map(card).join('') : '<div class="td-empty">No shows match — try adjusting your filters</div>';
  count.textContent = `Showing ${results.length} of ${allShows.length} productions`;
}

/* ── POPULATE DROPDOWNS ── */
function buildFilters(shows) {
  const companySel = document.getElementById('td-company');
  const monthSel   = document.getElementById('td-month');

  [...new Set(shows.map(s => s.company).filter(Boolean))].sort().forEach(co => {
    const o = document.createElement('option');
    o.value = co; o.textContent = co;
    companySel.appendChild(o);
  });

  const monthSet = new Set();
  shows.forEach(s => monthsOf(s).forEach(m => monthSet.add(m)));
  [...monthSet].sort((a, b) => a - b).forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = MONTHS[m];
    monthSel.appendChild(o);
  });

}

/* ── FETCH ── */
async function init(isRefresh = false) {
  const refreshBtn = document.getElementById('td-refresh-btn');
  const countEl    = document.getElementById('td-count');
  if (isRefresh) {
    refreshBtn.disabled = true;
    refreshBtn.textContent = '↻ Refreshing…';
  }
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    allShows = parseCSV(text).sort((a, b) => (a.date_start || '').localeCompare(b.date_start || ''));
    if (!isRefresh) buildFilters(allShows);
    render();
  } catch (e) {
    document.getElementById('td-grid').innerHTML =
      '<div class="td-empty">Unable to load show data — please try again shortly.</div>';
    countEl.textContent = '';
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = '↻ Refresh Data';
  }
}

/* ── EVENTS ── */
document.getElementById('td-search').addEventListener('input',   e  => { searchQ = e.target.value; render(); });
document.getElementById('td-company').addEventListener('change',  e  => { activeCompany = e.target.value; render(); });
document.getElementById('td-month').addEventListener('change',    e  => { activeMonth = e.target.value; render(); });
document.getElementById('td-upcoming').addEventListener('click',  () => {
  activeUpcoming = !activeUpcoming;
  document.getElementById('td-upcoming').classList.toggle('active', activeUpcoming);
  render();
});
document.getElementById('td-refresh-btn').addEventListener('click', () => init(true));

/* ── BLAKEAI ── */
const CHIPS = [
  "What is the play about?",
  "Tell me about the characters",
  "How old is each character?",
];

let baShow    = null;
let baMsgs_   = [];
let baBusy    = false;

const baOverlay      = document.getElementById('blakeai-overlay');
const baMsgEl        = document.getElementById('blakeai-messages');
const baInputEl      = document.getElementById('blakeai-input');
const baSendEl       = document.getElementById('blakeai-send');
const baTitleEl      = document.getElementById('blakeai-title');
const baCoEl         = document.getElementById('blakeai-company');
const baDirectorEl   = document.getElementById('blakeai-director');
const baPlaywrightEl = document.getElementById('blakeai-playwright');
const baDatesEl      = document.getElementById('blakeai-dates');

function openBlakeAI(dataset) {
  baShow = {
    title:      dataset.title      || '',
    company:    dataset.company    || '',
    playwright: dataset.playwright || '',
    director:   dataset.director   || '',
    suburb:     dataset.suburb     || '',
    dates:      dataset.dates      || '',
    url_web:    dataset.urlWeb     || '',
    url_fb:     dataset.urlFb      || '',
  };
  baMsgs_  = [];
  baBusy   = false;

  baTitleEl.textContent = baShow.title;
  baCoEl.textContent    = baShow.company;

  baDirectorEl.textContent    = baShow.director   ? `Directed by ${baShow.director}`   : '';
  baDirectorEl.style.display  = baShow.director   ? '' : 'none';
  baPlaywrightEl.textContent  = baShow.playwright ? `Written by ${baShow.playwright}`  : '';
  baPlaywrightEl.style.display = baShow.playwright ? '' : 'none';
  baDatesEl.textContent       = baShow.dates || '';
  baDatesEl.style.display     = baShow.dates ? '' : 'none';

  baInputEl.value       = '';
  baSendEl.disabled     = false;

  baMsgEl.innerHTML = buildWelcome();
  baOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => baInputEl.focus(), 320);
}

function closeBlakeAI() {
  baOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

function buildWelcome() {
  const chips = CHIPS.map(c => `<button class="blakeai-chip">${c}</button>`).join('');
  return `<div class="blakeai-welcome">
    <div class="blakeai-welcome-text">What would you like to know?</div>
    <div class="blakeai-chips">${chips}</div>
  </div>`;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function formatReply(text) {
  return escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g,   '<br>');
}

function addMsg(role, html) {
  const label = role === 'user' ? 'You' : 'BlakeAI';
  const el = document.createElement('div');
  el.className = 'blakeai-msg ' + role;
  el.innerHTML = `<div class="blakeai-msg-label">${label}</div><div class="blakeai-msg-bubble">${html}</div>`;
  baMsgEl.appendChild(el);
  baMsgEl.scrollTop = baMsgEl.scrollHeight;
  return el;
}

async function sendMessage(override) {
  const text = (override !== undefined ? override : baInputEl.value).trim();
  if (!text || baBusy) return;

  const welcome = baMsgEl.querySelector('.blakeai-welcome');
  if (welcome) welcome.remove();

  baInputEl.value = '';
  baBusy = true;
  baSendEl.disabled = true;

  addMsg('user', escapeHtml(text));
  baMsgs_.push({ role: 'user', content: text });

  const thinking = addMsg('ai', 'Thinking…');
  thinking.classList.add('blakeai-thinking');

  if (!WORKER_URL) {
    setTimeout(() => {
      thinking.remove();
      addMsg('ai', 'The BlakeAI backend isn\'t connected yet — coming soon!');
      baBusy = false; baSendEl.disabled = false;
    }, 600);
    return;
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ show: baShow, messages: baMsgs_ }),
    });
    const body = await res.text();
    if (!res.ok) throw new Error(body);
    const { text: reply } = JSON.parse(body);
    baMsgs_.push({ role: 'assistant', content: reply });
    thinking.remove();
    addMsg('ai', formatReply(reply));
  } catch(err) {
    thinking.remove();
    addMsg('ai', 'Error: ' + err.message);
  }

  baBusy = false;
  baSendEl.disabled = false;
  baInputEl.focus();
}

/* BlakeAI events */
document.getElementById('td-grid').addEventListener('click', e => {
  const btn = e.target.closest('.td-blakeai');
  if (btn) openBlakeAI(btn.dataset);
});
baMsgEl.addEventListener('click', e => {
  const chip = e.target.closest('.blakeai-chip');
  if (chip) sendMessage(chip.textContent);
});
document.getElementById('blakeai-close').addEventListener('click', closeBlakeAI);
baOverlay.addEventListener('click', e => { if (e.target === baOverlay) closeBlakeAI(); });
baSendEl.addEventListener('click', () => sendMessage());
baInputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && baOverlay.classList.contains('open')) closeBlakeAI();
});

/* ── JUMP TO TOP ── */
const jumpTop = document.getElementById('td-jump-top');
window.addEventListener('scroll', () => {
  jumpTop.classList.toggle('visible', window.scrollY > 300);
}, { passive: true });
jumpTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

init();
</script>
</body>
</html>
