<style>
:root {
  --lime:   #D4FF1A;
  --purple: #9933FF;
  --black:  #0a0a0a;
  --offwhite: #f5f5f0;
  --bg:         var(--offwhite);
  --fg:         var(--black);
  --card-bg:    #ffffff;
  --card-border:rgba(0,0,0,0.1);
  --muted:      rgba(0,0,0,0.45);
  --input-bg:   #ffffff;
  --input-border:rgba(0,0,0,0.15);
}
[data-theme="dark"] {
  --bg:         var(--black);
  --fg:         #f5f5f0;
  --card-bg:    #141414;
  --card-border:rgba(255,255,255,0.09);
  --muted:      rgba(240,240,235,0.4);
  --input-bg:   #1a1a1a;
  --input-border:rgba(255,255,255,0.14);
}
[data-theme="terminal"] {
  --bg:         #0a0a0a;
  --fg:         #ffffff;
  --card-bg:    #111111;
  --card-border:rgba(255,255,255,0.07);
  --muted:      rgba(255,255,255,0.35);
  --input-bg:   #111111;
  --input-border:rgba(255,255,255,0.12);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  transition: background 0.2s, color 0.2s;
}

/* ── HEADER ── */
.td-header {
  background: var(--black);
  padding: 28px 48px 24px;
}
.td-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.td-back {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  transition: color 0.2s;
  padding-top: 6px;
}
.td-back:hover { color: var(--lime); }

.td-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.td-sheet-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  border: 1px solid rgba(212,255,26,0.25);
  padding: 0 13px;
  height: 34px;
  display: inline-flex; align-items: center;
  border-radius: 2px;
  transition: all 0.2s;
  white-space: nowrap;
}
.td-sheet-btn:hover { color: var(--lime); border-color: var(--lime); }

.td-header-btns {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.td-header-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  border: 1px solid rgba(212,255,26,0.25);
  padding: 7px 14px;
  border-radius: 2px;
  transition: all 0.2s;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  flex: 1;
}
.td-header-btn:hover { color: var(--lime); border-color: var(--lime); }

.td-theme-btn,
.td-font-btn {
  background: none;
  border: 1px solid rgba(212,255,26,0.25);
  color: rgba(212,255,26,0.7);
  width: 44px; height: 44px;
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.td-theme-btn { font-size: 16px; }
.td-font-btn  { font-size: 13px; font-family: 'DM Mono', monospace; letter-spacing: -0.5px; }
.td-theme-btn:hover,
.td-font-btn:hover   { border-color: var(--lime); color: var(--lime); }
.td-font-btn.active  { background: rgba(212,255,26,0.15); border-color: var(--lime); color: var(--lime); }
.td-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 9vw, 104px);
  letter-spacing: 6px;
  line-height: 1;
  color: var(--lime);
}
.td-subtitle {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(212,255,26,0.5);
  margin-top: 6px;
}

/* ── SCREEN-READER ONLY UTILITY ── */
.td-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── CONTROLS ── */
.td-controls {
  padding: 18px 48px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}
.td-search {
  width: 100%;
  padding: 10px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  border: 1px solid var(--input-border);
  border-radius: 3px;
  background: var(--input-bg);
  color: var(--fg);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.td-search:focus { border-color: var(--purple); }
.td-search::placeholder { color: var(--muted); }

.td-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.td-upcoming-toggle {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 0 12px;
  height: 24px;
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.td-upcoming-toggle.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.td-upcoming-toggle:hover:not(.active) { border-color: var(--purple); color: var(--purple); }
[data-theme="terminal"] .td-upcoming-toggle.active { background: var(--lime); border-color: var(--lime); color: var(--black); }
[data-theme="terminal"] .td-upcoming-toggle:hover:not(.active) { border-color: var(--lime); color: var(--lime); }
.td-star-svg { width: 15px; height: 15px; flex-shrink: 0; display: block; pointer-events: none; }

.td-select {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 10px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: var(--input-bg);
  color: var(--fg);
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.td-select:focus { border-color: var(--purple); }

.td-controls-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  flex-wrap: wrap;
  gap: 6px;
}
.td-count {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
}

/* ── MAIN ── */
.td-main { padding: 28px 48px 72px; }

.td-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

/* ── CARD ── */
.td-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 4px;
  padding: 18px 18px 14px;
  display: flex; flex-direction: column; gap: 7px;
  transition: border-color 0.18s, transform 0.15s, box-shadow 0.15s;
}
.td-card:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(153,51,255,0.1);
}
.td-card-row1 {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.td-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
@keyframes td-now-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}
@media (prefers-reduced-motion: reduce) {
  .td-badge-nowshowing { animation: none; }
}
.td-badge-nowshowing {
  background: rgba(220,38,38,0.1); color: #dc2626;
  animation: td-now-pulse 1.4s ease-in-out infinite;
}
[data-theme="dark"]     .td-badge-nowshowing { background: rgba(255,80,80,0.1);  color: #ff6b6b; }
[data-theme="terminal"] .td-badge-nowshowing { background: rgba(212,255,26,0.08); color: var(--lime); }
.td-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px; flex-shrink: 0;
}
.td-badge-play     { background: rgba(153,51,255,0.1);  color: var(--purple); }
.td-badge-musical  { background: rgba(212,255,26,0.18); color: #5c7a00; }
.td-badge-pantomime{ background: rgba(255,140,0,0.13);  color: #b86000; }
[data-theme="dark"] .td-badge-musical   { color: #c4ef00; background: rgba(212,255,26,0.12); }
[data-theme="dark"] .td-badge-pantomime { color: #ffaa44; background: rgba(255,170,68,0.12); }
[data-theme="terminal"] .td-badge-play     { color: #fff; background: rgba(255,255,255,0.08); }
[data-theme="terminal"] .td-badge-musical  { color: var(--lime); background: rgba(212,255,26,0.08); }
[data-theme="terminal"] .td-badge-pantomime{ color: #ffaa44; background: rgba(255,170,68,0.08); }

.td-card-row1-right {
  display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden;
}
.td-company {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(0,0,0,0.55);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="dark"]     .td-company { color: rgba(255,255,255,0.55); }
[data-theme="terminal"] .td-company { color: rgba(255,255,255,0.45); }
.td-star-btn {
  background: none; border: none; cursor: pointer; padding: 0;
  display: flex; align-items: center;
  color: rgba(0,0,0,0.15); transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.td-star-btn.active { color: var(--purple); }
@media (hover: hover) { .td-star-btn:hover { color: var(--purple); } }
[data-theme="dark"]     .td-star-btn { color: rgba(255,255,255,0.15); }
[data-theme="dark"]     .td-star-btn.active,
[data-theme="terminal"] .td-star-btn.active { color: var(--lime); }
@media (hover: hover) {
  [data-theme="dark"]     .td-star-btn:hover,
  [data-theme="terminal"] .td-star-btn:hover { color: var(--lime); }
}
.td-progress-bar {
  height: 3px; background: rgba(0,0,0,0.07);
  border-radius: 2px; margin-top: 5px; overflow: hidden;
}
[data-theme="dark"] .td-progress-bar { background: rgba(255,255,255,0.08); }
.td-progress-fill {
  height: 100%; background: var(--purple); border-radius: 2px;
}
[data-theme="terminal"] .td-progress-fill { background: var(--lime); }
.td-title-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px; letter-spacing: 2px;
  color: var(--purple);
  line-height: 1.1;
}
[data-theme="dark"]     .td-title-text { color: var(--lime); }
[data-theme="terminal"] .td-title-text { color: #ffffff; }

.td-dates {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 0.5px;
  color: var(--fg);
}
.td-location {
  font-size: 12px; color: var(--muted);
}
.td-people {
  font-size: 11px; color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--card-border);
  padding-top: 7px; margin-top: 2px;
}
.td-links {
  display: flex; gap: 5px;
}
.td-link {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 6px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  text-decoration: none;
  color: var(--muted);
  transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  flex: 1; min-width: 0;
}
.td-link:hover { border-color: var(--purple); color: var(--purple); }
[data-theme="terminal"] .td-link:hover { border-color: var(--lime); color: var(--lime); }
.td-link svg { flex-shrink: 0; }
button.td-link { background: none; cursor: pointer; }

.td-blakeai {
  width: 100%;
  padding: 7px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  background: none;
  border: 1px solid rgba(153,51,255,0.35);
  border-radius: 2px;
  color: var(--purple);
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.15s, color 0.15s;
}
.td-blakeai:hover { background: var(--purple); color: #fff; }
[data-theme="dark"]     .td-blakeai { border-color: rgba(212,255,26,0.3); color: var(--lime); }
[data-theme="dark"]     .td-blakeai:hover { background: rgba(212,255,26,0.12); color: var(--lime); }
[data-theme="terminal"] .td-blakeai { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.55); }
[data-theme="terminal"] .td-blakeai:hover { background: rgba(255,255,255,0.07); color: #fff; }

/* ── BLAKEAI MODAL ── */
.blakeai-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
  padding-bottom: env(safe-area-inset-bottom);
}
.blakeai-overlay.open { opacity: 1; pointer-events: auto; }
.blakeai-modal {
  background: #111111;
  width: 100%; max-width: 680px;
  max-height: 96vh; max-height: 96dvh;
  border-radius: 8px 8px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
  position: relative;
}
.blakeai-overlay.open .blakeai-modal { transform: translateY(0); }
.blakeai-modal-hd {
  background: #0a0a0a;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 15px 64px 15px 18px;
  flex-shrink: 0;
}
.blakeai-modal-info { flex: 1; min-width: 0; }
.blakeai-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--lime); opacity: 0.65; margin-bottom: 4px;
}
.blakeai-modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 2px; color: #fff; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.blakeai-modal-company {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.5); margin-top: 5px;
}
.blakeai-modal-meta {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1px;
  color: rgba(255,255,255,0.45); margin-top: 5px;
}
.blakeai-modal-dates {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  color: rgba(255,255,255,0.28); margin-top: 3px;
}
.blakeai-close {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 10;
  background: rgba(20,20,20,0.85); border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.8); width: 40px; height: 40px;
  border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.15s;
}
.blakeai-close:hover { background: rgba(60,60,60,0.95); border-color: rgba(255,255,255,0.55); color: #fff; }
.blakeai-messages {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.blakeai-welcome { display: flex; flex-direction: column; gap: 14px; }
.blakeai-welcome-text {
  font-family: 'DM Mono', monospace;
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}
.blakeai-chips { display: flex; flex-wrap: wrap; gap: 9px; }
.blakeai-chip {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px;
  padding: 9px 16px; border: 1px solid rgba(212,255,26,0.3);
  border-radius: 20px; background: none; color: rgba(212,255,26,0.65);
  cursor: pointer; transition: all 0.15s; text-align: left;
}
.blakeai-chip:hover { background: rgba(212,255,26,0.1); border-color: var(--lime); color: var(--lime); }
.blakeai-msg { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
.blakeai-msg.user { align-self: flex-end; align-items: flex-end; }
.blakeai-msg.ai   { align-self: flex-start; align-items: flex-start; }
.blakeai-msg-label {
  font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
}
.blakeai-msg.user .blakeai-msg-label { color: rgba(153,51,255,0.55); }
.blakeai-msg.ai   .blakeai-msg-label { color: rgba(212,255,26,0.45); }
.blakeai-msg-bubble {
  padding: 10px 14px; border-radius: 4px;
  font-size: 13px; line-height: 1.6;
}
.blakeai-msg.user .blakeai-msg-bubble { background: var(--purple); color: #fff; }
.blakeai-msg.ai   .blakeai-msg-bubble { background: #1c1c1c; color: #f0f0eb; }
.blakeai-msg.ai   .blakeai-msg-bubble a { color: var(--lime); text-decoration: underline; }
.blakeai-msg.ai   .blakeai-msg-bubble a:hover { opacity: 0.8; }
.blakeai-thinking .blakeai-msg-bubble { color: rgba(255,255,255,0.35); font-style: italic; }
.blakeai-input-row {
  padding: 12px 18px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; gap: 8px; flex-shrink: 0;
}
.blakeai-input {
  flex: 1; padding: 10px 13px;
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 3px; font-family: 'Inter', sans-serif;
  font-size: 16px; color: #f0f0eb; outline: none; transition: border-color 0.2s;
}
.blakeai-input:focus { border-color: var(--purple); }
.blakeai-input::placeholder { color: rgba(255,255,255,0.22); }
.blakeai-send {
  background: var(--purple); border: none; border-radius: 3px;
  width: 42px; height: 42px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.15s;
}
.blakeai-send:hover { opacity: 0.85; }
.blakeai-send:disabled { opacity: 0.3; cursor: default; }

/* ── STATES ── */
.td-empty, .td-loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
}

/* ── JUMP TO TOP ── */
.td-jump-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--purple);
  color: var(--lime);
  border: none;
  padding: 9px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0; pointer-events: none;

/* ── CSV PARSER ── */
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const headers = splitRow(lines[0]);
  return lines.slice(1).reduce((acc, line) => {
    if (!line.trim()) return acc;
    const vals = splitRow(line);
    const row  = {};
    headers.forEach((h, i) => { row[h.trim()] = (vals[i] || '').trim(); });
    if (row.company && row.title) acc.push(row);
    return acc;
  }, []);
}

function splitRow(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else { cur += c; }
  }
  out.push(cur);
  return out;
}

/* ── DATE HELPERS ── */
function parseDate(iso) { return iso ? new Date(iso + 'T00:00:00') : null; }

function fmtDate(iso) {
  const d = parseDate(iso);
  return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] : '';
}

function fmtRange(row) {
  if (row.date_approximate === 'Yes') {
    const d = parseDate(row.date_start);
    return d ? MONTHS[d.getMonth()] + ' 2026' : '';
  }
  const s = fmtDate(row.date_start), e = fmtDate(row.date_end);
  if (s && e && s !== e) return s + ' – ' + e;
  return s || e || '';
}

function monthsOf(row) {
  const s = parseDate(row.date_start), e = parseDate(row.date_end) || s;
  if (!s) return [];
  const out = [];
  for (let m = s.getMonth(); m <= e.getMonth(); m++) out.push(m);
  return out;
}

/* ── TODAY ── */
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

function isUpcoming(row) {
  const end = parseDate(row.date_end) || parseDate(row.date_start);
  return !end || end >= TODAY;
}

function isNowShowing(row) {
  const start = parseDate(row.date_start);
  const end   = parseDate(row.date_end) || start;
  if (!start) return false;
  return start <= TODAY && TODAY <= end;
}

  if (show.url_web)       links.push(`<a class="td-link" href="${safeUrl(show.url_web)}"       target="_blank" rel="noopener noreferrer" aria-label="Website (opens in new tab)">${iconWeb} Web</a>`);

  const people = [
    show.director   ? 'Director: '   + show.director   : '',
    show.playwright ? 'Playwright: ' + show.playwright  : '',
  ].filter(Boolean).join('<br>');

  let progressBar = '';

    <button class="td-blakeai"
      data-title="${show.title.replace(/"/g,'&quot;')}"

}

/* ── FILTER + RENDER ── */
function render() {
  const q     = searchQ.toLowerCase();
  const month = activeMonth !== '' ? parseInt(activeMonth) : null;

  const results = allShows.filter(s => {
    if (q) {
      const hay = [s.title, s.company, s.playwright, s.director, s.suburb].join(' ').toLowerCase();
      return hay.includes(q);
    }
    if (activeFilter === 'watchlist'  && !watchlist.has(showKey(s))) return false;
    if (activeFilter === 'nowshowing' && !isNowShowing(s))           return false;
    if (activeFilter === 'upcoming'   && !isUpcoming(s))             return false;
    if (activeCompany   && s.company !== activeCompany) return false;
    if (month !== null  && !monthsOf(s).includes(month)) return false;
    return true;
  });

  const grid  = document.getElementById('td-grid');
  const count = document.getElementById('td-count');
  grid.innerHTML    = results.length ? results.map(card).join('') : '<div class="td-empty">No shows match — try adjusting your filters</div>';
  count.textContent = `Showing ${results.length} of ${allShows.length} productions`;
  pushUrlState();

  grid.querySelectorAll('.td-star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key   = btn.dataset.key;
      const isNow = watchlist.has(key);
      if (isNow) {
        watchlist.delete(key);
        btn.classList.remove('active');
        btn.title = 'Save to watchlist';
        btn.setAttribute('aria-label', 'Save to watchlist');
      } else {
        watchlist.add(key);
        btn.classList.add('active');
        btn.title = 'Remove from watchlist';
        btn.setAttribute('aria-label', 'Remove from watchlist');
      }
      saveWatchlist();
      if (activeFilter === 'watchlist') render();
    });
  });
}

/* ── POPULATE DROPDOWNS ── */
function buildFilters(shows) {
  const companySel = document.getElementById('td-company');
  const monthSel   = document.getElementById('td-month');

  [...new Set(shows.map(s => s.company).filter(Boolean))].sort().forEach(co => {
    const o = document.createElement('option');
    o.value = co; o.textContent = co;
    companySel.appendChild(o);
  });

  const monthSet = new Set();
  shows.forEach(s => monthsOf(s).forEach(m => monthSet.add(m)));
  [...monthSet].sort((a, b) => a - b).forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = MONTHS[m];
    monthSel.appendChild(o);
  });

}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function formatReply(text) {
  return escapeHtml(text)
    // ## Headings → bold (strip the # symbols)
    .replace(/^#{1,6}\s+(.+)/gm, '<strong>$1</strong>')
    // [link text](https://url) → clickable anchor
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    // **bold**
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g,   '<br>');
}

function addMsg(role, html) {
  const label = role === 'user' ? 'You' : 'BlakeAI';
  const el = document.createElement('div');
  el.className = 'blakeai-msg ' + role;
  el.innerHTML = `<div class="blakeai-msg-label">${label}</div><div class="blakeai-msg-bubble">${html}</div>`;
  baMsgEl.appendChild(el);
  baMsgEl.scrollTop = baMsgEl.scrollHeight;
  return el;
}

async function sendMessage(override) {
  const text = (override !== undefined ? override : baInputEl.value).trim();
  if (!text || baBusy) return;

  const welcome = baMsgEl.querySelector('.blakeai-welcome');
  if (welcome) welcome.remove();

  baInputEl.value = '';
  baBusy = true;
  baSendEl.disabled = true;

  addMsg('user', escapeHtml(text));
  baMsgs_.push({ role: 'user', content: text });

  const thinking = addMsg('ai', 'Thinking…');
  thinking.classList.add('blakeai-thinking');

  if (!WORKER_URL) {
    setTimeout(() => {
      thinking.remove();
      addMsg('ai', 'The BlakeAI backend isn\'t connected yet — coming soon!');
      baBusy = false; baSendEl.disabled = false;
    }, 600);
    return;
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ show: baShow, messages: baMsgs_ }),
    });
    const body = await res.text();
    if (!res.ok) throw new Error(body);
    const { text: reply } = JSON.parse(body);
    baMsgs_.push({ role: 'assistant', content: reply });
    thinking.remove();
    addMsg('ai', formatReply(reply));
  } catch(err) {
    thinking.remove();
    addMsg('ai', 'Error: ' + err.message);
  }

  baBusy = false;
  baSendEl.disabled = false;
  baInputEl.focus();
}

  document.body.appendChild(overlay);

  const canvas     = document.getElementById('bi-canvas');
  const ctx        = canvas.getContext('2d');
  const scoreEl    = document.getElementById('bi-score');
  const livesEl    = document.getElementById('bi-lives');
  const waveEl     = document.getElementById('bi-wave');
  const mobEl      = document.getElementById('bi-mob');
  const hintEl     = document.getElementById('bi-hint');
  const gameOverEl = document.getElementById('bi-gameover');
  const goScoreEl  = document.getElementById('bi-go-score');
  const goInputRow = document.getElementById('bi-go-input-row');
  const nameInput  = document.getElementById('bi-name-input');
  const submitBtn  = document.getElementById('bi-lb-submit');
  const restartBtn = document.getElementById('bi-restart');
  const lbRowsEl   = document.getElementById('bi-lb-rows');

  /* ── Canvas sizing ── */
  let W = 0, H = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = Math.round(rect.width);
    H = Math.round(rect.height);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ── Leaderboard (Firebase) ── */
  const INVADERS_COL = 'invaders_scores';

  async function renderLeaderboard(highlightName) {
    if (!db) { lbRowsEl.innerHTML = ''; return; }
    lbRowsEl.innerHTML = '<div class="bi-lb-row" style="color:#333;justify-content:center;font-size:10px;">Loading...</div>';
    try {

      const rows = snap.docs.map(d => d.data());
      lbRowsEl.innerHTML = rows.length === 0
        ? '<div class="bi-lb-row" style="color:#333;justify-content:center;font-size:10px;">No scores yet — be first!</div>'
        : rows.map((s, i) => {
            const hl = highlightName && s.name === highlightName;
            return `<div class="bi-lb-row" style="${hl ? 'color:var(--lime)' : ''}"><span>#${i+1} · ${s.name}</span><span>${s.score}</span></div>`;
          }).join('');
    } catch { lbRowsEl.innerHTML = ''; }
  }

  async function saveAndRefresh(rawName, sc) {
    if (!db) return;
    const name = rawName.trim().replace(/[^A-Z0-9 _\-]/gi, '').slice(0, 8).toUpperCase() || 'ANON';
    try {
      await db.collection(INVADERS_COL).add({
        name, score: sc,
        ts: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await renderLeaderboard(name);
    } catch { await renderLeaderboard(); }
  }

  /* ── Word pool from loaded shows ── */
  const STOP = new Set('the,and,a,an,of,in,to,for,is,it,at,on,by,as,or,not,but,be,with,that,this,from,are,was,were,will,have,has,had,i,you,we,they,he,she,my,your,our,its,do,did,can,could,would,should,may,might,all,any,more,most,one,two,three,four,five,six,seven,eight,nine,ten,some'.split(','));
  const FALLBACK = ['Theatre','Drama','Stage','Comedy','Actor','Script','Curtain','Musical','Tragedy','Hamlet','Encore','Chorus','Cabaret'];

  function getWords(n) {
    const seen = new Set(), pool = [];
    for (const s of allShows) {
      for (const w of (s.title || '').split(/\s+/)) {
        const c = w.replace(/[^a-zA-Z]/g, '');
        const l = c.toLowerCase();
        if (c.length >= 4 && c.length <= 9 && !STOP.has(l) && !seen.has(l)) {
          pool.push(c); seen.add(l);
        }
      }
    }
    if (pool.length < 4) pool.push(...FALLBACK);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const out = [];
    for (let i = 0; i < n; i++) out.push(pool[i % pool.length]);
    return out;
  }

  /* ── Game state ── */
  const ROWS = 4, SHIP_H = 18, SHIP_W = 26;
  let COLS, INV_W, INV_H;
  let invaders, bullets, eBullets, player;
  let score, lives, wave, gameOver, gameOverShown;
  let groupX, groupY, groupDir, stepTimer, stepInterval, shotCd;
  let keys = {}, rafId;

  function initWave() {
    resize();
    COLS  = W > 400 ? 8 : 5;
    INV_W = Math.floor((W - 30) / COLS);
    INV_H = H > 250 ? 30 : 22;
    const words = getWords(COLS * ROWS);
    invaders = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        invaders.push({ word: words[r * COLS + c], col: c, row: r, alive: true });
    groupX = 15; groupY = Math.round(H * 0.14); groupDir = 1;
    stepTimer = 0; stepInterval = Math.max(12, 48 - (wave - 1) * 8);
    waveEl.textContent = wave;
  }

  function newGame() {
    score = 0; lives = 4; wave = 1;
    gameOver = false; gameOverShown = false; shotCd = 0;
    scoreEl.textContent = '0';
    livesEl.textContent = '♥♥♥♥';
    gameOverEl.classList.remove('active');
    bullets = []; eBullets = [];
    initWave();
    player = { x: W / 2 };
  }

  /* ── Update ── */
  function update() {
    if (gameOver) return;

    if (keys['ArrowLeft']  || keys['a'] || keys['ml']) player.x = Math.max(SHIP_W / 2,     player.x - 5);
    if (keys['ArrowRight'] || keys['d'] || keys['mr']) player.x = Math.min(W - SHIP_W / 2, player.x + 5);

    if (shotCd > 0) shotCd--;
    if ((keys[' '] || keys['ArrowUp'] || keys['w'] || keys['mf']) && shotCd === 0) {
      bullets.push({ x: player.x, y: H - SHIP_H - 34 });
      shotCd = 16;
    }

    bullets  = bullets.filter(b => b.y > -10);
    eBullets = eBullets.filter(b => b.y < H + 10);
    for (const b of bullets)  b.y -= 8;
    for (const b of eBullets) b.y += 5 + wave * 0.4;

    const alive = invaders.filter(i => i.alive);
    if (!alive.length) { wave++; initWave(); player.x = W / 2; return; }

    if (++stepTimer >= stepInterval) {
      stepTimer = 0;
      const minC = Math.min(...alive.map(i => i.col));
      const maxC = Math.max(...alive.map(i => i.col));
      if      (groupDir ===  1 && groupX + (maxC + 1) * INV_W >= W - 8) { groupDir = -1; groupY += INV_H * 0.55; }
      else if (groupDir === -1 && groupX +  minC      * INV_W <= 8)      { groupDir =  1; groupY += INV_H * 0.55; }
      else groupX += groupDir * Math.ceil(INV_W * 0.22);
      stepInterval = Math.max(6, Math.floor(48 * alive.length / (COLS * ROWS)) - (wave - 1) * 6);
    }

    if (Math.random() < 0.018 + wave * 0.004) {
      const front = {};
      for (const i of alive) { if (!front[i.col] || i.row > front[i.col].row) front[i.col] = i; }
      const shooters = Object.values(front);
      const sh = shooters[Math.floor(Math.random() * shooters.length)];
      eBullets.push({ x: groupX + sh.col * INV_W + INV_W / 2, y: groupY + sh.row * INV_H + INV_H });
    }

    const hitSet = new Set();
    for (let bi = 0; bi < bullets.length; bi++) {
      const b = bullets[bi];
      for (const inv of invaders) {
        if (!inv.alive) continue;
        const ix = groupX + inv.col * INV_W, iy = groupY + inv.row * INV_H;
        if (b.x >= ix && b.x <= ix + INV_W && b.y >= iy && b.y <= iy + INV_H) {
          inv.alive = false; hitSet.add(bi);
          score += (ROWS - inv.row + 1) * 10 * wave;
          scoreEl.textContent = score;
        }
      }
    }
    bullets = bullets.filter((_, i) => !hitSet.has(i));

    const py = H - SHIP_H - 30;
    for (const b of eBullets) {
      if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - py) < 20) {
        b.y = H + 999; lives--;
        livesEl.textContent = '♥'.repeat(Math.max(0, lives));
        if (lives <= 0) { gameOver = true; return; }
      }
    }

    if (groupY + (Math.max(...alive.map(i => i.row)) + 1) * INV_H >= H - SHIP_H - 40) {
      gameOver = true;
    }
  }

  /* ── Draw ── */
  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    if (gameOver) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = LIME;
      ctx.font = 'bold 26px "DM Mono",monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2);
      return;
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const inv of invaders) {
      if (!inv.alive) continue;
      const x = groupX + inv.col * INV_W + 3, y = groupY + inv.row * INV_H + 3;
      const iw = INV_W - 6, ih = INV_H - 6;
      ctx.strokeStyle = PURPLE_DIM; ctx.lineWidth = 1;
      ctx.strokeRect(x, y, iw, ih);
      ctx.fillStyle = 'rgba(153,51,255,0.08)';
      ctx.fillRect(x, y, iw, ih);
      const fs = Math.max(8, Math.min(11, (iw * 1.55) / inv.word.length));
      ctx.fillStyle = '#cccccc';
      ctx.font = `${fs}px "DM Mono",monospace`;
      ctx.fillText(inv.word, x + iw / 2, y + ih / 2);
    }

    ctx.fillStyle = LIME;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 10, 4, 14);

    ctx.fillStyle = RED;
    for (const b of eBullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill();
    }

    const px = player.x, sy = H - SHIP_H - 30;
    ctx.fillStyle = LIME;
    ctx.beginPath();
    ctx.moveTo(px, sy);
    ctx.lineTo(px - SHIP_W / 2, sy + SHIP_H);
    ctx.lineTo(px + SHIP_W / 2, sy + SHIP_H);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(px - 2, sy - 7, 4, 9);

    ctx.strokeStyle = 'rgba(212,255,26,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H - 26); ctx.lineTo(W, H - 26); ctx.stroke();
  }

  /* ── Game loop ── */
  function loop() {
    update();
    draw();
    if (gameOver && !gameOverShown) {
      gameOverShown = true;
      const secretLine = score > 4444
        ? `<span style="font-size:9px;letter-spacing:2px;color:rgba(212,255,26,0.55);display:block;margin-bottom:4px;">108% complete — are you actually for real happy now?</span>`
        : '';
      goScoreEl.innerHTML = secretLine + 'Score: ' + score;
      goInputRow.style.display = '';
      submitBtn.disabled = false;
      nameInput.value = '';
      gameOverEl.classList.add('active');
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ── Open / Close ── */
  function openGame() {
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    const isMobile = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    mobEl.style.display  = isMobile ? 'flex' : 'none';
    hintEl.style.display = isMobile ? 'none' : '';
    cancelAnimationFrame(rafId);
    renderLeaderboard();
    requestAnimationFrame(() => { newGame(); loop(); });
  }
  function closeGame() {
    cancelAnimationFrame(rafId); rafId = null;
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    keys = {};
  }

  /* ── Keyboard ── */
  window.addEventListener('keydown', e => {
    if (!overlay.classList.contains('active')) return;
    keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
    if (e.key === 'Escape') { closeGame(); return; }
    if (gameOver && (e.key === ' ' || e.key === 'Enter')) { gameOver = false; newGame(); }
  });
  window.addEventListener('keyup', e => { if (e.key) keys[e.key] = false; });

  document.getElementById('bi-close').addEventListener('click', closeGame);

  /* ── Score submission ── */
  submitBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim() || 'ANON';
    submitBtn.disabled = true;
    submitBtn.textContent = '...';
    goInputRow.style.display = 'none';
    await saveAndRefresh(name, score);
    submitBtn.textContent = 'Submit';
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });

  /* ── Restart ── */
  restartBtn.addEventListener('click', () => { gameOver = false; newGame(); });

  /* ── Mobile buttons ── */
  [['bi-ml','ml'], ['bi-mr','mr'], ['bi-mf','mf']].forEach(([id, key]) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart',  e => { e.preventDefault(); keys[key] = true;  }, { passive: false });
    el.addEventListener('touchend',    e => { e.preventDefault(); keys[key] = false; }, { passive: false });
    el.addEventListener('touchcancel', ()  => { keys[key] = false; });
  });

  /* ── Canvas touch: drag = move, tap = fire / restart ── */
  let tcStartX = 0, tcStartT = 0;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    tcStartX = e.touches[0].clientX;
    tcStartT = Date.now();
    keys['ml'] = false; keys['mr'] = false;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const dx = e.touches[0].clientX - tcStartX;
    keys['ml'] = dx < -18;
    keys['mr'] = dx >  18;
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    keys['ml'] = false; keys['mr'] = false;
    const movedFar = Math.abs((e.changedTouches[0]?.clientX ?? tcStartX) - tcStartX) > 18;
    if (!movedFar && Date.now() - tcStartT < 280) {
      if (gameOver) { gameOver = false; newGame(); }
      else { keys['mf'] = true; setTimeout(() => { keys['mf'] = false; }, 60); }
    }
  }, { passive: false });

})();

init();
</script>
</body>
</html>
