<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theatredex 2026 | Blake Stringer</title>
<meta name="description" content="Browse and filter Victorian community theatre productions for 2026. Search by location, month, and type.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.blakestringer.com/tools/2026-theatredex">
<link rel="icon" type="image/png" href="/Images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --lime:   #D4FF1A;
  --purple: #9933FF;
  --black:  #0a0a0a;
  --offwhite: #f5f5f0;
  --bg:         var(--offwhite);
  --fg:         var(--black);
  --card-bg:    #ffffff;
  --card-border:rgba(0,0,0,0.1);
  --muted:      rgba(0,0,0,0.45);
  --input-bg:   #ffffff;
  --input-border:rgba(0,0,0,0.15);
  --header-bg:  var(--black);
}
[data-theme="dark"] {
  --bg:         var(--black);
  --fg:         #f5f5f0;
  --card-bg:    #141414;
  --card-border:rgba(255,255,255,0.09);
  --muted:      rgba(240,240,235,0.4);
  --input-bg:   #1a1a1a;
  --input-border:rgba(255,255,255,0.14);
}
[data-theme="terminal"] {
  --bg:         #0a0a0a;
  --fg:         #ffffff;
  --card-bg:    #111111;
  --card-border:rgba(255,255,255,0.07);
  --muted:      rgba(255,255,255,0.35);
  --input-bg:   #111111;
  --input-border:rgba(255,255,255,0.12);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  transition: background 0.2s, color 0.2s;
}

/* ── HEADER ── */
.td-header {
  background: var(--black);
  padding: 28px 48px 24px;
  position: relative;
}
.td-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.td-back {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(212,255,26,0.55);
  text-decoration: none;
  transition: color 0.2s;
  padding-top: 4px;
}
.td-back:hover { color: var(--lime); }
.td-theme-btn {
  background: none;
  border: 1px solid rgba(212,255,26,0.25);
  color: rgba(212,255,26,0.55);
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  width: 34px; height: 34px;
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.td-theme-btn:hover { border-color: var(--lime); color: var(--lime); }
.td-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 9vw, 104px);
  letter-spacing: 6px;
  line-height: 1;
  color: var(--lime);
}
.td-subtitle {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(212,255,26,0.5);
  margin-top: 6px;
}

/* ── CONTROLS ── */
.td-controls {
  padding: 18px 48px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}
.td-search {
  width: 100%;
  padding: 10px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  border: 1px solid var(--input-border);
  border-radius: 3px;
  background: var(--input-bg);
  color: var(--fg);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.td-search:focus { border-color: var(--purple); }
.td-search::placeholder { color: var(--muted); }

.td-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.td-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.td-chip {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 5px 11px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.td-chip:hover { border-color: var(--purple); color: var(--purple); }
.td-chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

.td-select {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 10px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  background: var(--input-bg);
  color: var(--fg);
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.td-select:focus { border-color: var(--purple); }

.td-count {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
}

/* ── MAIN ── */
.td-main { padding: 28px 48px 72px; }

.td-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

/* ── CARD ── */
.td-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 4px;
  padding: 18px 18px 14px;
  display: flex; flex-direction: column; gap: 7px;
  transition: border-color 0.18s, transform 0.15s, box-shadow 0.15s;
}
.td-card:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(153,51,255,0.1);
}
.td-card-row1 {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.td-badge {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px; flex-shrink: 0;
}
.td-badge-play     { background: rgba(153,51,255,0.1);  color: var(--purple); }
.td-badge-musical  { background: rgba(212,255,26,0.18); color: #5c7a00; }
.td-badge-pantomime{ background: rgba(255,140,0,0.13);  color: #b86000; }
[data-theme="dark"] .td-badge-musical   { color: #c4ef00; background: rgba(212,255,26,0.12); }
[data-theme="dark"] .td-badge-pantomime { color: #ffaa44; background: rgba(255,170,68,0.12); }
[data-theme="terminal"] .td-badge-play     { color: #fff; background: rgba(255,255,255,0.08); }
[data-theme="terminal"] .td-badge-musical  { color: var(--lime); background: rgba(212,255,26,0.08); }
[data-theme="terminal"] .td-badge-pantomime{ color: #ffaa44; background: rgba(255,170,68,0.08); }

.td-company {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.td-title-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px; letter-spacing: 2px;
  color: var(--purple);
  line-height: 1.1;
}
[data-theme="dark"]     .td-title-text { color: var(--lime); }
[data-theme="terminal"] .td-title-text { color: #ffffff; }

.td-dates {
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 0.5px;
  color: var(--fg);
}
.td-location {
  font-size: 12px; color: var(--muted);
}
.td-people {
  font-size: 11px; color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--card-border);
  padding-top: 7px; margin-top: 2px;
}
.td-links {
  display: flex; gap: 5px; flex-wrap: wrap;
}
.td-link {
  font-family: 'DM Mono', monospace;
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  text-decoration: none;
  color: var(--muted);
  transition: all 0.15s;
}
.td-link:hover { border-color: var(--purple); color: var(--purple); }
[data-theme="terminal"] .td-link:hover { border-color: var(--lime); color: var(--lime); }

.td-blakeai {
  margin-top: auto;
  padding-top: 7px;
  width: 100%;
  padding: 7px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  background: none;
  border: 1px solid var(--input-border);
  border-radius: 2px;
  color: var(--muted);
  cursor: not-allowed;
  opacity: 0.38;
  margin-top: 6px;
}

/* ── STATES ── */
.td-empty, .td-loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
}

/* ── FOOTER ── */
.td-footer {
  padding: 20px 48px;
  border-top: 1px solid var(--card-border);
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}
.td-footer a {
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
}
.td-footer a:hover { color: var(--purple); }

/* ── MOBILE ── */
@media (max-width: 639px) {
  .td-header   { padding: 20px 20px 18px; }
  .td-controls { padding: 14px 20px 12px; position: relative; }
  .td-main     { padding: 20px 20px 56px; }
  .td-grid     { grid-template-columns: 1fr; }
  .td-footer   { padding: 20px; flex-direction: column; text-align: center; }
  .td-title    { font-size: clamp(48px, 14vw, 80px); }
}
</style>
</head>
<body>

<header class="td-header">
  <div class="td-header-top">
    <a class="td-back" href="/">← blakestringer.com</a>
    <button class="td-theme-btn" id="td-theme-btn" title="Toggle theme">◐</button>
  </div>
  <h1 class="td-title">Theatredex 2026</h1>
  <p class="td-subtitle">Victorian Community Theatre — 2026 Season</p>
</header>

<div class="td-controls">
  <input type="search" class="td-search" id="td-search" placeholder="Search title, company, playwright, director…">
  <div class="td-filter-row">
    <div class="td-chips" id="td-type-chips">
      <button class="td-chip active" data-value="">All Types</button>
      <button class="td-chip" data-value="Play">Play</button>
      <button class="td-chip" data-value="Musical">Musical</button>
      <button class="td-chip" data-value="Pantomime">Pantomime</button>
    </div>
    <select class="td-select" id="td-month">
      <option value="">All Months</option>
    </select>
    <select class="td-select" id="td-suburb">
      <option value="">All Locations</option>
    </select>
  </div>
  <div class="td-count" id="td-count"></div>
</div>

<main class="td-main">
  <div class="td-grid" id="td-grid">
    <div class="td-loading">Loading shows…</div>
  </div>
</main>

<footer class="td-footer">
  <span>Theatredex 2026 — <a href="/">blakestringer.com</a></span>
  <span>Data: Victorian community theatre listings</span>
</footer>

<script>
/* ── THEME ── */
(function () {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();

document.getElementById('td-theme-btn').addEventListener('click', () => {
  const themes = ['light', 'dark', 'terminal'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur) + 1) % themes.length];
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

/* ── CONFIG ── */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfBhALi9j_StQcvcxjy7Iyj6xNOejrkT5cLK4NHUiikmuoKoPXZxdOPeQJTpwrjD5tgUNQ0iKV9UIP/pub?gid=1603898813&single=true&output=csv';
const MONTHS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── CSV PARSER ── */
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const headers = splitRow(lines[0]);
  return lines.slice(1).reduce((acc, line) => {
    if (!line.trim()) return acc;
    const vals = splitRow(line);
    const row  = {};
    headers.forEach((h, i) => { row[h.trim()] = (vals[i] || '').trim(); });
    if (row.company && row.title) acc.push(row);
    return acc;
  }, []);
}

function splitRow(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else { cur += c; }
  }
  out.push(cur);
  return out;
}

/* ── DATE HELPERS ── */
function parseDate(iso) { return iso ? new Date(iso + 'T00:00:00') : null; }

function fmtDate(iso) {
  const d = parseDate(iso);
  return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] : '';
}

function fmtRange(row) {
  if (row.date_approximate === 'Yes') {
    const d = parseDate(row.date_start);
    return d ? MONTHS[d.getMonth()] + ' 2026' : '';
  }
  const s = fmtDate(row.date_start), e = fmtDate(row.date_end);
  if (s && e && s !== e) return s + ' – ' + e;
  return s || e || '';
}

function monthsOf(row) {
  const s = parseDate(row.date_start), e = parseDate(row.date_end) || s;
  if (!s) return [];
  const out = [];
  for (let m = s.getMonth(); m <= e.getMonth(); m++) out.push(m);
  return out;
}

/* ── STATE ── */
let allShows = [], activeType = '', activeMonth = '', activeSuburb = '', searchQ = '';

/* ── RENDER CARD ── */
function card(show) {
  const type    = show.type || 'Play';
  const badgeCls = 'td-badge td-badge-' + type.toLowerCase();
  const links   = [];
  if (show.url_map)       links.push(`<a class="td-link" href="${show.url_map}"       target="_blank" rel="noopener">Map</a>`);
  if (show.url_facebook)  links.push(`<a class="td-link" href="${show.url_facebook}"  target="_blank" rel="noopener">FB</a>`);
  if (show.url_instagram) links.push(`<a class="td-link" href="${show.url_instagram}" target="_blank" rel="noopener">IG</a>`);
  if (show.url_web)       links.push(`<a class="td-link" href="${show.url_web}"       target="_blank" rel="noopener">Web</a>`);
  const people = [show.director ? 'Dir. ' + show.director : '', show.playwright].filter(Boolean).join('<br>');

  return `<div class="td-card">
    <div class="td-card-row1">
      <span class="${badgeCls}">${type}</span>
      <span class="td-company">${show.company}</span>
    </div>
    <div class="td-title-text">${show.title}</div>
    <div class="td-dates">${fmtRange(show)}</div>
    <div class="td-location">📍 ${show.suburb || ''}</div>
    ${people ? `<div class="td-people">${people}</div>` : ''}
    ${links.length ? `<div class="td-links">${links.join('')}</div>` : ''}
    <button class="td-blakeai" disabled title="Coming soon">✦ Ask BlakeAI</button>
  </div>`;
}

/* ── FILTER + RENDER ── */
function render() {
  const q = searchQ.toLowerCase();
  const month = activeMonth !== '' ? parseInt(activeMonth) : null;

  const results = allShows.filter(s => {
    if (activeType && s.type !== activeType) return false;
    if (activeSuburb && s.suburb !== activeSuburb) return false;
    if (month !== null && !monthsOf(s).includes(month)) return false;
    if (q) {
      const hay = [s.title, s.company, s.playwright, s.director, s.suburb].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const grid  = document.getElementById('td-grid');
  const count = document.getElementById('td-count');
  grid.innerHTML  = results.length ? results.map(card).join('') : '<div class="td-empty">No shows match — try adjusting your filters</div>';
  count.textContent = `Showing ${results.length} of ${allShows.length} productions`;
}

/* ── POPULATE DROPDOWNS ── */
function buildFilters(shows) {
  const monthSel  = document.getElementById('td-month');
  const suburbSel = document.getElementById('td-suburb');

  const monthSet = new Set();
  shows.forEach(s => monthsOf(s).forEach(m => monthSet.add(m)));
  [...monthSet].sort((a,b) => a-b).forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = MONTHS[m];
    monthSel.appendChild(o);
  });

  [...new Set(shows.map(s => s.suburb).filter(Boolean))].sort().forEach(sub => {
    const o = document.createElement('option');
    o.value = sub; o.textContent = sub;
    suburbSel.appendChild(o);
  });
}

/* ── FETCH ── */
async function init() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    allShows = parseCSV(text).sort((a, b) => (a.date_start || '').localeCompare(b.date_start || ''));
    buildFilters(allShows);
    render();
  } catch (e) {
    document.getElementById('td-grid').innerHTML =
      '<div class="td-empty">Unable to load show data — please try again shortly.</div>';
    document.getElementById('td-count').textContent = '';
  }
}

/* ── EVENTS ── */
document.getElementById('td-search').addEventListener('input', e => { searchQ = e.target.value; render(); });
document.getElementById('td-month').addEventListener('change',  e => { activeMonth  = e.target.value; render(); });
document.getElementById('td-suburb').addEventListener('change', e => { activeSuburb = e.target.value; render(); });
document.getElementById('td-type-chips').addEventListener('click', e => {
  const chip = e.target.closest('.td-chip');
  if (!chip) return;
  document.querySelectorAll('#td-type-chips .td-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeType = chip.dataset.value;
  render();
});

init();
</script>
</body>
</html>
