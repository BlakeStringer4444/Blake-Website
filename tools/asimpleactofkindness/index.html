  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lime:    #D4FF1A;
      --purple:  #9933ff;
      --black:   #0a0a0a;
      --bg:      #f5f5f0;
      --card-bg: #ffffff;
      --fg:      #111111;
      --muted:   rgba(0,0,0,0.45);
      --border:  rgba(0,0,0,0.1);
      --font:    'DM Mono', monospace;
    }
    [data-theme="dark"] {
      --bg:      #0e0e0e;
      --card-bg: #141414;
      --fg:      rgba(255,255,255,0.85);
      --muted:   rgba(240,240,235,0.4);
      --border:  rgba(255,255,255,0.09);
    }
    [data-theme="terminal"] {
      --bg:      #000000;
      --card-bg: #111111;
      --fg:      #D4FF1A;
      --muted:   rgba(212,255,26,0.4);
      --border:  rgba(212,255,26,0.14);
    }

    :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
    [data-theme="dark"] :focus-visible,
    [data-theme="terminal"] :focus-visible { outline-color: var(--lime); }

    html, body { min-height: 100%; font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 13px; transition: background 0.2s, color 0.2s; }

    /* ── HEADER ── */
    .asak-header { background: var(--black); padding: 28px 48px 24px; }
    .asak-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .asak-back-link { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(212,255,26,0.6); text-decoration: none; transition: color 0.15s; }
    .asak-back-link:hover { color: var(--lime); }
    .asak-header-actions { display: flex; gap: 8px; }
    .asak-icon-btn {
      background: none; border: 1px solid rgba(212,255,26,0.25);
      color: rgba(212,255,26,0.7); width: 44px; height: 44px; border-radius: 2px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; line-height: 1;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .asak-icon-btn:hover { border-color: var(--lime); color: var(--lime); }
    #font-btn { font-size: 13px; font-family: 'DM Mono', monospace; letter-spacing: -0.5px; }
    #font-btn.active { background: rgba(212,255,26,0.15); border-color: var(--lime); color: var(--lime); }
    #theme-btn { font-size: 16px; }
    .asak-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 9vw, 104px); letter-spacing: 6px; color: var(--lime); line-height: 1; }
    .asak-subtitle { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(212,255,26,0.4); margin-top: 6px; }

    /* ── MAIN LAYOUT ── */
    .page-body { max-width: 1080px; margin: 0 auto; padding: 48px; display: flex; flex-direction: column; gap: 0; }

    /* ── 3 BIG BUTTONS ── */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
    .big-btn {
      background: var(--card-bg); border: 1px solid var(--border);
      color: var(--fg); font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 3.5vw, 52px); letter-spacing: 4px;
      padding: 52px 24px; cursor: pointer; text-align: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      line-height: 1;
    }
    .big-btn:hover { background: var(--lime); color: #000; border-color: var(--lime); }

    /* Second row, below the countdown — currently just Soundtrack, sized to
       however many buttons end up in it (more may join later). */
    .btn-row-2 { grid-template-columns: 1fr; margin-top: 24px; }

    /* ── COUNTDOWN ── */
    .cd-wrap { display: flex; justify-content: center; align-items: center; padding: 56px 24px; }
    .cd-nums { display: flex; align-items: flex-end; gap: 4px; }
    .cd-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cd-num { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 7vw, 88px); color: var(--fg); line-height: 1; min-width: 2ch; text-align: center; }
    .cd-sep { font-family: 'Bebas Neue', sans-serif; font-size: clamp(42px, 6vw, 72px); color: var(--lime); line-height: 1; padding-bottom: 18px; opacity: 0.4; }
    .cd-unit { font-size: 7px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .cd-live { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 6vw, 72px); color: var(--lime); letter-spacing: 4px; }

    /* ── MUSIC PLAYER ── */
    /* Sole content of the Soundtrack modal body, which brings no padding of
       its own — .music-player supplies it instead of nesting another card
       inside the modal. */
    .music-player { padding: 18px 20px; }
    .music-player-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .music-play-btn {
      background: var(--lime); color: #000; border: none;
      width: 34px; height: 34px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .music-play-btn:hover { opacity: 0.82; }
    .music-play-btn:disabled { opacity: 0.3; cursor: default; }
    .music-skip-btn {
      background: none; border: none; color: var(--fg); opacity: 0.55;
      width: 24px; height: 24px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .music-skip-btn:hover { opacity: 1; }
    .music-skip-btn:disabled { opacity: 0.2; cursor: default; }
    .music-track-name {
      font-family: var(--font); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--fg); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .music-time { font-family: var(--font); font-size: 9px; letter-spacing: 0.5px; color: var(--muted); white-space: nowrap; }
    .music-cue {
      font-family: var(--font); font-size: 9px; letter-spacing: 0.5px; font-style: italic;
      color: var(--muted); margin: -4px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .music-vis { display: block; width: 100%; height: 56px; margin: 4px 0 10px; transition: opacity 0.2s; }
    .music-progress { height: 24px; cursor: pointer; overflow: visible; position: relative; display: flex; align-items: center; transition: opacity 0.2s; }
    .music-progress::before {
      content: ''; position: absolute; left: 0; right: 0; height: 3px;
      background: var(--border); top: 50%; transform: translateY(-50%);
    }
    .music-progress-fill { height: 3px; background: var(--lime); width: 0%; pointer-events: none; transition: width 0.1s linear; position: relative; z-index: 1; }
    .music-progress-thumb {
      position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
      width: 11px; height: 11px; border-radius: 50%; background: var(--lime); pointer-events: none; z-index: 2;
    }
    .music-progress-fill.playing { animation: music-glow 2s ease-in-out infinite; }
    @keyframes music-glow {
      0%, 100% { box-shadow: 0 0 4px 2px rgba(212,255,26,0.3); }
      50%       { box-shadow: 0 0 12px 4px rgba(212,255,26,0.7); }
    }
    .music-player.empty .music-progress,
    .music-player.empty .music-vis { pointer-events: none; opacity: 0.4; }
    .music-queue-btn.active { opacity: 1; }
    .music-queue { border-top: 1px solid var(--border); margin: 10px 0 2px; padding-top: 8px; max-height: 200px; overflow-y: auto; }
    .music-queue-list { display: flex; flex-direction: column; gap: 2px; }
    .music-queue-item {
      display: flex; align-items: flex-start; gap: 8px; width: 100%;
      background: none; border: none; text-align: left; padding: 7px 6px;
      cursor: pointer; font-family: var(--font); font-size: 10px; letter-spacing: 0.5px;
      color: var(--muted); border-radius: 2px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .music-queue-item:hover { background: rgba(212,255,26,0.1); color: var(--fg); }
    .music-queue-item .music-queue-num { flex-shrink: 0; opacity: 0.5; width: 14px; padding-top: 1px; }
    .music-queue-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .music-queue-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .music-queue-cue { font-size: 9px; opacity: 0.7; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .music-queue-item[aria-current="true"] { color: var(--fg); font-weight: 700; }
    .music-queue-item[aria-current="true"] .music-queue-num::after { content: '♪'; }

    /* ── MODALS ── */
    /* inset:0 already tracks the real viewport under `zoom` (and under a mobile
       browser's expanded layout viewport), so the overlay is the reliable
       reference for sizing the modal — see .modal's max-height below. */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.72);
      /* flex-start, not center: centering split any leftover height evenly
         above and below the modal, so a modal shorter than the viewport
         (e.g. the script at a low starting zoom) floated with a big gap on
         top. Anchoring top makes that gap a fixed, small amount instead. */
      display: flex; align-items: flex-start; justify-content: center;
      padding: 56px 24px 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--bg); border: 1px solid var(--border);
      width: 100%; max-width: 860px;
      /* Percentage of the overlay's content box, NOT vh: `zoom` on <html> scales
         the modal but leaves vh reporting the unzoomed viewport, so a vh-based
         height rendered 1.25× too tall and overflowed the window. */
      max-height: 100%;
      display: flex; flex-direction: column;
      transform: scale(0.97); transition: transform 0.22s;
      overflow: hidden;
    }
    .modal-overlay.open .modal { transform: scale(1); }

    .modal-header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    }
    .modal-header-title { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); flex: 1; }
    .modal-close {
      background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1;
      cursor: pointer; padding: 2px 6px; transition: color 0.15s;
    }
    .modal-close:hover { color: var(--fg); }
    .modal-body { flex: 1; overflow-y: auto; }
    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #sched-body { zoom: 1.2; }

    /* ── SCHEDULE MODAL CONTENT ── */
    .sched-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .sched-table thead th {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      padding: 10px 14px; text-align: left; font-weight: 400;
      border-bottom: 1px solid var(--border); background: var(--bg);
      position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    .sched-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--fg); }
    .sched-date { font-weight: 500; }
    .sched-tr.past td { opacity: 0.35; text-decoration: line-through; color: var(--muted); }
    .sched-tr.today { background: rgba(212,255,26,0.07); }
    .sched-tr.today td:first-child { border-left: 3px solid var(--lime); padding-left: 11px; }
    .sched-tr.next-up { background: rgba(153,51,255,0.06); }
    .sched-tr.next-up td:first-child { border-left: 3px solid var(--purple); padding-left: 11px; }
    .sched-tr.performance { background: rgba(212,255,26,0.03); }
    .sched-tr.performance.today { background: rgba(212,255,26,0.12); }
    .week-sep-row td {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      padding: 14px 14px 6px; background: var(--bg); font-weight: 400;
    }
    .sched-badge { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
    .badge-show { background: var(--lime); color: #000; }
    .badge-today { background: var(--lime); color: #000; }
    .badge-next { background: var(--purple); color: #fff; }
    .sched-loading { padding: 32px 24px; font-size: 10px; letter-spacing: 1px; color: var(--muted); text-align: center; }
    .sched-error { padding: 32px 24px; font-size: 10px; color: #ef4444; text-align: center; line-height: 1.8; }

    /* ── CAST & CREW MODAL CONTENT ── */
    .cc-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
    .cc-table thead th {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      padding: 10px 16px; text-align: left; font-weight: 400;
      border-bottom: 2px solid var(--border); background: var(--bg);
      position: sticky; top: 0; z-index: 1;
    }
    .cc-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--fg); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cc-table td.tbc { color: var(--muted); font-style: italic; }
    .cc-table td a { font-size: 9px; color: var(--muted); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; }
    .cc-table td a:hover { color: var(--lime); }
    .cc-section-row td {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      padding: 14px 16px 6px; background: var(--bg); font-weight: 400;
      border-bottom: 1px solid var(--border);
    }

    /* ── PDF MODAL CONTENT ── */
    .pdf-toolbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 8px 16px; flex-shrink: 0;
    }
    .pdf-nav-btn {
      background: rgba(125,125,125,0.08); border: 1px solid var(--border);
      color: var(--fg); font-family: var(--font); font-size: 12px;
      padding: 3px 10px; cursor: pointer; transition: opacity 0.15s, background 0.15s; line-height: 1;
      text-decoration: none; display: inline-flex; align-items: center; border-radius: 2px;
    }
    .pdf-nav-btn:hover { background: rgba(125,125,125,0.16); }
    .pdf-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .pdf-download-btn { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 11px; background: var(--lime); color: #000; border-color: var(--lime); }
    .pdf-download-btn:hover { opacity: 0.82; background: var(--lime); }
    .pdf-page-input {
      background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      font-family: var(--font); font-size: 11px; width: 42px; text-align: center;
      padding: 3px 4px; -moz-appearance: textfield;
    }
    .pdf-page-input::-webkit-inner-spin-button,
    .pdf-page-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .pdf-page-sep { font-size: 9px; color: var(--muted); white-space: nowrap; }
    .pdf-zoom-divider { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }
    .pdf-zoom-label { font-size: 9px; color: var(--muted); min-width: 38px; text-align: center; }
    .pdf-find-input {
      background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      font-family: var(--font); font-size: 11px; width: 120px;
      padding: 4px 8px; border-radius: 2px;
    }
    .pdf-find-input:focus { outline: none; border-color: var(--lime); }
    .pdf-find-count { font-size: 9px; color: var(--muted); min-width: 36px; text-align: center; white-space: nowrap; }

    /* pan-x pan-y = one finger still scrolls natively, but the browser hands
       two-finger gestures to us so pinch zooms the script, not the whole page. */
    #pdf-body { overflow: auto; touch-action: pan-x pan-y; }
    #pdf-canvas-wrap { display: flex; flex-direction: column; align-items: center; width: max-content; min-width: 100%; padding: 16px; gap: 16px; }

    /* --pw/--ph are each page's committed (sharply rendered) CSS size; --pz is a
       transient pinch multiplier. Setting --pz on the wrapper rescales all pages
       in one style write — the canvases stretch for instant feedback, then get
       re-rendered at full resolution when the gesture ends. */
    .pdf-page {
      position: relative; box-shadow: 0 2px 16px rgba(0,0,0,0.12); flex-shrink: 0;
      width:  calc(var(--pw) * var(--pz, 1));
      height: calc(var(--ph) * var(--pz, 1));
    }
    .pdf-page canvas { display: block; width: 100%; height: 100%; }

    /* PDF.js text layer (for find/highlight) */
    .textLayer {
      position: absolute; top: 0; left: 0;
      width: var(--pw); height: var(--ph);
      transform: scale(var(--pz, 1));
      overflow: hidden; line-height: 1;
      text-align: initial; transform-origin: 0 0; z-index: 2;
      forced-color-adjust: none;
    }
    .textLayer span, .textLayer br {
      color: transparent; position: absolute; white-space: pre;
      cursor: text; transform-origin: 0 0;
    }
    /* The text layer is transparent — visible glyphs come from the canvas
       underneath — so an opaque highlight (the old solid #ffb700) blots the
       word out entirely instead of marking it. Both states stay translucent;
       the active one is just more saturated/opaque than the rest. */
    .textLayer mark.hl { background: rgba(212,255,26,0.45); color: transparent; border-radius: 1px; }
    .textLayer mark.hl.active { background: rgba(255,183,0,0.55); }

    /* ── RESPONSIVE ── */
    @media (max-width: 720px) {
      .asak-header { padding: 18px 20px 14px; }
      .asak-title { font-size: clamp(34px, 11vw, 56px); }
      .page-body { padding: 24px 16px; }
      .btn-row { grid-template-columns: 1fr; gap: 2px; }
      .big-btn { padding: 36px 24px; font-size: clamp(28px, 8vw, 42px); }
      .cd-wrap { padding: 36px 16px; }
      /* Top-anchored, like desktop, rather than the old bottom-sheet (flush
         bottom, floating top) — that left a big empty gap above the modal
         whenever its content didn't reach the max-height. Flush-top with all
         four corners rounded reads as a card near the top of the screen. */
      .modal-overlay { padding: 16px 12px; align-items: flex-start; }
      .modal { max-height: 100%; max-width: 100%; border-radius: 8px; }
      .modal-close { font-size: 24px; padding: 6px 10px; min-width: 40px; min-height: 40px; }
      .modal-header { padding: 10px 14px; }
      .modal-body { -webkit-overflow-scrolling: touch; }
      #sched-body, #cast-body { zoom: 1; }
      #modal-cast .modal { min-height: 72vh; }
      .cc-table td { white-space: normal; overflow: visible; text-overflow: clip; }
      .cc-table td a { white-space: normal; overflow: visible; text-overflow: clip; }
      .pdf-toolbar { padding: 6px 10px; gap: 4px; }
      .pdf-find-input { width: 80px; font-size: 10px; }
      .pdf-download-btn { font-size: 8px; padding: 4px 8px; letter-spacing: 1px; }
      .pdf-zoom-label { min-width: 28px; font-size: 8px; }
      .music-player { padding: 12px 14px; }
      .music-vis { height: 44px; }
    }

    @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>

  <header class="asak-header">
    <div class="asak-header-top">
      <a class="asak-back-link" href="/">← blakestringer.com</a>
      <div class="asak-header-actions">
        <button class="asak-icon-btn" id="font-btn" title="Adjust text size" aria-label="Adjust text size">Aa</button>
        <button class="asak-icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>

  function iconFor(theme) { return theme === 'dark' ? sunSVG : '☾'; }
  /* Terminal mode has been removed; fold any leftover terminal preference into dark. */
  var saved  = localStorage.getItem('theme') || 'light';
  if (saved === 'terminal') saved = 'dark';
  localStorage.setItem('theme', saved);
  document.documentElement.setAttribute('data-theme', saved);
  var btn = document.getElementById('theme-btn');
  btn.innerHTML = iconFor(saved);
  btn.addEventListener('click', function () {
    var cur  = document.documentElement.getAttribute('data-theme') || 'light';
    var next = themes[(themes.indexOf(cur) + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    btn.innerHTML = iconFor(next);
  });
})();

/* ── COUNTDOWN ── */
(function () {
  var target = new Date('2026-11-06T20:00:00+10:30'); /* ACDT — Adelaide */
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {

})();

(function () {
  var lastFocus = null;
  function openModal(id) {
    lastFocus = document.activeElement;
    var modal = document.getElementById(id);
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    /* Move focus into the modal (its close button) */
    var closeBtn = modal.querySelector('.modal-close');
    if (closeBtn) closeBtn.focus();
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
    /* Return focus to the element that opened the modal */
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
    lastFocus = null;
  }

  document.getElementById('open-schedule').addEventListener('click', function () {
    openModal('modal-schedule');
    loadSchedule();
  });
  document.getElementById('open-cast').addEventListener('click', function () {

  document.getElementById('open-soundtrack').addEventListener('click', function () {

    loadMusic();
  });

  /* Close buttons */
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.getAttribute('data-close')); });
  });

  /* Click outside modal */
  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });

  /* Escape key */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.open').forEach(function (el) { closeModal(el.id); });
    }
  });

  /* Swipe-down-to-close on mobile (handle + top 48px of header only) */
  document.querySelectorAll('.modal').forEach(function (modal) {
    var startY = 0, startOnHandle = false;
    modal.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      var rect = modal.getBoundingClientRect();
      startY = t.clientY;
      startOnHandle = (t.clientY - rect.top) < 56; /* handle + header zone */
    }, { passive: true });
    modal.addEventListener('touchend', function (e) {
      if (!startOnHandle) return;
      var dy = e.changedTouches[0].clientY - startY;
      if (dy > 60) {
        var overlay = modal.closest('.modal-overlay');
        if (overlay) closeModal(overlay.id);
      }
    }, { passive: true });
  });
})();

/* ── CSV PARSER (shared) ── */
/* Parses CSV text into an array of row-arrays. Honours double-quoted fields,
   which may contain commas and newlines; "" is an escaped quote. */
function parseCSV(text) {
  var rows = [], row = [], cell = '', q = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else { q = false; }
      } else { cell += ch; }
    } else {
      if (ch === '"') { q = true; }
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else { cell += ch; }
    }
  }
  row.push(cell);
  rows.push(row);
  /* Drop a single trailing empty row produced by a final newline */
  if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') {
    rows.pop();
  }
  return rows;
}

/* ── SHARED ESCAPE ── */
function escHtmlShared(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── SCHEDULE HELPERS (shared with PDF generator) ── */
function parseDT(s) {
  if (!s) return null;
  var p = s.split('-');
  if (p.length < 3) return null;
  var yr = +p[0], mo = +p[1] - 1, dy = +p[2];
  var hr = p[3] != null ? +p[3] : 0, mn = p[4] != null ? +p[4] : 0;
  return (isNaN(yr) || isNaN(mo) || isNaN(dy)) ? null : new Date(yr, mo, dy, hr, mn);
}
var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) { return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtTime(d) {
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + (m ? ':' + String(m).padStart(2,'0') : '') + ap;
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
var schedPdfRows = null;
var schedPdfHas  = null;

/* ── SCHEDULE ── */
var scheduleLoaded = false;
function loadSchedule() {
  if (scheduleLoaded) return;

  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQir7qILS7kW7vkbl7FkYSLiDoKFKE2yNOaque6STmHbyz4yj2dzZIGV2JtAzL7Pfh219tGlivT69fV/pub?gid=0&single=true&output=csv';
  var body    = document.getElementById('sched-body');

  function toRows(txt) {
    var matrix  = parseCSV(txt);
    if (!matrix.length) return [];
    var headers = matrix[0].map(function (h) { return h.trim().toLowerCase(); });
    var rows    = [];
    for (var i = 1; i < matrix.length; i++) {
      var cols = matrix[i], obj = {};
      headers.forEach(function (h, j) { obj[h] = (cols[j] || '').trim(); });
      if (obj.datetime) rows.push(obj);
    }
    return rows;
  }

  var esc = escHtmlShared;

  function render(rows) {
    var now   = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    var nextIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      var d = parseDT(rows[i].datetime);
      if (d && d > now) { nextIdx = i; break; }
    }

    /* Detect which optional columns have any data */
    var has = { pages: false, act: false, scene: false, characters: false, context: false };
    rows.forEach(function (r) {
      if (r.pages)      has.pages = true;
      if (r.act)        has.act = true;
      if (r.scene)      has.scene = true;
      if (r.characters) has.characters = true;
      if (r.context)    has.context = true;
    });

    /* Colspan = date + time + optional cols + badge */
    var colCount = 2 + (has.pages?1:0) + (has.act?1:0) + (has.scene?1:0) + (has.characters?1:0) + (has.context?1:0) + 1;

    var html = '<table class="sched-table"><thead><tr>'
             + '<th>Date</th><th>Time</th>'
             + (has.pages      ? '<th>Pages</th>'      : '')
             + (has.act        ? '<th>Act</th>'        : '')
             + (has.scene      ? '<th>Scene</th>'      : '')
             + (has.characters ? '<th>Characters</th>' : '')
             + (has.context    ? '<th>Notes</th>'      : '')
             + '<th></th></tr></thead><tbody>';

    /* Group by week */
    var groups = [], gmap = {};
    rows.forEach(function (row, idx) {
      var wk = row.week || 'Schedule';
      if (!gmap[wk]) { gmap[wk] = []; groups.push({ label: wk, items: gmap[wk] }); }
      gmap[wk].push({ row: row, idx: idx });
    });

    groups.forEach(function (g) {
      html += '<tr class="week-sep-row"><td colspan="' + colCount + '">' + esc(g.label) + '</td></tr>';
      g.items.forEach(function (entry) {
        var row = entry.row, d = parseDT(row.datetime);
        if (!d) return;
        var isToday = sameDay(d, today);
        var isPast  = !isToday && d < now;
        var isNext  = entry.idx === nextIdx && !isToday;
        var isPerf  = !!row.performance;
        var cls = 'sched-tr' + (isPast?' past':'') + (isToday?' today':'') + (isNext?' next-up':'') + (isPerf?' performance':'');
        var badge = isToday ? '<span class="sched-badge badge-today">today</span>'
                  : isNext  ? '<span class="sched-badge badge-next">next</span>'
                  : (isPerf && !isPast) ? '<span class="sched-badge badge-show">' + esc(row.performance) + '</span>'
                  : '';
        var anchor = isToday ? ' id="sched-today"' : (isNext ? ' id="sched-next"' : '');
        html += '<tr class="' + cls + '"' + anchor + '>'
              + '<td class="sched-date">' + fmtDate(d) + '</td>'
              + '<td>' + fmtTime(d) + '</td>'
              + (has.pages      ? '<td>' + esc(row.pages      || '') + '</td>' : '')
              + (has.act        ? '<td>' + esc(row.act        || '') + '</td>' : '')
              + (has.scene      ? '<td>' + esc(row.scene      || '') + '</td>' : '')
              + (has.characters ? '<td>' + esc(row.characters || '') + '</td>' : '')
              + (has.context    ? '<td>' + esc(row.context    || '') + '</td>' : '')
              + '<td>' + badge + '</td></tr>';
      });
    });

    html += '</tbody></table>';
    body.innerHTML = html;
    scheduleLoaded = true;
    schedPdfRows = rows;
    schedPdfHas  = has;
    document.getElementById('sched-dl-btn').style.display = '';

    setTimeout(function () {
      var el = document.getElementById('sched-today') || document.getElementById('sched-next');
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 120);
  }

  fetch(CSV_URL)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) { var rows = toRows(txt); if (!rows.length) throw new Error('empty'); render(rows); })
    .catch(function (err) { body.innerHTML = '<div class="sched-error">Could not load schedule.<br>' + esc(err.message) + '</div>'; });
}

/* ── CAST & CREW ── */
var castLoaded = false;
function loadCast() {
  if (castLoaded) return;

  var CC_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQir7qILS7kW7vkbl7FkYSLiDoKFKE2yNOaque6STmHbyz4yj2dzZIGV2JtAzL7Pfh219tGlivT69fV/pub?gid=43169221&single=true&output=csv';
  var body   = document.getElementById('cast-body');

  var esc = escHtmlShared;

  function render(rows) {
    var cast = rows.filter(function (r) { return r.role_cast; });
    var crew = rows.filter(function (r) { return r.role_crew; });

    var html = '<table class="cc-table"><colgroup>'
             + '<col style="width:30%"><col style="width:28%"><col style="width:18%"><col style="width:24%">'
             + '</colgroup><thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead><tbody>';

    if (cast.length) {
      html += '<tr class="cc-section-row"><td colspan="4">Cast</td></tr>';
      cast.forEach(function (r) {
        html += '<tr>'
              + '<td>' + esc(r.role_cast) + '</td>'
              + '<td' + (!r.name ? ' class="tbc"' : '') + '>' + esc(r.name || 'TBC') + '</td>'
              + '<td></td><td></td></tr>';
      });
    }

    if (crew.length) {
      html += '<tr class="cc-section-row"><td colspan="4">Crew</td></tr>';
      crew.forEach(function (r) {
        html += '<tr>'
              + '<td>' + esc(r.role_crew) + '</td>'
              + '<td' + (!r.name ? ' class="tbc"' : '') + '>' + esc(r.name || 'TBC') + '</td>'
              + '<td>' + (r.number ? '<a href="tel:' + esc(r.number) + '">' + esc(r.number) + '</a>' : '') + '</td>'
              + '<td>' + (r.email  ? '<a href="mailto:' + esc(r.email)  + '">' + esc(r.email)  + '</a>' : '') + '</td>'
              + '</tr>';
      });
    }

    html += '</tbody></table>';
    body.innerHTML = (cast.length || crew.length) ? html : '<div class="sched-loading">No entries found.</div>';
    castLoaded = true;
  }

  function toRows(txt) {
    var matrix  = parseCSV(txt);
    if (!matrix.length) return [];
    var headers = matrix[0].map(function (h) { return h.trim().toLowerCase().replace(/\s+/g,'_'); });
    var rows    = [];
    for (var i = 1; i < matrix.length; i++) {
      var cols = matrix[i], obj = {};
      headers.forEach(function (h, j) { obj[h] = (cols[j] || '').trim(); });
      if (obj.role_cast || obj.role_crew || obj.name) rows.push(obj);
    }
    return rows;
  }

  fetch(CC_URL)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) { render(toRows(txt)); })
    .catch(function (err) { body.innerHTML = '<div class="sched-error">Could not load cast &amp; crew.<br>' + esc(err.message) + '</div>'; });
}

/* ── PDF VIEWER (continuous scroll + find) ── */
var pdfLoaded = false;
function loadPDF() {
  if (pdfLoaded) return;
  pdfLoaded = true;

  var PDF_PATH = '/tools/asimpleactofkindness/script.pdf';
  if (typeof pdfjsLib === 'undefined') return;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var wrap      = document.getElementById('pdf-canvas-wrap');
  var pdfBody   = document.getElementById('pdf-body');
  var nav       = document.getElementById('pdf-nav');
  var prevBtn   = document.getElementById('pdf-prev');
  var nextBtn   = document.getElementById('pdf-next');
  var pageInput = document.getElementById('pdf-page-input');
  var pageSep   = document.getElementById('pdf-page-sep');
  var zoomInBtn = document.getElementById('pdf-zoom-in');
  var zoomOutBtn= document.getElementById('pdf-zoom-out');
  var zoomLabel = document.getElementById('pdf-zoom-label');
  var findInput = document.getElementById('pdf-find-input');
  var findCount = document.getElementById('pdf-find-count');
  var findPrev  = document.getElementById('pdf-find-prev');
  var findNext  = document.getElementById('pdf-find-next');

  var pdfDoc = null, numPages = 0, curPage = 1;
  var zoomMult = (window.innerWidth >= 720) ? 2.0 : 0.75;
  var ZOOM_MIN = 0.25, ZOOM_MAX = 4.0;

  var renderToken = 0; /* invalidates an in-flight render pass when zoom changes */
  var pageObjs = {};   /* pdf page objects */
  var pageTexts = {};  /* textContent objects */
  var pageEls = [];    /* .pdf-page wrapper elements */
  var pageDivs = {};   /* text-layer span arrays per page */

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  pdfjsLib.getDocument(PDF_PATH).promise.then(function (pdf) {
    pdfDoc   = pdf;
    numPages = pdf.numPages;
    nav.style.display = 'flex';
    pageSep.textContent = '/ ' + numPages;
    pageInput.max = numPages;
    [prevBtn, nextBtn, pageInput, zoomInBtn, zoomOutBtn, findInput, findPrev, findNext]
      .forEach(function (el) { el.disabled = false; });

    /* Fetch all pages + their text, then build & render */
    var jobs = [];
    for (var n = 1; n <= numPages; n++) jobs.push(n);
    return jobs.reduce(function (chain, n) {
      return chain.then(function () {
        return pdfDoc.getPage(n).then(function (page) {
          pageObjs[n] = page;
          return page.getTextContent().then(function (tc) { pageTexts[n] = tc; });
        });
      });
    }, Promise.resolve());
  }).then(function () {
    /* On mobile, default to fit-to-width expressed as a real percentage */
    if (window.innerWidth < 720) {
      var vp1   = pageObjs[1].getViewport({ scale: 1 });
      var avail = Math.max(pdfBody.clientWidth - 32, 200);
      zoomMult  = Math.round((avail / vp1.width) * 4) / 4; /* round to nearest 25% */
      zoomMult  = Math.min(1.0, Math.max(ZOOM_MIN, zoomMult));
    }
    buildSkeleton();
    return renderAll();
  }).then(function () {
    updateZoomLabel();
    /* Rendering 92 pages takes a moment; if the reader has already started
       scrolling by the time it finishes, don't yank them back to the top. */
    if (pdfBody.scrollTop < 8) scrollToPage(1);
  }).catch(function () {
    wrap.innerHTML = '<div class="sched-loading">Could not load PDF.</div>';
  });

  function buildSkeleton() {
    wrap.innerHTML = '';
    pageEls = [];
    for (var n = 1; n <= numPages; n++) {
      var el = document.createElement('div');
      el.className = 'pdf-page';
      el.setAttribute('data-page', n);
      wrap.appendChild(el);
      pageEls.push(el);
    }
  }

  function renderAll(anchor) {
    /* zoomMult IS the scale: 1.0 = 100% real size, 2.0 = 200%, etc. */
    var scale = zoomMult;
    /* Repainting 92 pages takes a while, so a second zoom can easily start
       before the first finishes. Stamp each pass and let stale ones bail out,
       otherwise the old pass keeps re-sizing pages at the superseded scale. */
    var token = ++renderToken;
    pageDivs = {};

    /* Size every page up front so the scroll height is final immediately. The
       existing canvases stay on screen, CSS-stretched into their new boxes, and
       sharpen as they repaint — rather than the document growing under the
       reader while 92 pages re-render one by one. */
    for (var n = 1; n <= numPages; n++) {
      var vp = pageObjs[n].getViewport({ scale: scale });
      pageEls[n - 1].style.setProperty('--pw', vp.width  + 'px');
      pageEls[n - 1].style.setProperty('--ph', vp.height + 'px');
    }
    if (anchor) restoreAnchor(anchor);

    /* Repaint outward from whatever is on screen, so the page being read comes
       back into focus first and distant pages catch up in the background. */
    var centre = anchor ? anchor.page + 1 : curPage;
    var order  = [];
    for (var i = 1; i <= numPages; i++) order.push(i);
    order.sort(function (a, b) { return Math.abs(a - centre) - Math.abs(b - centre); });

    var chain = Promise.resolve();
    order.forEach(function (n) {
      chain = chain.then(function () {
        if (token !== renderToken) return;
        return renderOne(n, scale);
      });
    });
    return chain.then(function () {
      if (token !== renderToken) return;
      if (findInput.value.trim()) runSearch(findInput.value.trim());
    });
  }

  function renderOne(n, scale) {
    var page  = pageObjs[n];
    var dpr   = Math.min(window.devicePixelRatio || 1, 3); /* cap at 3× for perf */
    var vpCss = page.getViewport({ scale: scale });         /* CSS dimensions */
    var vpHi  = page.getViewport({ scale: scale * dpr });  /* physical pixel dimensions */
    var el    = pageEls[n - 1];

    /* Page box is driven by these two custom properties (see .pdf-page CSS) so a
       pinch can rescale every page without touching each element individually. */
    el.style.setProperty('--pw', vpCss.width  + 'px');
    el.style.setProperty('--ph', vpCss.height + 'px');
    el.innerHTML = '';

    /* Canvas rendered at physical resolution, displayed at CSS size = sharp on retina */
    var canvas = document.createElement('canvas');
    canvas.width  = vpHi.width;
    canvas.height = vpHi.height;
    el.appendChild(canvas);

    /* Text layer uses CSS viewport for correct hit-test positioning */
    var tl = document.createElement('div');
    tl.className = 'textLayer';
    /* pdf.js ≥3 positions its spans with calc() against this variable; without it
       the layer collapses and find-highlights land in the wrong place. */
    tl.style.setProperty('--scale-factor', scale);
    el.appendChild(tl);

    var divs = [];
    var renderTask = page.render({ canvasContext: canvas.getContext('2d'), viewport: vpHi });
    var textTask   = pdfjsLib.renderTextLayer({
      textContentSource: pageTexts[n],
      container: tl,
      viewport: vpCss,
      textDivs: divs
    });
    pageDivs[n] = divs;

    return Promise.all([renderTask.promise, textTask.promise]).catch(function () {});
  }

  /* ── Navigation ──
     The Aa button applies CSS `zoom` to <html> (desktop defaults to 1.25× —
     there's no 1.0 level), which scales getBoundingClientRect() into physical
     screen pixels but leaves scrollTop in the element's own unzoomed pixels.
     A delta measured via rects has to be divided back down before it's added
     to scrollTop, or the scroll overshoots by exactly the zoom factor — small
     jumps land close enough to look fine, but paging across several pages (or
     jumping to a distant find-match) lands increasingly far off target. */
  function currentZoom() {
    return parseFloat(document.documentElement.style.zoom) || 1;
  }
  function scrollByPhysicalPx(px) {
    pdfBody.scrollTop += px / currentZoom();
  }

  function scrollToPage(n) {
    var el = pageEls[n - 1];
    if (!el) return;
    var bodyRect = pdfBody.getBoundingClientRect();
    var elRect   = el.getBoundingClientRect();
    scrollByPhysicalPx((elRect.top - bodyRect.top) - 12);
  }

  /* Remember which point of the script is under a given screen position, so a
     zoom change can put that same point back rather than jumping to a page top.
     Expressed as (page, fraction down that page) so it survives re-rendering. */
  function captureAnchor(clientY) {
    var bodyRect = pdfBody.getBoundingClientRect();
    var y = (clientY == null) ? bodyRect.top + bodyRect.height / 2 : clientY;
    for (var i = 0; i < pageEls.length; i++) {
      var r = pageEls[i].getBoundingClientRect();
      if (r.bottom >= y || i === pageEls.length - 1) {
        return { page: i, frac: r.height ? (y - r.top) / r.height : 0, screenY: y - bodyRect.top };
      }
    }
    return null;
  }

  function restoreAnchor(a) {
    if (!a) return;
    var el = pageEls[a.page];
    if (!el) return;
    var bodyRect = pdfBody.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    scrollByPhysicalPx((r.top - bodyRect.top) - (a.screenY - a.frac * r.height));
  }

  function updateCurrentPage() {
    var bodyRect = pdfBody.getBoundingClientRect();
    var mark = bodyRect.top + bodyRect.height * 0.35;
    var best = 1;
    for (var i = 0; i < pageEls.length; i++) {
      if (pageEls[i].getBoundingClientRect().top <= mark) best = i + 1; else break;
    }
    curPage = best;
    if (document.activeElement !== pageInput) pageInput.value = best;
    prevBtn.disabled = best <= 1;
    nextBtn.disabled = best >= numPages;
  }

  var scrollTick = false;
  pdfBody.addEventListener('scroll', function () {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(function () { updateCurrentPage(); scrollTick = false; });
  });

  prevBtn.addEventListener('click', function () { if (curPage > 1) scrollToPage(curPage - 1); });
  nextBtn.addEventListener('click', function () { if (curPage < numPages) scrollToPage(curPage + 1); });

  pageInput.addEventListener('change', function () {
    var n = parseInt(this.value, 10);
    if (!isNaN(n) && n >= 1 && n <= numPages) scrollToPage(n);
    else this.value = curPage;
  });
  pageInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });

  /* ── Zoom ── */
  function updateZoomLabel() {
    zoomLabel.textContent = Math.round(zoomMult * 100) + '%';
    zoomOutBtn.disabled = zoomMult <= ZOOM_MIN + 0.001;
    zoomInBtn.disabled  = zoomMult >= ZOOM_MAX - 0.001;
  }
  function applyZoom() {
    var anchor = captureAnchor(null);
    updateZoomLabel();
    renderAll(anchor).then(updateCurrentPage);
  }
  zoomInBtn.addEventListener('click', function () {
    zoomMult = Math.min(ZOOM_MAX, parseFloat((zoomMult + 0.25).toFixed(2)));
    applyZoom();
  });
  zoomOutBtn.addEventListener('click', function () {
    zoomMult = Math.max(ZOOM_MIN, parseFloat((zoomMult - 0.25).toFixed(2)));
    applyZoom();
  });

  /* ── Find ── */
  var matches = [], matchIdx = -1;

  function clearHighlights() {
    for (var n = 1; n <= numPages; n++) {
      var divs = pageDivs[n];
      if (!divs) continue;
      for (var i = 0; i < divs.length; i++) {
        if (divs[i] && divs[i]._hl) { divs[i].textContent = divs[i]._orig; divs[i]._hl = false; }
      }
    }
    matches = []; matchIdx = -1;
  }

  function updateFindCount() {
    findCount.textContent = matches.length ? (matchIdx + 1) + ' / ' + matches.length : (findInput.value.trim() ? '0 / 0' : '');
    findPrev.disabled = matches.length < 2;
    findNext.disabled = matches.length < 2;
  }

  function activateMatch(i, scroll) {
    if (!matches.length) return;
    if (matches[matchIdx]) matches[matchIdx].classList.remove('active');
    matchIdx = (i + matches.length) % matches.length;
    var m = matches[matchIdx];
    m.classList.add('active');
    if (scroll) {
      var bodyRect = pdfBody.getBoundingClientRect();
      var r = m.getBoundingClientRect();
      scrollByPhysicalPx((r.top - bodyRect.top) - bodyRect.height * 0.3);
    }
    updateFindCount();
  }

  function runSearch(q) {
    clearHighlights();
    if (!q) { updateFindCount(); return; }
    var ql = q.toLowerCase();
    for (var n = 1; n <= numPages; n++) {
      var divs = pageDivs[n];
      if (!divs) continue;
      for (var d = 0; d < divs.length; d++) {
        var sp = divs[d];
        if (!sp) continue;
        if (sp._orig == null) sp._orig = sp.textContent;
        var txt = sp._orig, low = txt.toLowerCase();
        if (low.indexOf(ql) === -1) continue;
        var html = '', i = 0, idx;
        while ((idx = low.indexOf(ql, i)) !== -1) {
          html += escHtml(txt.slice(i, idx)) + '<mark class="hl">' + escHtml(txt.slice(idx, idx + ql.length)) + '</mark>';
          i = idx + ql.length;
        }
        html += escHtml(txt.slice(i));
        sp.innerHTML = html;
        sp._hl = true;
        var ms = sp.getElementsByClassName('hl');
        for (var k = 0; k < ms.length; k++) matches.push(ms[k]);
      }
    }
    if (matches.length) { matchIdx = -1; activateMatch(0, true); }
    else updateFindCount();
  }

  var findTimer = null;
  findInput.addEventListener('input', function () {
    clearTimeout(findTimer);
    var v = this.value.trim();
    findTimer = setTimeout(function () { runSearch(v); }, 200);
  });
  findInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (matches.length) activateMatch(matchIdx + (e.shiftKey ? -1 : 1), true);
    }
  });
  findPrev.addEventListener('click', function () { activateMatch(matchIdx - 1, true); });
  findNext.addEventListener('click', function () { activateMatch(matchIdx + 1, true); });

  /* ── Arrow keys (page nav when not typing) ── */
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('modal-script').classList.contains('open')) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault(); if (curPage < numPages) scrollToPage(curPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); if (curPage > 1) scrollToPage(curPage - 1);
    }
  });

  /* ── Pinch to zoom ──
     Horizontal-swipe page flipping used to live here, but a pinch drags each
     finger sideways too, so zooming would randomly jump pages mid-gesture.
     Paging is now the toolbar/arrow keys only; touch is free for zooming and
     ordinary vertical scrolling through the continuous page stack. */
  var pinch = null;

  function touchDist(t) {
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  }

  function endPinch() {
    if (!pinch) return;
    if (pinch.raf) cancelAnimationFrame(pinch.raf);
    var anchor  = pinch.anchor;
    var target  = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, parseFloat((pinch.z0 * pinch.f).toFixed(3))));
    var changed = Math.abs(target - zoomMult) > 0.005;
    pinch = null;
    wrap.style.setProperty('--pz', 1);          /* drop the stretched preview */
    if (!changed) { updateZoomLabel(); return; }
    zoomMult = target;
    updateZoomLabel();
    renderAll(anchor).then(updateCurrentPage);
  }

  pdfBody.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();                          /* stop the browser zooming the page */
    var d0 = touchDist(e.touches);
    if (!d0) return;
    pinch = {
      d0: d0, z0: zoomMult, f: 1, raf: 0,
      anchor: captureAnchor((e.touches[0].clientY + e.touches[1].clientY) / 2)
    };
  }, { passive: false });

  pdfBody.addEventListener('touchmove', function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinch.z0 * (touchDist(e.touches) / pinch.d0)));
    pinch.f = next / pinch.z0;
    if (pinch.raf) return;
    pinch.raf = requestAnimationFrame(function () {
      if (!pinch) return;
      pinch.raf = 0;
      wrap.style.setProperty('--pz', pinch.f);
      zoomLabel.textContent = Math.round(pinch.z0 * pinch.f * 100) + '%';
      restoreAnchor(pinch.anchor);               /* keep the pinch point under the fingers */
    });
  }, { passive: false });

  pdfBody.addEventListener('touchend', function (e) {
    if (pinch && e.touches.length < 2) endPinch();
  }, { passive: true });
  pdfBody.addEventListener('touchcancel', endPinch, { passive: true });
}

/* ── SCHEDULE PDF DOWNLOAD ── */
function downloadSchedulePDF() {
  if (!schedPdfRows || !schedPdfRows.length) return;
  var J = window.jspdf;
  if (!J) return;

  var rehearsals  = schedPdfRows.filter(function (r) { return !r.performance; });
  var productions = schedPdfRows.filter(function (r) { return !!r.performance; });

  var doc = new J.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var W   = doc.internal.pageSize.getWidth();   /* 210 */
  var H   = doc.internal.pageSize.getHeight();  /* 297 */
  var MX  = 12;
  var now = new Date();
  var mo  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dateStr = now.getDate() + ' ' + mo[now.getMonth()] + ' ' + now.getFullYear();

  function drawPageHeader(subtitle) {
    doc.setFillColor(10, 10, 10);
    doc.rect(0, 0, W, 26, 'F');
    doc.setFillColor(212, 255, 26);
    doc.rect(0, 26, W, 0.6, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.setTextColor(212, 255, 26);
    doc.text('A SIMPLE ACT OF KINDNESS', MX, 10);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(5.5);
    doc.setTextColor(115, 115, 115);
    doc.text(subtitle + '  ·  BRIGHTON THEATRE COMPANY  ·  6–21 NOV 2026', MX, 18);
    doc.setTextColor(85, 85, 85);
    doc.text('Generated ' + dateStr, W - MX, 18, { align: 'right' });
  }

  function drawPageFooter() {
    doc.setDrawColor(212, 255, 26);
    doc.setLineWidth(0.5);
    doc.line(MX, H - 10, W - MX, H - 10);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(5.5);
    doc.setTextColor(130, 130, 130);
    doc.text('A Simple Act of Kindness  ·  Brighton Theatre Company  ·  Season 2026', MX, H - 5.5);
  }

  /* ── PAGE 1: REHEARSALS ── */
  drawPageHeader('REHEARSAL SCHEDULE');

  var has    = schedPdfHas;
  var availW = W - 2 * MX;

  /* Narrow columns for portrait */
  var colDef = [
    { header: 'DATE',  r: 16 },
    { header: 'TIME',  r: 8  },
  ];
  if (has.pages)      colDef.push({ header: 'PG',   r: 7  });
  if (has.act)        colDef.push({ header: 'ACT',  r: 6  });
  if (has.scene)      colDef.push({ header: 'SCENE', r: 9  });
  if (has.characters) colDef.push({ header: 'CHARACTERS', r: 22 });
  if (has.context)    colDef.push({ header: 'NOTES',      r: 32 });

  var totalR = colDef.reduce(function (s, c) { return s + c.r; }, 0);
  var colStyles = {};
  colDef.forEach(function (c, i) { colStyles[i] = { cellWidth: (c.r / totalR) * availW }; });

  /* Group rehearsal rows by week */
  var groups = [], gmap = {};
  rehearsals.forEach(function (r) {
    var wk = r.week || 'Schedule';
    if (!gmap[wk]) { gmap[wk] = []; groups.push({ label: wk, rows: gmap[wk] }); }
    gmap[wk].push(r);
  });

  var rHead = [colDef.map(function (c) { return c.header; })];
  var rBody = [], rMeta = [];

  groups.forEach(function (g) {
    if (!g.rows.length) return;
    rBody.push(colDef.map(function (_, i) { return i === 0 ? g.label.toUpperCase() : ''; }));
    rMeta.push({ type: 'week' });
    g.rows.forEach(function (row) {
      var d = parseDT(row.datetime);
      if (!d) return;
      var isToday = sameDay(d, now);
      var isPast  = !isToday && d < now;
      var cells   = [fmtDate(d), fmtTime(d)];
      if (has.pages)      cells.push(row.pages      || '');
      if (has.act)        cells.push(row.act        || '');
      if (has.scene)      cells.push(row.scene      || '');
      if (has.characters) cells.push(row.characters || '');
      if (has.context)    cells.push(row.context    || '');
      rBody.push(cells);
      rMeta.push({ type: 'data', isPast: isPast, isToday: isToday });
    });
  });

  doc.autoTable({
    head: rHead, body: rBody,
    startY: 30,
    margin: { left: MX, right: MX, bottom: 14 },
    theme: 'plain',
    headStyles: {
      fillColor: [18, 18, 18], textColor: [212, 255, 26],
      fontSize: 6, fontStyle: 'bold',
      cellPadding: { top: 2, right: 3, bottom: 2, left: 3 },
    },
    bodyStyles: {
      fontSize: 6.5,
      cellPadding: { top: 1, right: 3, bottom: 1, left: 3 },
      textColor: [30, 30, 30], lineColor: [228, 228, 222], lineWidth: 0.18,
      fillColor: [255, 255, 255],
    },
    columnStyles: colStyles,
    didParseCell: function (data) {
      if (data.section !== 'body') return;
      var meta = rMeta[data.row.index];
      if (!meta) return;
      if (meta.type === 'week') {
        data.cell.styles.fillColor   = [20, 20, 20];
        data.cell.styles.textColor   = [105, 105, 105];
        data.cell.styles.fontSize    = 5.5;
        data.cell.styles.fontStyle   = 'bold';
        data.cell.styles.cellPadding = { top: 3, right: 3, bottom: 2, left: 3 };
      } else if (meta.isPast) {
        data.cell.styles.textColor = [165, 165, 165];
        data.cell.styles.fillColor = [248, 248, 248];
      } else if (meta.isToday) {
        data.cell.styles.fillColor = [228, 255, 100];
        data.cell.styles.textColor = [20, 20, 20];
        data.cell.styles.fontStyle = 'bold';
      } else if (data.row.index % 2 === 1) {
        data.cell.styles.fillColor = [251, 251, 249];
      }
    },
    didDrawPage: function () { drawPageFooter(); },
  });

  /* ── PAGE 2: PRODUCTION DATES ── */
  if (productions.length) {
    doc.addPage();
    drawPageHeader('PRODUCTION DATES');

    var pColDef = [
      { header: 'DATE',        r: 20 },
      { header: 'TIME',        r: 10 },
      { header: 'PERFORMANCE', r: 70 },
    ];
    var pTotalR = pColDef.reduce(function (s, c) { return s + c.r; }, 0);
    var pColStyles = {};
    pColDef.forEach(function (c, i) { pColStyles[i] = { cellWidth: (c.r / pTotalR) * availW }; });

    var pHead = [pColDef.map(function (c) { return c.header; })];
    var pBody = [], pMeta = [];
    productions.forEach(function (row) {
      var d = parseDT(row.datetime);
      if (!d) return;
      var isToday = sameDay(d, now);
      var isPast  = !isToday && d < now;
      pBody.push([fmtDate(d), fmtTime(d), row.performance || '']);
      pMeta.push({ isPast: isPast, isToday: isToday });
    });

    doc.autoTable({
      head: pHead, body: pBody,
      startY: 30,
      margin: { left: MX, right: MX, bottom: 14 },
      theme: 'plain',
      headStyles: {
        fillColor: [18, 18, 18], textColor: [212, 255, 26],
        fontSize: 6, fontStyle: 'bold',
        cellPadding: { top: 2, right: 4, bottom: 2, left: 4 },
      },
      bodyStyles: {
        fontSize: 8,
        cellPadding: { top: 2.5, right: 4, bottom: 2.5, left: 4 },
        textColor: [30, 30, 30], lineColor: [228, 228, 222], lineWidth: 0.18,
        fillColor: [255, 255, 255],
      },
      columnStyles: pColStyles,
      didParseCell: function (data) {
        if (data.section !== 'body') return;
        var meta = pMeta[data.row.index];
        if (!meta) return;
        if (meta.isPast) {
          data.cell.styles.textColor = [165, 165, 165];
          data.cell.styles.fillColor = [248, 248, 248];
        } else if (meta.isToday) {
          data.cell.styles.fillColor = [228, 255, 100];
          data.cell.styles.textColor = [20, 20, 20];
          data.cell.styles.fontStyle = 'bold';
        } else if (data.row.index % 2 === 0) {
          data.cell.styles.fillColor = [244, 255, 185];
        } else {
          data.cell.styles.fillColor = [250, 255, 220];
        }
      },
      didDrawPage: function () { drawPageFooter(); },
    });
  }

  /* Write page numbers after all pages are finalised */
  var totalPages = doc.internal.getNumberOfPages();
  for (var pg = 1; pg <= totalPages; pg++) {
    doc.setPage(pg);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(5.5);
    doc.setTextColor(130, 130, 130);
    doc.text('Page ' + pg + ' of ' + totalPages, W - MX, H - 5.5, { align: 'right' });
  }

  doc.save('ASAK – Rehearsal Schedule.pdf');
}

/* ── MUSIC PLAYER ──
   Only set up the first time the Soundtrack modal is opened (mirrors
   loadPDF() below) — no point wiring up an AudioContext and a running
   requestAnimationFrame loop for visitors who never open it.
   Plays straight from /tools/asimpleactofkindness/audio/. Tracks are lazy —
   audio.src is only set (and therefore only fetched, since preload="none")
   at the moment a track actually starts playing, whether via Play, Next/
   Previous, or auto-advance at the end of a track. Modelled on the player at
   blakestringer.com's Music section, trimmed to what this page needs (no
   shuffle — just a straight playlist in the order below). */
var musicLoaded = false;
function loadMusic() {
  if (musicLoaded) return;
  musicLoaded = true;

  var audio      = document.getElementById('music-audio');
  var playerEl   = document.getElementById('music-player');
  var playBtn    = document.getElementById('music-play-btn');
  var prevBtn    = document.getElementById('music-prev-btn');
  var nextBtn    = document.getElementById('music-next-btn');
  var nameEl     = document.getElementById('music-track-name');
  var timeEl     = document.getElementById('music-time');
  var cueEl      = document.getElementById('music-cue');
  var queueBtn   = document.getElementById('music-queue-btn');
  var queuePanel = document.getElementById('music-queue');
  var queueList  = document.getElementById('music-queue-list');
  var progBar    = document.getElementById('music-progress');
  var progFill   = document.getElementById('music-progress-fill');
  var thumb      = document.getElementById('music-progress-thumb');
  var canvas     = document.getElementById('music-vis');
  var iconPlay   = playBtn.querySelector('.music-icon-play');
  var iconPause  = playBtn.querySelector('.music-icon-pause');
  var audioCtx, analyser, source, dragging = false;

  /* ── Playlist ──
     In show order (Act, then page) — matches the cue sheet, so playing
     straight through follows the production. `file` must match the filename
     in audio/ exactly (the live server is case-sensitive even where a local
     filesystem isn't). */
  var TRACKS = [
    { title: "Sot-l'y-laisse", artist: 'Odezenne & Rone', act: 1, page: 1,
      context: 'Start of Act 1', file: "01 Sot-l'y-laisse.mp3" },
    { title: 'F L Y', artist: 'Spectrum', act: 1, page: 4,
      context: 'End of Scene 1', file: '02 F L Y.mp3' },
    { title: 'Martini', artist: 'The Presets', act: 1, page: 4,
      context: 'In the background, start of Scene 2', file: '03 Martini.mp3' },
    { title: "I'm Still Standing", artist: 'Elton John', act: 1, page: 7,
      context: 'End of Scene 2', file: "2-03 I'm Still Standing (Remastered).mp3" },
    { title: 'Sounds of Then (This is Australia)', artist: 'GANGgajang', act: 1, page: 32,
      context: 'End of Act 1', file: '02 Sounds Of Then (This Is Australia).mp3' },
    { title: 'Love on my Mind', artist: 'Freemasons & Amanda Wilson', act: 2, page: 34,
      context: 'Start of Act 2', file: '03 Love On My Mind (feat. Amanda Wilson) [Radio Edit].mp3' },
    { title: 'Dirty Cash (Money Talks)', artist: 'The Adventures of Stevie V', act: 2, page: 55,
      context: 'End of Scene 1', file: '01 Dirty Cash (Money Talks) [Sold Out 7 Inch Mix].mp3' },
    { title: 'House', artist: 'Charli XCX & John Cale', act: 2, page: 65,
      context: 'JULIE ring sequence', file: '01 House featuring John Cale.mp3' },
    { title: 'Zoom', artist: "Fat Larry's Band", act: 2, page: 65,
      context: 'After JULIE ring sequence', file: '03 Zoom.mp3' }
  ];
  var order = TRACKS.map(function (_, i) { return i; });
  var pos = 0, loadedPos = -1;

  function track()      { return TRACKS[order[pos]]; }
  function trackSrc(t)  { return encodeURI('/tools/asimpleactofkindness/audio/' + t.file); }
  function trackLabel(t) { return t.title; }
  /* cueLabel includes the artist (stands alone, next to just the title up
     top); showCue doesn't (used in the playlist rows, where the artist is
     already shown right next to the title). */
  function showCue(t)  { return 'Act ' + t.act + ', p.' + t.page + ' — ' + t.context; }
  function cueLabel(t) { return t.artist + ' · ' + showCue(t); }

  function setControlsEnabled(on) {
    playBtn.disabled = prevBtn.disabled = nextBtn.disabled = queueBtn.disabled = !on;
  }

  function updateTrackDisplay() {
    var t = track();
    nameEl.textContent = trackLabel(t);
    cueEl.textContent = cueLabel(t);
    playBtn.setAttribute('aria-label', (audio.paused ? 'Play ' : 'Pause ') + trackLabel(t));
    renderQueue();
  }

  /* ── Playlist dropdown ── rebuilt on every track change so the highlighted
     "now playing" row always matches. Each row shows the song + artist and,
     underneath, where it lands in the show — the whole reason this playlist
     is ordered by Act/page rather than the order the mp3s were dropped in. */
  function renderQueue() {
    queueList.innerHTML = order.map(function (trackIdx, i) {
      var t = TRACKS[trackIdx], current = i === pos;
      return '<button type="button" class="music-queue-item" role="option" aria-current="' + current + '" data-pos="' + i + '">' +
        '<span class="music-queue-num">' + (i + 1) + '</span>' +
        '<span class="music-queue-info">' +
          '<span class="music-queue-title">' + escHtmlShared(trackLabel(t)) + ' — ' + escHtmlShared(t.artist) + '</span>' +
          '<span class="music-queue-cue">' + escHtmlShared(showCue(t)) + '</span>' +
        '</span></button>';
    }).join('');
  }
  function openQueue() {
    queuePanel.hidden = false;
    queueBtn.setAttribute('aria-expanded', 'true');
    queueBtn.classList.add('active');
  }
  function closeQueue() {
    queuePanel.hidden = true;
    queueBtn.setAttribute('aria-expanded', 'false');
    queueBtn.classList.remove('active');
  }
  queueBtn.addEventListener('click', function () { queuePanel.hidden ? openQueue() : closeQueue(); });
  queueList.addEventListener('click', function (e) {
    var item = e.target.closest('.music-queue-item');
    if (!item) return;
    switchTrack(parseInt(item.dataset.pos, 10));
    closeQueue();
  });
  document.addEventListener('click', function (e) {
    if (queuePanel.hidden) return;
    if (queueBtn.contains(e.target) || queuePanel.contains(e.target)) return;
    closeQueue();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !queuePanel.hidden) closeQueue(); });

  /* Switch to `newPos`. If audio was already playing, the new track keeps
     playing (skip-while-listening); if paused, it's just cued.
     `forcePlay` overrides this — used when a track finishes naturally (the
     "ended" event fires with audio already paused, but the playlist should
     keep going). */
  function switchTrack(newPos, forcePlay) {
    if (!TRACKS.length) return;
    var wasPlaying = forcePlay || !audio.paused;
    audio.pause();
    pos = ((newPos % order.length) + order.length) % order.length;
    audio.src = trackSrc(track());
    loadedPos = pos;
    setProgress(0);
    timeEl.textContent = '0:00';
    updateTrackDisplay();
    updateMediaSessionMetadata();
    if (wasPlaying) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().catch(function () {});
    }
  }

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function setProgress(pct) {
    progFill.style.width = pct + '%';
    thumb.style.left     = pct + '%';
  }

  /* ── Visualiser ── this page doesn't redefine --lime per theme, so the bar
     colour is just the page's own lime accent, no light/dark switch needed. */
  function barColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--lime').trim() || '#D4FF1A';
  }

  function resizeCanvas() {
    var dpr  = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w    = Math.round(rect.width  * dpr);
    var h    = Math.round(rect.height * dpr);
    if (w === 0 || h === 0 || (canvas.width === w && canvas.height === h)) return;
    canvas.width  = w;
    canvas.height = h;
  }

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    /* Mobile OSes suspend the AudioContext far more readily than a plain
       <audio> element (backgrounding the tab, locking the phone) — since the
       visualiser routes playback THROUGH this context, sound cuts out the
       moment that happens even though `audio` itself is still "playing". Put
       it straight back the instant it's suspended while we expect to be
       audible, so background/lock-screen playback keeps going. */
    audioCtx.addEventListener('statechange', function () {
      if (audioCtx.state === 'suspended' && !audio.paused) audioCtx.resume().catch(function () {});
    });
  }

  function draw() {
    requestAnimationFrame(draw);
    resizeCanvas();
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.width / dpr, H = canvas.height / dpr;
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var color = barColor();
    var nBars = 20, gap = 3;
    var barW = (W - gap * (nBars - 1)) / nBars;
    var vals = new Float32Array(nBars);

    if (analyser && !audio.paused) {
      var bins = analyser.frequencyBinCount;
      var data = new Uint8Array(bins);
      analyser.getByteFrequencyData(data);
      var maxBin = Math.floor(bins * 0.40); /* cap at ~8.8kHz so all bars land on musically active frequencies */
      for (var i = 0; i < nBars; i++) {
        var t = i / (nBars - 1);
        var b = Math.min(bins - 1, Math.round(Math.pow(maxBin, t)));
        var sum = 0, cnt = 0;
        for (var d = -1; d <= 1; d++) { var idx = Math.max(0, Math.min(bins - 1, b + d)); sum += data[idx]; cnt++; }
        vals[i] = sum / cnt / 255;
      }
    } else {
      var tt = performance.now() / 1000;
      for (var j = 0; j < nBars; j++) {
        var x = j / (nBars - 1);
        vals[j] = (Math.sin(x * Math.PI * 2 + tt * 0.6) * 0.5 + 0.5) * 0.18;
      }
    }

    ctx.fillStyle = color;
    for (var k = 0; k < nBars; k++) {
      var xx = k * (barW + gap);
      var barH = Math.max(3, vals[k] * H * 0.92);
      ctx.globalAlpha = 0.3 + vals[k] * 0.7;
      ctx.fillRect(xx, H - barH, barW, barH);
    }
    ctx.globalAlpha = 1;
  }

  /* ── Media Session (lock screen / control centre / background playback) ──
     Registering a session is what tells mobile OSes this page is playing
     real media, which is what makes them willing to keep audio going once
     the tab is backgrounded or the phone is locked. It also drives the
     native title/prev/play-pause/next widget on the lock screen. */
  var hasMediaSession = 'mediaSession' in navigator;
  function updateMediaSessionMetadata() {
    if (!hasMediaSession || !TRACKS.length) return;
    var t = track();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: trackLabel(t),
      artist: t.artist,
      album: 'A Simple Act of Kindness',
      artwork: [{ src: '/Images/favicon.png', sizes: '180x180', type: 'image/png' }]
    });
  }
  if (hasMediaSession) {
    navigator.mediaSession.setActionHandler('play',         function () { doPlay(); });
    navigator.mediaSession.setActionHandler('pause',        function () { doPause(); });
    navigator.mediaSession.setActionHandler('previoustrack', function () { switchTrack(pos - 1, true); });
    navigator.mediaSession.setActionHandler('nexttrack',     function () { switchTrack(pos + 1, true); });
  }

  /* ── Play / Pause ── */
  function doPlay() {
    if (!TRACKS.length) return;
    if (loadedPos === -1) { audio.src = trackSrc(track()); loadedPos = pos; } /* lazy: first load happens here */
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play().catch(function () {});
  }
  function doPause() { audio.pause(); }

  playBtn.addEventListener('click', function () { audio.paused ? doPlay() : doPause(); });
  prevBtn.addEventListener('click', function () { switchTrack(pos - 1); });
  nextBtn.addEventListener('click', function () { switchTrack(pos + 1); });

  /* Safety net: if the AudioContext got suspended while backgrounded (some
     browsers only allow resuming once the page is genuinely foregrounded
     again, rather than on the statechange listener in initAudio() alone). */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended' && !audio.paused) {
      audioCtx.resume().catch(function () {});
    }
  });

  audio.addEventListener('play', function () {
    iconPlay.style.display  = 'none';
    iconPause.style.display = '';
    playBtn.setAttribute('aria-label', 'Pause ' + trackLabel(track()));
    progFill.classList.add('playing');
    if (hasMediaSession) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', function () {
    iconPlay.style.display  = '';
    iconPause.style.display = 'none';
    playBtn.setAttribute('aria-label', 'Play ' + trackLabel(track()));
    progFill.classList.remove('playing');
    if (hasMediaSession) navigator.mediaSession.playbackState = 'paused';
  });
  audio.addEventListener('ended', function () {
    /* Keep the playlist going — advance to the next track and play it,
       wrapping back to the start once the whole list has played through. */
    switchTrack(pos + 1, true);
  });
  audio.addEventListener('timeupdate', function () {
    /* audio.seeking guards a race on an unbuffered scrub: currentTime is set
       immediately in seekFromEvent, but actually landing there needs a
       network fetch (preload="none" + un-downloaded range) that takes a
       moment. A timeupdate firing in that gap still reports the OLD
       position, which would otherwise snap the just-set progress bar back
       until the seek actually completes. */
    if (!audio.duration || dragging || audio.seeking) return;
    setProgress(audio.currentTime / audio.duration * 100);
    timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  });

  /* ── Scrubber (click + drag) ── */
  function seekFromEvent(e) {
    if (!TRACKS.length) return;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var r = progBar.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    setProgress(pct * 100);
    if (audio.duration) {
      audio.currentTime = pct * audio.duration;
      timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }
  }
  progBar.addEventListener('mousedown', function (e) {
    dragging = true;
    progBar.classList.add('dragging');
    progFill.style.transition = 'none';
    seekFromEvent(e);
  });
  progBar.addEventListener('touchstart', function (e) {
    dragging = true;
    progBar.classList.add('dragging');
    progFill.style.transition = 'none';
    seekFromEvent(e);
  }, { passive: true });
  document.addEventListener('mousemove', function (e) { if (dragging) seekFromEvent(e); });
  document.addEventListener('touchmove', function (e) { if (dragging) seekFromEvent(e); }, { passive: true });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    progBar.classList.remove('dragging');
    progFill.style.transition = '';
  }
  document.addEventListener('mouseup',  endDrag);
  document.addEventListener('touchend', endDrag);

  /* ── Init ── */
  if (!TRACKS.length) {
    playerEl.classList.add('empty');
    setControlsEnabled(false);
    nameEl.textContent = 'No tracks yet — check back soon';
  } else {
    updateTrackDisplay();
    updateMediaSessionMetadata();
  }

  draw(); /* start idle animation immediately */
}
</script>
</body>
