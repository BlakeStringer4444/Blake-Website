<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Simple Act of Kindness | Blake Stringer</title>
  <link rel="icon" type="image/png" href="/Images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lime:    #D4FF1A;
      --purple:  #6448e4;
      --black:   #0a0a0a;
      --bg:      #f5f5f0;
      --card-bg: #ffffff;
      --fg:      #111111;
      --muted:   rgba(0,0,0,0.45);
      --border:  rgba(0,0,0,0.1);
      --font:    'DM Mono', monospace;
    }
    [data-theme="dark"] {
      --bg:      #0e0e0e;
      --card-bg: #141414;
      --fg:      rgba(255,255,255,0.85);
      --muted:   rgba(240,240,235,0.4);
      --border:  rgba(255,255,255,0.09);
    }
    [data-theme="terminal"] {
      --bg:      #000000;
      --card-bg: #111111;
      --fg:      #D4FF1A;
      --muted:   rgba(212,255,26,0.4);
      --border:  rgba(212,255,26,0.14);
    }

    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 13px; transition: background 0.2s, color 0.2s; }

    /* ── HEADER ── */
    #app { height: 100%; display: flex; flex-direction: column; }

    .asak-header { background: var(--black); padding: 28px 48px 24px; flex-shrink: 0; }
    .asak-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .asak-back-link { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(212,255,26,0.6); text-decoration: none; transition: color 0.15s; }
    .asak-back-link:hover { color: var(--lime); }
    .asak-header-actions { display: flex; gap: 8px; }
    .asak-icon-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(240,240,235,0.7); font-family: var(--font); font-size: 11px;
      letter-spacing: 1px; padding: 5px 10px; cursor: pointer; border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .asak-icon-btn:hover { background: rgba(255,255,255,0.12); color: var(--lime); }
    .asak-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(42px, 7vw, 88px); letter-spacing: 5px; color: var(--lime); line-height: 1; }
    .asak-subtitle { font-family: var(--font); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(212,255,26,0.4); margin-top: 6px; }

    /* ── 2×2 GRID ── */
    .asak-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      flex: 1;
      min-height: 0;
    }
    .quad { border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; min-height: 300px; }
    .quad-header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 10px 18px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .quad-title { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); font-weight: 400; }
    .quad-body { flex: 1; overflow-y: auto; background: var(--bg); }
    .quad-body::-webkit-scrollbar { width: 4px; }
    .quad-body::-webkit-scrollbar-track { background: transparent; }
    .quad-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Q1: SCHEDULE ── */
    .week-label {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
      padding: 10px 18px 6px; background: var(--bg); position: sticky; top: 0; z-index: 1;
      border-bottom: 1px solid var(--border);
    }
    .sched-row {
      display: grid; grid-template-columns: 88px 1fr auto;
      gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border);
      align-items: start; transition: opacity 0.15s;
    }
    .sched-row.past { opacity: 0.32; }
    .sched-row.today { background: rgba(212,255,26,0.07); border-left: 3px solid var(--lime); padding-left: 15px; }
    .sched-row.next-up { background: rgba(100,72,228,0.06); border-left: 3px solid var(--purple); padding-left: 15px; }
    .sched-row.performance { background: rgba(212,255,26,0.03); }
    .sched-row.performance.today { background: rgba(212,255,26,0.12); }
    .sched-date { font-size: 11px; font-weight: 500; color: var(--fg); }
    .sched-time { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .sched-what { font-size: 11px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sched-sub { font-size: 9px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sched-badge { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; white-space: nowrap; }
    .badge-show { background: var(--lime); color: #000; }
    .badge-today { background: var(--lime); color: #000; }
    .badge-next { background: var(--purple); color: #fff; }
    .sched-loading { padding: 24px 18px; font-size: 10px; letter-spacing: 1px; color: var(--muted); text-align: center; }
    .sched-error { padding: 24px 18px; font-size: 10px; letter-spacing: 1px; color: #ef4444; text-align: center; line-height: 1.8; }

    /* ── Q2: CAST & CREW ── */
    .placeholder-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; gap: 10px; }
    .placeholder-icon { font-size: 28px; opacity: 0.3; }
    .placeholder-text { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

    /* ── Q3: PDF VIEWER ── */
    #pdf-canvas-container { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    #pdf-canvas-container canvas { max-width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
    .pdf-controls { display: flex; align-items: center; gap: 8px; }
    .pdf-nav-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(240,240,235,0.7); font-family: var(--font); font-size: 11px;
      padding: 3px 9px; cursor: pointer; transition: opacity 0.15s;
    }
    .pdf-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .pdf-page-info { font-size: 9px; color: rgba(212,255,26,0.5); }

    /* ── Q4: COUNTDOWN ── */
    .countdown-body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 32px 20px; gap: 20px; }
    .countdown-eyebrow { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .countdown-blocks { display: flex; align-items: flex-end; gap: 4px; }
    .cd-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cd-sep { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 5vw, 60px); color: var(--lime); line-height: 1; padding-bottom: 14px; opacity: 0.5; }
    .cd-num { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 6vw, 72px); color: var(--fg); line-height: 1; min-width: 2ch; text-align: center; }
    .cd-unit { font-size: 7px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .countdown-date-str { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); }
    .countdown-live { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--lime); letter-spacing: 4px; text-align: center; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .asak-header { padding: 18px 20px 14px; }
      .asak-title { font-size: clamp(34px, 11vw, 56px); }
      .asak-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
      .quad { min-height: 260px; max-height: 420px; }
      .sched-row { grid-template-columns: 76px 1fr auto; gap: 8px; padding: 8px 14px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header class="asak-header">
    <div class="asak-header-top">
      <a class="asak-back-link" href="/">← blakestringer.com</a>
      <div class="asak-header-actions">
        <button class="asak-icon-btn" id="font-btn" title="Adjust text size">Aa</button>
        <button class="asak-icon-btn" id="theme-btn" title="Toggle theme">☾</button>
      </div>
    </div>
    <h1 class="asak-title">A Simple Act of Kindness</h1>
    <p class="asak-subtitle">Brink Productions · Season 2026</p>
  </header>

  <main class="asak-grid">

    <!-- Q1: Rehearsal Schedule -->
    <section class="quad">
      <div class="quad-header">
        <span class="quad-title">Rehearsal Schedule</span>
      </div>
      <div class="quad-body" id="sched-body">
        <div class="sched-loading">Loading schedule…</div>
      </div>
    </section>

    <!-- Q2: Cast & Crew -->
    <section class="quad">
      <div class="quad-header">
        <span class="quad-title">Cast &amp; Crew</span>
      </div>
      <div class="quad-body">
        <div class="placeholder-box">
          <div class="placeholder-icon">🎭</div>
          <div class="placeholder-text">Coming soon</div>
        </div>
      </div>
    </section>

    <!-- Q3: Script PDF -->
    <section class="quad">
      <div class="quad-header">
        <span class="quad-title">The Script</span>
        <div id="pdf-controls" class="pdf-controls" style="display:none;">
          <button class="pdf-nav-btn" id="pdf-prev" disabled>‹</button>
          <span class="pdf-page-info" id="pdf-page-info"></span>
          <button class="pdf-nav-btn" id="pdf-next" disabled>›</button>
        </div>
      </div>
      <div class="quad-body" id="pdf-body">
        <div class="placeholder-box" id="pdf-placeholder">
          <div class="placeholder-icon">📄</div>
          <div class="placeholder-text">Script coming soon</div>
        </div>
        <div id="pdf-canvas-container"></div>
      </div>
    </section>

    <!-- Q4: Countdown -->
    <section class="quad">
      <div class="quad-header">
        <span class="quad-title">Opening Night</span>
      </div>
      <div class="quad-body">
        <div class="countdown-body" id="countdown-body">
          <div class="countdown-eyebrow" id="cd-eyebrow">until curtain up</div>
          <div class="countdown-blocks" id="cd-blocks">
            <div class="cd-block">
              <div class="cd-num" id="cd-days">--</div>
              <div class="cd-unit">days</div>
            </div>
            <div class="cd-sep">:</div>
            <div class="cd-block">
              <div class="cd-num" id="cd-hours">--</div>
              <div class="cd-unit">hours</div>
            </div>
            <div class="cd-sep">:</div>
            <div class="cd-block">
              <div class="cd-num" id="cd-mins">--</div>
              <div class="cd-unit">mins</div>
            </div>
            <div class="cd-sep">:</div>
            <div class="cd-block">
              <div class="cd-num" id="cd-secs">--</div>
              <div class="cd-unit">secs</div>
            </div>
          </div>
          <div class="countdown-date-str">6 November 2026 · 8:00pm</div>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
/* ── THEME ── */
(function () {
  var themes = ['light', 'dark', 'terminal'];
  var icons  = { light: '☾', dark: '◐', terminal: '☀︎' };
  var saved  = localStorage.getItem('asak-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  var btn = document.getElementById('theme-btn');
  btn.textContent = icons[saved] || '☾';
  btn.addEventListener('click', function () {
    var cur  = document.documentElement.getAttribute('data-theme') || 'light';
    var next = themes[(themes.indexOf(cur) + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('asak-theme', next);
    btn.textContent = icons[next];
  });
})();

/* ── FONT ZOOM ── */
(function () {
  var desktop = window.innerWidth >= 769;
  var levels  = desktop ? [1.0, 1.2] : ['', 1.15];
  var idx     = parseInt(localStorage.getItem('asak-zoom') || '0', 10);
  if (idx >= levels.length) idx = 0;
  function apply(i) { document.documentElement.style.zoom = levels[i]; localStorage.setItem('asak-zoom', i); }
  apply(idx);
  document.getElementById('font-btn').addEventListener('click', function () {
    apply((parseInt(localStorage.getItem('asak-zoom') || '0', 10) + 1) % levels.length);
  });
})();

/* ── COUNTDOWN ── */
(function () {
  /* Opening night: Fri 6 Nov 2026, 8pm ACDT (UTC+10:30 — Adelaide DST) */
  var target = new Date('2026-11-06T20:00:00+10:30');

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var diff = target - Date.now();
    if (diff <= 0) {
      document.getElementById('cd-eyebrow').textContent = 'now showing';
      document.getElementById('cd-blocks').innerHTML =
        '<div class="countdown-live">CURTAIN UP</div>';
      return;
    }
    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent  = d;
    document.getElementById('cd-hours').textContent = pad(h);
    document.getElementById('cd-mins').textContent  = pad(m);
    document.getElementById('cd-secs').textContent  = pad(s);
  }
  tick();
  setInterval(tick, 1000);
})();

/* ── SCHEDULE ── */
(function () {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQir7qILS7kW7vkbl7FkYSLiDoKFKE2yNOaque6STmHbyz4yj2dzZIGV2JtAzL7Pfh219tGlivT69fV/pub?output=csv';
  var schedBody = document.getElementById('sched-body');

  /* ── CSV parser ── */
  function parseCSVRow(line) {
    var result = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  function parseCSV(text) {
    var lines   = text.split(/\r?\n/);
    var headers = parseCSVRow(lines[0]).map(function (h) { return h.trim().toLowerCase(); });
    var rows    = [];
    for (var i = 1; i < lines.length; i++) {
      var ln = lines[i].trim();
      if (!ln) continue;
      var cols = parseCSVRow(ln);
      var obj  = {};
      headers.forEach(function (h, j) { obj[h] = (cols[j] || '').trim(); });
      if (obj.datetime) rows.push(obj);
    }
    return rows;
  }

  /* ── Date helpers ── */
  function parseDT(str) {
    /* Expects YYYY-MM-DD-HH-MM */
    if (!str) return null;
    var p = str.split('-');
    if (p.length < 3) return null;
    var yr = parseInt(p[0], 10), mo = parseInt(p[1], 10) - 1, dy = parseInt(p[2], 10);
    var hr = p.length >= 4 ? parseInt(p[3], 10) : 0;
    var mn = p.length >= 5 ? parseInt(p[4], 10) : 0;
    if (isNaN(yr) || isNaN(mo) || isNaN(dy)) return null;
    return new Date(yr, mo, dy, hr, mn);
  }

  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtDate(d) { return DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + MON_NAMES[d.getMonth()]; }
  function fmtTime(d) {
    var h = d.getHours(), m = d.getMinutes(), ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return h + (m ? ':' + String(m).padStart(2, '0') : '') + ampm;
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Render ── */
  function render(rows) {
    var now   = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    /* Find first event that hasn't started yet */
    var nextIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      var d = parseDT(rows[i].datetime);
      if (d && d > now) { nextIdx = i; break; }
    }

    /* Group by week column */
    var groups = [], groupMap = {};
    rows.forEach(function (row, idx) {
      var wk = row.week || 'Schedule';
      if (!groupMap[wk]) { groupMap[wk] = []; groups.push({ label: wk, rows: groupMap[wk] }); }
      groupMap[wk].push({ row: row, idx: idx });
    });

    var html = '';
    groups.forEach(function (g) {
      html += '<div class="week-group"><div class="week-label">' + escH(g.label) + '</div>';
      g.rows.forEach(function (entry) {
        var row = entry.row, idx = entry.idx;
        var d = parseDT(row.datetime);
        if (!d) return;

        var isToday  = sameDay(d, today);
        var isPast   = !isToday && d < now;
        var isNext   = idx === nextIdx && !isToday;
        var isPerf   = !!row.performance;

        var cls = 'sched-row';
        if (isPast)  cls += ' past';
        if (isToday) cls += ' today';
        if (isNext)  cls += ' next-up';
        if (isPerf)  cls += ' performance';

        var badge = '';
        if (isToday) {
          badge = '<span class="sched-badge badge-today">today</span>';
        } else if (isNext) {
          badge = '<span class="sched-badge badge-next">next</span>';
        } else if (isPerf && !isPast) {
          badge = '<span class="sched-badge badge-show">' + escH(row.performance) + '</span>';
        }

        var what = row.context || (row.act || row.scene ? [row.act, row.scene].filter(Boolean).join(' · ') : (isPerf ? 'Performance' : 'Rehearsal'));
        var sub  = '';
        if (row.pages)      sub += 'pp ' + row.pages;
        if (row.characters) sub += (sub ? ' · ' : '') + row.characters;

        var anchor = isToday ? ' id="sched-today"' : (isNext ? ' id="sched-next"' : '');
        html += '<div class="' + cls + '"' + anchor + '>';
        html += '<div><div class="sched-date">' + fmtDate(d) + '</div><div class="sched-time">' + fmtTime(d) + '</div></div>';
        html += '<div><div class="sched-what">' + escH(what) + '</div>' + (sub ? '<div class="sched-sub">' + escH(sub) + '</div>' : '') + '</div>';
        html += '<div>' + badge + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    schedBody.innerHTML = html || '<div class="sched-loading">No schedule entries found.</div>';

    /* Scroll to today / next */
    setTimeout(function () {
      var el = document.getElementById('sched-today') || document.getElementById('sched-next');
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 150);
  }

  fetch(CSV_URL)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) {
      var rows = parseCSV(txt);
      if (!rows.length) throw new Error('empty');
      render(rows);
    })
    .catch(function (err) {
      schedBody.innerHTML = '<div class="sched-error">Could not load schedule.<br>' + escH(err.message) + '</div>';
    });
})();

/* ── PDF VIEWER ── */
(function () {
  /* Place script.pdf in the same folder when ready */
  var PDF_PATH = '/tools/asimpleactofkindness/script.pdf';

  fetch(PDF_PATH, { method: 'HEAD' })
    .then(function (r) { if (r.ok) initPDF(PDF_PATH); })
    .catch(function () { /* placeholder stays */ });

  function initPDF(url) {
    if (typeof pdfjsLib === 'undefined') return;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.getElementById('pdf-placeholder').style.display = 'none';
    document.getElementById('pdf-controls').style.display    = 'flex';
    var container = document.getElementById('pdf-canvas-container');
    var prevBtn   = document.getElementById('pdf-prev');
    var nextBtn   = document.getElementById('pdf-next');
    var pageInfo  = document.getElementById('pdf-page-info');

    var pdfDoc = null, curPage = 1, numPages = 0, rendering = false;

    pdfjsLib.getDocument(url).promise.then(function (pdf) {
      pdfDoc    = pdf;
      numPages  = pdf.numPages;
      renderPage(1);
    });

    function renderPage(n) {
      if (rendering) return;
      rendering = true;
      curPage   = n;
      prevBtn.disabled = n <= 1;
      nextBtn.disabled = n >= numPages;
      pageInfo.textContent = n + ' / ' + numPages;
      pdfDoc.getPage(n).then(function (page) {
        var scale = Math.min((container.clientWidth - 24) / page.getViewport({ scale: 1 }).width, 2);
        var vp     = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        canvas.width  = vp.width;
        canvas.height = vp.height;
        container.innerHTML = '';
        container.appendChild(canvas);
        page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise
          .then(function () { rendering = false; });
      });
    }

    prevBtn.addEventListener('click', function () { if (curPage > 1) renderPage(curPage - 1); });
    nextBtn.addEventListener('click', function () { if (curPage < numPages) renderPage(curPage + 1); });
  }
})();
</script>
</body>
</html>
